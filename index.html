 检查（5.715 vs 实际 11.43ns），下轮 setup 违例数可能下降，勿误读为其他变化。\n\n## 0917 深夜-6：MPW 定稿（分时钟族 2/0.73）\n\n### 今日完成（深夜-6）\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| MPW 定稿 | 真实 ip_cons 落地（commit `36145c5`，全英文注释）：`set_max_delay 14` ×4 口（=2M23 原值）+ 分时钟族 MPW | ✅ |\n| 活时钟族 | `set_min_pulse_width -low -high 2 [get_clocks {NORMAL_CLK_SHORT/LONG SD_CLK_SHORT/LONG SD_CLK_INV_SHORT/LONG}]`（÷2 链，pulse 3.81/5.715，余量 1.81/3.715） | ✅ |\n| 1.905-pulse 族 | `set_min_pulse_width -low -high 0.73 [get_clocks {DCLK_DATA_SHORT/LONG DCLK_DATA_MUX_SHORT/LONG SD_CLK_DPLC_SHORT/LONG SD_CLK_INV_DPLC_SHORT/LONG}]`（0.73=1.905−1.175，与 3G 等余量；**不设 false_path**，检查仍有效，真实占空比恶化会报） | ✅ |\n| pulse 概念澄清 | pulse=周期一半**只对 50% 占空比成立**（LONG 3.81→1.905、6.35→3.175）；SHORT 链 edges{1 3 4} 低相=T/3（5.715→1.905、9.525→3.175）；MPW 查较短那一相 | ✅ |\n| 关键事实修正 | 5G(no-DPLC) 口上活时钟 = ÷2 链（CLKGEN.v:179/185 mux + ip_cons L57-61 master=NORMAL_CLK_*），pulse 3.81/5.715，**不是 1.905** | ✅ |\n| 遗留安排 | FIXME 块（ip_cons L99-131）端口时钟定义留批次 2；set_case_analysis 本轮未启用（留作后续 setup 基线评审项） | ⏳ |\n\n### 关键结论（深夜-6）\n\n1. **\"余量\"是结果不是规格**：spec 是绝对值 2ns（面板采样需求），余量随 pulse 自然变化——5G 时 1.81/3.715 比 3G 的 1.175 更宽，不存在\"必须设 1.905−1.175 保余量\"的问题\n2. **分时钟族的宽松阈值（0.73）**是\"不能用 false_path、又要幻影时钟闭嘴\"时的诚实替代：检查仍开着，真实恶化照样抓\n3. 俊杰答疑\"DPLC clk 就是 RX_CLK\" → SDC 链条结构本来就对（DCLK_DATA_LONG=RX_CLK÷1），错的只是 RX_CLKP 值；3G 周期项目里早有 `DPLC_CLKP=6.35`（clk_period.tcl:19）；FIXME 块头注释 \"DRD output clock for pulsewidth requirement\" 证明 spec=2 一直在文件里\n\n### 备注（深夜-6）\n\n- 实践站已同步**案例 10 + 心法 13/14/15**（team-share-public `910e2ea`，index 统计 9→10 案例）\n- 下轮 run 观察点：MPW 报表 8 条幻影应清零；活时钟族应全过（3.81/5.715 > 2）\n\n## 0917 深夜-7：案例 10 方案修正（case_analysis 启用双 mux / 0.73 限定 LONG 族 / 多行结构）\n\n### 今日完成（深夜-7）\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 方案修正① | `set_case_analysis` **必须启用**（初版\"未启用\"作废）：两行打在两个时钟 mux 上——`u_gate_MUX_SD_CLK/S`（PANEL_DPLC_CLK_SEL=0，no DPLC）+ `u_gate_MUX_DCLK_DATA/S`（SP=0，LONG 编码） | ✅ |\n| 方案修正② | 0.73 **只给 LONG 族**（初版是整个 1.905 族含 SHORT）：仅 DCLK_DATA_LONG / DCLK_DATA_MUX_LONG / SD_CLK_DPLC_LONG / SD_CLK_INV_DPLC_LONG 4 个对象；2ns 也只给 LONG 正常腿（NORMAL/SD_CLK/SD_CLK_INV_LONG）；SHORT 族不设值（C3 留注释模板） | ✅ |\n| 方案修正③ | 多行结构（按 (A) 模式选择 / (B) 14×4 口 / (C1)(C2)(C3) 分段展开，全英文注释） | ✅ |\n| 网站修正 | 实践站 ch10 案例 10\"最终方案\"小节整体替换为终版结构 + 结论/证据文件联动 + 心法 14 更新 | ✅ |\n\n### 关键结论（深夜-7）\n\n- **SP 是长短编码选择脚**（`CLKGEN.v:130-135`：0=LONG/PIX_CLK_LONG、1=SHORT/DCLK_DIV1P5_SHORT）。\n- ⚠️ **SP=0 会杀掉整个 SHORT 编码时钟族 → 本轮 run 是新基线**，签核前必须确认 LONG 是出货编码。\n- 分时钟族/分模式设检查阈值：幻影时钟要么 case 杀掉，要么给等余量阈值（0.73=1.905−1.175），不要统一给 spec 值。\n\n### 提交\n\n- HK1V11 主仓库终版 ip_cons：commit `c15fe91`\n\n## 0917 深夜-8：最终定论（DPLC_CASE 速率开关 / 一套约束四种 case）\n\n### 今日完成（深夜-8）\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 维度定论 | MPW 值只依赖速率轴（DPLC/noDPLC），与编码轴无关：LONG/SHORT 完全对称（正常腿都 2、数据腿都 0.73；LONG 低相=T/2=1.905、SHORT 低相=T/3=1.905，数字相同来历不同） | ✅ |\n| 开关定型 | SP_CASE=出货 strap 静态声明（SP_I 物理引脚绑死，非跑 case 轴）；DPLC_CASE=按 run 翻的速率开关 → **四种 case = 两个开关变量**，不需要 4 份约束、不需要 2M23 式双网表 | ✅ |\n| SHORT 设 0.73 的理由 | SHORT 链 edges {1 3 4}：高相 3.81/低相 1.905（=T/3，不是一半）；MPW 查较短相 → 与 LONG 同值；\"pulse=半周期\"只对 50% 占空比成立 | ✅ |\n| MPW 跟随 DPLC_CASE | 用户挑战被接受（无条件 0.73 是错的）：DPLC_CASE=0 → 0.73（幻影诚实阈值 1.905−1.175）；DPLC_CASE=1 → 2（3G 真规格，pulse 3.175 余量 1.175）；ip_cons if/else 实现 | ✅ `5f78f6f` |\n| clk_period 单套化 | 1V11 单 RX_CLK 管脚多速率 → 正确形式=按 run 切换基础周期：clk_period.tcl 加 DPLC_CASE 开关（1→RX_CLKP=6.35=DPLC_CLKP，0→3.81；info exists guard）；2M23 RX0/RX1=两条并存独立 lane 无需开关，他们 case 只用于 DPSEL_I 数据通路选择 | ✅ `130f773` |\n| 联动清单 | 不联动：set_max_delay 14（绝对值）、正常腿 MPW 2、G1~G8 mc（launch 相对）；待复核：G10 `2×DPLC_CLKP=12.7` 在速率切换下的语义 | ⏳ 后续批次 |\n| 实践站 | 案例 11（DPLC_CASE 与 3G/5G 速率开关）+ 心法 16/17 + 未闭环 2 行；index 统计 10→11 | ✅ `92aafb0` |\n\n### 关键结论（深夜-8）\n\n- **一个物理时钟同时只能有一个周期**：1V11 单 RX_CLK 管脚 5G/3G 两速率 → 按 run 切基础周期 + 同一开关联动 case 与派生值，而不是维护两套时钟定义。\n- 3G 周期项目里早有名字 `DPLC_CLKP=6.35`（clk_period.tcl:19）——缺的从来不是周期定义，是把它接到 RX_CLKP 上的开关。\n\n### 备注\n\n主 agent 另有 3 个审计 subagent 在跑，审计结果另行记录。\n\n## 0917 深夜-9：最终定稿（无 case、clk_period 原始、14 行约束收口）\n\n> 本节为收口定稿。之前深夜-6/7/8 记录的方案（case_analysis 双开关 / DPLC_CASE 速率开关 / MPW if-else）已被用户全部推翻，以本节为唯一准绳。\n\n### 核心设计决策（用户拍板，commit 337c171）\n\n| # | 决策 | 内容 |\n|---|------|------|\n| 1 | **不用 set_case_analysis** | 完全删掉（ip_cons 和 clk_period 都没有）；两族时钟共存传播，各查各的 MPW |\n| 2 | **clk_period.tcl 零修改** | 原始五行：MARGIN / OSC_CLKP / I2C_CLKP / RX_CLKP 3.81 / DPLC_CLKP 6.35——\"大部分路径按 5G（3.81），DPLC 路径按 3G（6.35）\"两档速率共存一次 run |\n| 3 | **ip_cons 仅 14 行新增** | set_max_delay 14 ×4 口（=2M23 原值）+ MPW 2（正常腿 6 对象）+ MPW 0.73（数据/DPLC 腿 8 对象） |\n| 4 | **无 false_path / 无 if-else / 无开关** | 一个 run 覆盖全部产品 case |\n\n### 为什么不需要 case（关键论证）\n\n- MPW 按**时钟对象**设值（非端口），每族带自己的阈值；不活跃的族无 arrival→无检查→自动空转\n- clk_period 老设计本就是双速率共存（RX_CLKP 管大部分 5G + DPLC_CLKP 管 DPLC 3G），无需再拆 run\n- 2M23 需要 DPSEL_I case 是因为他们有 RX0/RX1 两条物理 lane（10.08/17.1 独立时钟域）；1V11 单 RX_CLK + 双速率共存，结构不同\n\n### 被推翻的方案清单（防回流）\n\n| 方案 | 否决理由 |\n|------|---------|\n| DPLC_CASE 速率开关（clk_period if/else） | 老方式（双速率共存）更对，不需要跑两个 case |\n| set_case_analysis 双开关（SP_CASE + DPLC_CASE） | 不需要任何 case 机制 |\n| MPW 按 DPLC_CASE if/else（0.73↔2） | 随 case 一起删，现为固定 2/0.73 |\n| 端口预算 12 / 12.7 | 终值 14（=2M23 原值，覆盖配置路径 12.4） |\n| G12（总线 12.7） | 被 14 覆盖，SUPERSEDED |\n\n### 仍开放\n\n- 下轮 run 验证：MPW 0 违例；setup 与 V2 可比（无 case，SHORT 族不会消失）\n- 批次 2/3/4：FIXME 端口时钟 / DPLC_CLK 生成时钟链 / 数据口 set_output_delay\n- G10 12.7 语义复核；LC_MONBLOCK DCLK_DIV 排除集新网表命中\n- 3G/DPLC 签核（如需：clk_period 改 RX_CLKP 为 6.35 即可）\n\n## 0917 深夜-9：终版定稿（set_case_analysis 全删 / 无 case / 回归分时钟族 MPW）\n\n### 演进链（教训：用户直觉是对的，case 是在解决一个不存在的问题）\n\n| 版本 | 方案 | 结果 |\n|------|------|------|\n| v1 | port 级统一 MPW=1.9 | 8 条违例（幻影速率） |\n| v2 | per-clock MPW 2/0.73 + case_analysis → 双开关/四 case/if-else | 过度工程 |\n| **v3 终版** | **无 case，纯 per-clock MPW 2/0.73** | ✅ 幻影已被 0.73 化解，不需要 case |\n\n### 最终活动约束清单（ip_cons HEAD 337c171，仅 14 行 + G 系列）\n\n```tcl\nset_max_delay 14 -to CLKA_L / CLKB_L / CLKA_R / CLKB_R\nset_min_pulse_width -low -high 2    [get_clocks NORMAL_CLK_LONG/SD_CLK_LONG/SD_CLK_INV_LONG/NORMAL_CLK_SHORT/SD_CLK_SHORT/SD_CLK_INV_SHORT]\nset_min_pulse_width -low -high 0.73 [get_clocks DCLK_DATA_LONG/DCLK_DATA_MUX_LONG/SD_CLK_DPLC_LONG/SD_CLK_INV_DPLC_LONG/DCLK_DATA_SHORT/DCLK_DATA_MUX_SHORT/SD_CLK_DPLC_SHORT/SD_CLK_INV_DPLC_SHORT]\n```\n- clk_period.tcl 保持原始（RX_CLKP 3.81 + DPLC_CLKP 6.35 两档共存），零修改\n- G1~G11 已在、G10 已在、G12 注释 SUPERSEDED、set_case_analysis **全部删除**\n\n### 下轮 run 验证清单（PREPT→DATABASE→POSTPT→run_summary）\n\n| # | 指标 | 预期 |\n|---|------|------|\n| 1 | MPW 报表 | **0 违例**（正常族 3.81/5.715 过 2、DPLC 族 1.535~1.87 过 0.73） |\n| 2 | setup | 与 V2 相比 SHORT 族**不消失**（无 case，全部时钟族存活） |\n| 3 | skew clk 报表 | 4 份出数据，slack ~8.7（=14−5.27），0 条 unconstrained |\n| 4 | hold | 与 V2 逐条相同 |\n\n## 0917 深夜-9：终态定稿（无 case / 两档速率共存 / 14 行约束）commit 337c171\n\n### 被推翻方案清单（5 项）\n\n| # | 方案 | 推翻理由 |\n|---|------|---------|\n| 1 | ~~DPLC_CASE 速率开关（clk_period if/else）~~ | 用户否决：clk_period 老方式更对（RX_CLKP 3.81 大部分路径 5G + DPLC_CLKP 6.35 DPLC 路径 3G，两档共存一次 run） |\n| 2 | ~~set_case_analysis 双开关（SP_CASE + DPLC_CASE）~~ | 用户否决：不需要任何 case 机制，两族时钟共存各查各的 |\n| 3 | ~~MPW 按 DPLC_CASE if/else（0.73↔2）~~ | 随 case 一起删除，现为固定 2/0.73（0.73 在 5G pulse 1.905 和 3G pulse 3.175 下都过且有意义） |\n| 4 | ~~端口预算 12 / 12.7~~ | 终值 14（=2M23 原值 L657-660） |\n| 5 | ~~G12（R_REG06_F 总线→CLKB 口 set_max_delay 2×DPLC_CLKP=12.7）~~ | 被 14 覆盖，SUPERSEDED |\n\n### 终版约束全景（14 行活动约束，无 case/开关/if/false_path）\n\n| 类别 | 约束 | 对象 |\n|------|------|------|\n| 端口预算 | `set_max_delay 14 -to CLKA_L/CLKB_L/CLKA_R/CLKB_R` | 4 口（=2M23 原值） |\n| MPW 正常腿 | `set_min_pulse_width -low -high 2` | NORMAL_CLK_SHORT/LONG, SD_CLK_SHORT/LONG, SD_CLK_INV_SHORT/LONG（6 对象，÷2 链，pulse 3.81/5.715） |\n| MPW 数据腿 | `set_min_pulse_width -low -high 0.73` | DCLK_DATA_SHORT/LONG, DCLK_DATA_MUX_SHORT/LONG, SD_CLK_DPLC_SHORT/LONG, SD_CLK_INV_DPLC_SHORT/LONG（8 对象，pulse 1.905） |\n| G10 | 已部署（12.7 内部路径） | 不变 |\n| G1~G8 | 已部署 | 不变 |\n| G12 | SUPERSEDED 注释 | 不变 |\n\n### clk_period.tcl 恢复原始（零修改）\n\nMARGIN / OSC_CLKP / I2C_CLKP / **RX_CLKP=3.81**（大部分路径 5G）/ **DPLC_CLKP=6.35**（DPLC 路径 3G）——俊杰答疑：\"DPLC clk 就是 RX_CLK\"（长编码时两者可理解为一个时钟），clk_period 设计意图就是两档速率共存、各查各的。\n\n### MPW 物理依据（终版确认）\n\n- pulse = 周期一半**只对 50% 占空比链成立**（LONG 链 3.81→1.905、6.35→3.175）；SHORT 链 edges{1 3 4} 低相 = T/3（5.715→1.905、9.525→3.175）——两族低相恰好同值\n- MPW 查较短相；正常腿 3.81/5.715 → 2 ✓；数据腿 1.905 → 0.73 = 1.905−1.175（与 3G 等余量）✓\n- LONG 与 SHORT 完全对称（同值 2/0.73），无需按编码分套\n- 0.73 在 5G（pulse 1.905，余量 1.175）和 3G（pulse 3.175，余量 2.175）下都过且有意义\n\n## 0917 深夜-10：俊杰口径全面 review（中间路径 setup/hold 卡、输出口 MPW 卡）\n\n> **俊杰原则**：\"中间的路径都是 setup/hold 去卡；只有输出的这几个 CLKA_L/CLKB_L/CLKA_R/CLKB_R 相关的用 MPW 去卡，卡的方法就是 generate 出来，然后对 generate 出来的分别取不同的 MPW\"\n\n### 方面 1：MPW 14 行有没有过度（不该设的对象设了？）\n\n| # | 检查项 | 结论 | 证据 |\n|---|---|---|---|\n| 1.1 | 6 个正常腿（NORMAL/SD_CLK/SD_CLK_INV SHORT+LONG）是否输出相关？ | **✅ 是**——全部通过 ÷2 链到达 CLKA/CLKB 端口 | CLKGEN.v:185 mux→INV→DTCTL→端口；SDC L57-68 |\n| 1.2 | 8 个数据/DPLC 腿（DCLK_DATA/MUX/SD_CLK_DPLC/INV_DPLC SHORT+LONG）是否输出相关？ | **✅ 是**——DCLK_DATA_MUX 经 SD_CLK mux(I1) 到达端口（DPLC 模式直通路径）；V2 run 实测 DCLK_DATA_LONG 到达 CLKB_L | V2 MPW 报表 \"Pin: CLKB_L, Related clock: DCLK_DATA_LONG\" |\n| 1.3 | 对 DCLK_DATA_*/MUX_* 设 MPW 会不会过度检查内部寄存器？ | **⚠️ 会但无害**——这 4 个时钟驱动 DTCTL/DPLC_DATA_GEN/SMT_CS/SHORT_ENCODING_OUTPUT 内部寄存器（约 14 个 always 块），set_min_pulse_width on clock 会检查所有传播到的 CK 脚；但内部 CK 脉冲 ~1.905 >> 0.73 全部轻松通过，反而提供了\"占空比劣化早期报警\"的额外收益 | CLKGEN.v:168/DTCTL.v:176/201/484/516/538/647/696 等 |\n| 1.4 | 俊杰口径\"只有输出口\"是否要求删掉 DCLK_DATA/MUX？ | **不建议删**——删掉后 DCLK_DATA_LONG 到达 CLKB_L 的 MPW 检查会消失（V2 实测有违例）；0.73 的宽松阈值已把内部寄存器检查变成\"无噪音的额外防线\" | 俊杰原则的目的（输出口有 spec 卡）已达成 |\n\n**方面 1 总结论**：14 行 MPW **没有过度**。所有 14 个时钟对象都能到达 4 个输出口；内部寄存器的顺带检查是有益副作用（不是坏处），全部通过不产生噪音。\n\n### 方面 2：其他约束需要联动修改吗？\n\n| # | 检查项 | 结论 | 证据 |\n|---|---|---|---|\n| 2.1 | set_max_delay 14 ×4口 vs G10 (12.7 → U_DPLC_DATA_GEN) | **✅ 无冲突**——端点不同（端口 vs 内部 DPLC 数据寄存器），无共享路径 | ip_cons L146-149 vs L582-587 |\n| 2.2 | mc 有指向 4 个端口的吗？ | **✅ 无**——G1~G11 的 mc 终点全是内部寄存器/D 引脚，无一指向 CLKA/CLKB | grep set_multicycle_path.*CLK → 0 命中 |\n| 2.3 | set_false_path 与 MPW/max_delay 冲突？ | **✅ 无**——L336/338 是 LONG_ENCODING→DCLK_DATA_MUX 数据路径；L345 是 monblock 排除；均不涉及 4 口或 14 时钟对象 | ip_cons L336-345 |\n| 2.4 | set_input_delay 与输出约束？ | **✅ 无关**——仅 dout_lane* 输入侧 | ip_cons L240-241 |\n| 2.5 | G10 12.7 (=2×DPLC_CLKP) 语义在当前框架下？ | **✅ 正确**——clk_period DPLC_CLKP=6.35 为常量，12.7 不依赖 DPLC_CASE/rate switch；DPLC 数据路径在 5G 计时下 ~9.9ns → 12.7 覆盖 ✓ | ip_cons L582-587 |\n| 2.6 | interclk_clklist（L192-198）含 dead 时钟？ | **✅ 无 case 了不存在 dead**——所有时钟族共存传播，get_clock 全匹配 | ip_cons L192-198 |\n\n**方面 2 总结论**：**不需要任何联动修改**。14 行 MPW + 14 ×4口 + G 系列 mc/G10 + 已有 false_path 全部无冲突共存。\n\n### 方面 3：skew 脚本需要调整吗？\n\n| # | 检查项 | 结论 | 证据 |\n|---|---|---|---|\n| 3.1 | clk 探针选点（INV_SD_CLK_INV pin） | **✅ 正确**——该 pin 是 SD_CLK_INV 全部 4 个变体的分叉点，一个探针覆盖全部 | skew 脚本 L106/122/135/145 |\n| 3.2 | -slack_lesser_than 50 在无 case 下工作？ | **✅ 工作**——端口已有 set_max_delay 14（B 节），路径 constrained，slack ≈ 14−5.27 ≈ 8.7 < 50 → 全部打印 | batch-1 实测 slack (MET) 6.729@12ns → 14ns 下 ~8.7 |\n| 3.3 | 无 case 时 4 个时钟变体共存的包络是否合理？ | **✅ 合理**——俊杰口径\"输出口的时钟到达时间\"，skew 测的是最坏情况包络（min/max 跨 4 个变体），正是一次 run 覆盖全部产品 case 的设计意图 | V2 实测 32 arrivals（4 变体 × max/min × 4 口/文件） |\n| 3.4 | skew 数据侧（DB*_pre/DB*_reg 探针） | **✅ 正确**——已审计无遗漏（0917 探针完备性复盘结论） | 0917 复盘案例 9 |\n\n**方面 3 总结论**：**skew 脚本不需要调整**。无 case 下 4 个时钟变体共存传播正是\"两档速率共存\"设计的体现；探针/过滤/数据侧全部正确。\n\n### 总表\n\n| 方面 | 结论 | 需要改吗 |\n|---|---|---|\n| MPW 14 行过度？ | 没有过度，全部输出相关；内部寄存器顺带检查=有益副作用 | **不改** |\n| 其他约束联动？ | 零冲突，14行+G系列+false_path+input_delay 全部共存 | **不改** |\n| skew 脚本调整？ | 无 case 下 4 变体包络 = 正确的设计意图；探针/过滤/数据全对 | **不改** |\n\n### 心得\n\n俊杰口径的精髓是**分层**：\"中间路径 setup/hold 卡\"意味着内部时序用传统的 setup/hold 检查（G 系列 mc、APR 修线等），\"输出口 MPW 卡\"意味着只在物理端口处用脉冲宽度规格把关。这两层互不干扰——14 行 MPW 不会干扰内部 setup/hold（因为 MPW 检查的是时钟引脚的脉冲宽度，不是数据路径的 setup/hold），G 系列 mc 不会干扰端口 MPW（因为 mc 的终点不是端口）。\n", "HK1V11/每日记录_0918.md": "# 每日记录 - 09/18 (星期五)\n\n### 今日完成\n\n#### [SD 输出约束 / 综合]\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 回传准备 | 生成 server_sync_0918v1 清单，明确回传步骤与三项验证点 | ✅ |\n| 约束注释 | ip_cons 时钟定义块补注释：÷1.5 低相 T/3、MUX 三点 -add 机制 | ✅ 纯注释 |\n| 溯源标注 | 新增代码统一加 STATUS 头，SD 约束块标 NOT YET CONFIRMED | ✅ |\n| 存在性审计 | 2M23 遗留注释块逐对象核对 1V11 HDL，确认不可直接启用 | ✅ |\n| 站点核查 | 日报站 0918 缺失待补；实践站 13 案例齐全、4 处小瑕疵 | ✅ |\n\n### 发现问题\n\n| 模块 | 问题 | 影响 | 状态 |\n|------|------|------|------|\n| ip_cons | 2M23 遗留注释块对象在 1V11 不存在（层级/实例/时钟名全错） | 解注释必报错，防误用 | 🟡 已记录 |\n| 实践站 | 案例 12 停在 337c171，0918 状态未同步 | 读者误以为已签核 | 🔄 本次修 |\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| PT | 回传服务器跑下一轮 run，验证 MPW 0 违例 / setup 可比 / skew slack ~8.7 | 高 |\n| 约束 | MPW 值 2/0.73 待俊杰最终确认 | 中 |\n| SDC | 批次 3：DPLC_CLK 生成时钟（分叉点已就绪） | 中 |\n\n### 明日计划\n\n- 等服务器 run 结果，按验证点逐项核对。\n\n---\n\n## 0918 上午补充：0918V0 run 验证 + RX_CLK 50 条逐族 true path 判定\n\n### 今日完成（上午补充）\n\n#### [SD 输出约束 / POSTPT]\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 包覆盖 | 0918V0（424MB）提取并整树覆盖本地 SYNTHESIS（937 文件，0f6f9c0） | ✅ |\n| 四维验证 | MPW **0 违例**；setup 131→**129**（R_REG06_F→CLKB 被 14 覆盖清零）；hold 1742/-5.078 不变（既有 P0 零回归）；skew slack **8.729=14−5.271** 全受约束；SEL=0；clk_period 零修改 | ✅ |\n| 约束部署确认 | ip_cons 14 行全部物化（write_sdc 展开为 get_ports/get_clocks 形式，read_cons.log 命中）；**本地 HEAD 与服务器逐字节一致（diff=0）** | ✅ |\n\n#### [RX_CLK setup 违例分析]\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 逐族判定 | wc_cbest_125 剩余 RX_CLK 50 条 setup 违例 → 按 worst 15 逐条分析 | ✅ |\n\n### 🎯 关键结论：50 条全部是 true path（物理上），但 A1 worst 和 B 族可通过设计修改消除\n\n| 族 | 条数 | worst | 性质 | 处理方式 |\n|---|---|---|---|---|\n| **A1** LONG_ENCODING_ALIGN | 24 | **-0.496** | 同域 RX_CLK→RX_CLK 单周期解码管线 | **设计评审**：DATA_POINT_LAT→K4_FIND→flag_det 可否打一拍（同 0917V1 SHORT 修法）；其余 APR 修线 |\n| **B** CHPI_SD_CTRL 半周期 | 16 | -0.220 | 设计故意 negedge 采样（DTCTL.v:672 \"USE SD_CLK_INV HALF_CLK LOGIC\"） | **设计评审**：STB/HSR negedge→posedge 可否改 |\n| **A2** SHORT_ENCODING_ALIGN | 6 | -0.444 | 同域，**0917V1 RTL 已修（K\\*_FIND 寄存器化），0918V0 还是旧网表** | **等下版 APR 网表** |\n| **A3** DESCRAMBLE | 2 | -0.049 | 同域，轻微 | 随 APR |\n| **A0** BUFFER_I | 1 | -0.083 | 同域，轻微 | 随 APR |\n\n### 🔍 深度链路追踪：worst path DATA_POINT_LAT_reg_13_ → flag_det_reg (-0.496)\n\n完整 RTL 链（无中间寄存器，单周期）：\n\n```verilog\n// LONG_ENCODING_ALIGN.v L310: DATA_POINT_LAT 是对齐后的 20-bit 数据寄存器 (RX_CLK 域)\nalways @(posedge DCLK ...) DATA_POINT_LAT <= DATA_POINT_LAT_TMP;\n\n// L318-341: 大 mux 组合逻辑（20-to-1 选择 → DATA_ALIGN_PRE）\n// L346-354: K4_CODE 比较逻辑（组合）→ K4_FIND 信号\n\n// 跨模块 → AUTO_EQ_TRAINIG_JUDGE.v L67: flag_det 逻辑（寄存器）\n// flag_det 是 auto-EQ 训练判定标志（准静态语义：set 一次就保持）\n```\n\n**判定**：物理上 true path（同域、无中间寄存器、有数据流）。功能上 flag_det 是 **准静态标志**（训练完成 set 一次），K4_FIND→flag_det 的复位**很可能不需要下一拍立刻生效**——如果能容忍一拍延迟，修法与 0917V1 对 SHORT_ENCODING_ALIGN K\\*_FIND 的修法完全相同（RTL 打一拍或 mc2）。**待俊杰确认训练判定时序要求。**\n\n### Worst 15 明细\n\n| # | 起点 | 终点 | slack | 族 |\n|---|---|---|---|---|\n| 1 | LONG_ALIGN/DATA_POINT_LAT_reg_13_ | AUTO_EQ/flag_det_reg | -0.496 | A1 |\n| 2 | LONG_ALIGN/DATA_POINT_LAT_reg_13_ | AUTO_EQ/cnt_flag_reg | -0.461 | A1 |\n| 3 | SHORT_ALIGN/K4_FIND_reg | SHORT_OUT/cfg_cnt_reg_2_ | -0.444 | A2 |\n| 4 | LONG_ALIGN/DATA_POINT_LAT_reg_9_ | SHORT_ALIGN/BK_ST_T_reg | -0.398 | A1 |\n| 5 | SHORT_ALIGN/K4_FIND_reg | SHORT_OUT/cfg_cnt_reg_1_ | -0.350 | A2 |\n| 6 | SHORT_ALIGN/K1_FIND_reg | SHORT_OUT/data_cnt_reg_1_ | -0.341 | A2 |\n| 7 | SHORT_ALIGN/K4_FIND_reg | SHORT_OUT/cfg_cnt_reg_0_ | -0.329 | A2 |\n| 8 | SHORT_ALIGN/K1_FIND_reg | SHORT_OUT/data_cnt_reg_2_ | -0.270 | A2 |\n| 9 | SD_CTRL/STB_FAKE_ORG_neg_reg | SD_CTRL/HSR_W_FAKE_cnt_reg_6_ | -0.220 | B |\n| 10 | SD_CTRL/STB_DLY_reg_3_ | SD_CTRL/HSR_W_cnt_reg_5_ | -0.198 | B |\n| 11 | SD_CTRL/STB_FAKE_ORG_neg_reg | SD_CTRL/HSR_W_FAKE_cnt_reg_1_ | -0.188 | B |\n| 12 | SD_CTRL/STB_FAKE_ORG_neg_reg | SD_CTRL/HSR_W_FAKE_cnt_reg_5_ | -0.188 | B |\n| 13 | SD_CTRL/STB_FAKE_ORG_neg_reg | SD_CTRL/HSR_W_FAKE_cnt_reg_4_ | -0.188 | B |\n| 14 | SD_CTRL/STB_FAKE_ORG_neg_reg | SD_CTRL/HSR_W_FAKE_cnt_reg_0_ | -0.184 | B |\n| 15 | SD_CTRL/STB_DLY_reg_3_ | SD_CTRL/HSR_W_cnt_reg_2_ | -0.175 | B |\n\n### 下一步待做（上午补充）\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| 设计 | **俊杰确认**：① flag_det/cnt_flag 可否打一拍（同 SHORT 修法）② STB/HSR negedge→posedge 可否改 | 高 |\n| APR | A1 剩余（rx_shifter/rx_bit_cnt/BKDU_SYNC 等 17 条）重点修线 | 高 |\n| 网表 | 下版 APR 网表（含 0917V1 RTL 修改）验证 A2 6 条消失 | 中 |\n| 约束 | MPW 2/0.73 值待俊杰最终确认 | 中 |\n\n### 备注（上午补充）\n\n- 0918V0 run Fri Sep 18 10:27；上下文交接文档 `修改记录/CONTEXT_HANDOFF_20260917.md`（e658919）\n\n---\n\n## 0918 下午补充：LC_CPUWR 0918v1 EQ 默认值调整 + 服务器基线重建\n\n### 今日完成（下午补充）\n\n#### [LC_CPUWR / LC_CPUWR_history]\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 基线重建 | history 根级三件套以服务器 0917 压缩包重建基线（吸收 FPGA ILA、ECO ifdef、AUTO_EQ `{AEQ,1'b0}`；0827v1 集成挂账清零） | ✅ |\n| 默认值修改 | `reg_eq_bias_tune` 默认 8'h55→8'h17；`reg_eq_rbc1` 默认 0→1；`reg_eq_rbc0` 确认保持 0 | ✅ |\n| 字节影响 | 0x08 默认 0x00→0x02；0x36 默认 0x55→0x17 | ✅ |\n| 验收三关 | iverilog 两分支通过 + 对抗评审 pass（critical=0/high=0）+ 信号链路完整 | ✅ |\n| 记录归档 | changelist + 双轨 CHANGES + 地址表 + 四张寄存器 SVG 同步；commit a7cb957 已推送 | ✅ |\n| 网站同步 | team-share-public/hk1v11-lc-cpuwr-history 六页 + 5 张 SVG 更新，commit 3ca0e2d 已推送 | ✅ |\n\n### 关键核实\n\n- 0907v1 的 12 个 CHIP_SEL 门控逻辑在服务器 0917 版中**仍然存在**，基线重建无功能回退（仅一处旧注释残留）。\n\n### 发现问题（下午补充）\n\n| 模块 | 问题 | 影响 | 状态 |\n|------|------|------|------|\n| DV env | env 默认值未同步（用户决策仅改 RTL+文档） | 依赖上电默认值检查的 case 会不一致 | 🟡 挂账待 env 窗口 |\n| LC_REG_MAPPING | 服务器版 L201 注释残留旧描述（: 2'b00） | 仅注释，逻辑正确 | 🟡 待服务器 owner 修 |\n| checker | `reg_eq_rbc1` 取 `val[0]` 疑似既有笔误 | env 侧，非本次引入 | 🟡 待 env 窗口一并修 |\n", "HK1V11/每日记录_0920.md": "# HK1V11 每日记录 2026-09-20\n\n## 下午：同名 -add 生成时钟 → MPW 幻影违例（案例 15）\n\n### 症状（0920V1 run）\n\n- MPW 从 0 违例 → **40 条**，全部 `Related clock: DPLC_CLK`，Check: `clock_tree_pulse_width`\n- 典型路径 CLKB_L：rise 沿到达 6.334ns、fall 沿到达 5.727ns → **actual pulse width -0.607ns（负值，物理不可能）**，required 0.73，slack -1.337\n- 伴生：hold +4 条（DPLC_CLK 发起 gating hold，data_cnt_pre_reg）；LONG 腿 DPLC_CLK 本轮没物化\n\n### 根因（SDC 建模错误）\n\nmux 输出 pin（`u_gate_MUX_DPLC_CLK/MUX2X2/O`）两条生成时钟用了**同一个名字 DPLC_CLK**（LONG 腿 master DCLK_DATA_LONG 3.81ns + SHORT 腿 master DPLC_CLK_SHORT_DIV 5.715ns，-add 同名）：\n\n1. write_sdc 对同名多 master **非确定性只保留一条**（实测 V0 包留 LONG 腿、V1 包留 SHORT 腿——两轮行为不同）\n2. PT 把两个 master 波形合并到同一时钟名下 → 脉宽检查**边沿交错配对**（rise 一个 master、fall 配另一个）→ 幻影负脉冲\n\n既有惯例本就是正确答案：SD_CLK 引脚 4 个变体用 4 个**不同名字**。违反惯例无任何报错，只有间接症状。\n\n### 修复（commit 2734ee3）\n\n`DPLC_CLK_LONG`（master DCLK_DATA_LONG）/ `DPLC_CLK_SHORT`（master DPLC_CLK_SHORT_DIV）分名；MPW 列表同步；rx 时钟组通配 `DPLC_CLK*` 天然覆盖。**待 0920V2 验证**。\n\n### V1 其余达标项（对照）\n\nsetup 51/-0.632（上轮 2 条跨域 gating 假违例消失）、RX 35/-0.444、lt/ml/tt 全 0、**dplc skew 80 格首次全有数**、SEL=0。\n\n### 心法（新增 19/20）\n\n- 同一 pin 多个 -add 生成时钟**必须不同名字**——同名 = 波形合并 = 边沿配对错乱 + write_sdc 不确定\n- **负脉宽是建模伪影的指纹**——物理不可能，见到查时钟定义不查后端；2000ns 级边沿展开同理\n\n### 记录去向\n\n- 实践站 ch10 案例 15 + 心法 19/20 + 未闭环清单更新（commit 见网站仓库）\n", "HK1V11/规则_日报内容范围.md": "# 日报内容范围规则\n\n> 本规则由用户于 2026/06/30 明确指定，适用于 HK1V11 项目日报记录。\n\n## 只记录真正的功能工作\n\n日报应局限于以下三类内容：\n\n1. **RTL code**：RTL 设计、修改、审查、验证、bugfix\n2. **Case**：测试 case 创建 / 修改 / 回归 / 调试\n3. **环境**：直接影响仿真或 bring-up 的验证环境改动\n\n## 不记录以下内容\n\n- 脚本内部实现细节（改了什么参数、怎么重写、加了什么选项）\n- 文档-only 更新（`CHANGES.md`、`REVIEW.md`、内部笔记等）\n- 非公开的、项目管理类、不对外交付的辅助性工作\n\n## 例外\n\n若某项脚本 / 文档改动与功能结果强耦合（例如新增 case 必须同步到 `case_list.txt` 才能被回归调用），只写功能结果，不写文件编辑细节。\n", "HK1V11/遗留问题.md": "# 遗留问题\n\n| 日期 | 模块 | 问题描述 | 状态 | 关闭日期 |\n|------|------|---------|------|---------|\n| 07/13 | 寄存器 | 寄存器默认值需要更新 | 🔵 | 07/14 |\n| 07/16 | longcode 420b | K3 使用条件待与 Spec 确认（DUT：K4 关解扰，仅 K3 重新使能） | 🔵 | 08/25 |\n| 07/17 | longcode 420b | RTL 解码区域边界异常（已更新根因 0722）：`tag_value` 在 420-bit 块边界处提前更新到下一个块的 tag，导致当前块末尾真实替换组（如 `{1,tag=1}`=`0x41`）用错 tag、未被替换，下游 21-bit 字节重组后表现为 `FC→04`/`FE→0E`/`FF→FF`/`FE FF→7E F0` 等错码；pydec 已证实线上数据正确，可作对照证据；待俊杰修复 `tag_value` 更新时机 | 🔵 | 08/25 |\n| 07/17 | longcode 420b | `din_20b_aligned` 误接 DATA_POINT_LAT：已改接 `DATA0_ALIGN_LONG`，LSP 解码验证通过 | 🔵 | 07/17 |\n| 07/16 | longcode 420b | K-code 序列偶发 \"K1 K2 K2 K1 K2\"。根因：RTL 420b/8B10B mux 部分信号逻辑未更新，`CHPI_KCODE_ALIGN_LONG_L0` 中 `K1_FIND = K1_CODE2 & K1_CODE1_D1 & BK_ST`，BK_ST 由 `BIT_ALIGN_PT`(8B/10B 时序) 或 `R_BKDU&K2_FIND` 置位、K1_FIND 清零；420b 下置位逻辑不匹配时后续 K1 被该与逻辑遮盖。由俊杰处理 RTL 修复 | 🔵 | 07/17 |\n| 08/11 | LC_CPUWR/BCC | BCC 方向已定论（08/25）：CPUWR 无 BCC 总线访问权限，BCC_M=I2C 可写输出下发 bcc_ctrl，SDID/AEQ_reg_lane_ctrl=bcc 写回只读监视（LC_CPUWR 0821v2 已实现）；后续 bcc 写回接入已 UCRT64 bin 加入用户 PATH | ✅ 已完成 |\n| 工作流沉淀 | 新增 `E:\\每日记录\\AI_EDA_Verification_Workflow.md` | ✅ 已完成 |\n\n### 已验证工具版本\n\n| 工具 | 版本 | 路径 |\n|------|------|------|\n| python | 3.13.13 | `D:\\Python\\Python313\\python.exe` |\n| yosys | 0.56-4 | `D:\\msys64\\ucrt64\\bin\\yosys.exe` |\n| iverilog | 13.0 | `D:\\msys64\\ucrt64\\bin\\iverilog.exe` |\n| vvp | 13.0 | `D:\\msys64\\ucrt64\\bin\\vvp.exe` |\n| gtkwave | 3.3.127 | `D:\\msys64\\ucrt64\\bin\\gtkwave.exe` |\n\n### Smoke Test 结果\n\n| 步骤 | 结果 |\n|------|------|\n| 创建简单 `and2` Verilog 模块和 self-checking testbench | ✅ 完成 |\n| 使用 `iverilog` 编译 | ✅ 成功 |\n| 使用 `vvp` 仿真 | 成功，输出 `PASS` |\n| 生成 `wave.vcd` | ✅ 成功 |\n| 使用 `yosys` 完成 generic synthesis / stat 检查 | ✅ 成功 |\n| 临时 smoke test 目录清理 | ✅ 已完成 |\n\n### 后续如何使用\n\n如果需要让 AI 写 RTL 并自动验证，可以这样发起任务：\n\n```text\n先读取 E:\\每日记录\\AI_EDA_Verification_Workflow.md，\n然后按这个 EDA workflow 帮我实现并验证 <模块名>。\n需要生成 RTL、self-checking testbench、仿真结果、波形和 Yosys 综合检查结果。\n```\n\n也可以更简短地说：\n\n```text\n按 EDA workflow 验证这个模块。\n```\n\nAI 后续默认应执行的步骤：\n\n- 读取 `AI_EDA_Verification_Workflow.md`\n- 明确模块接口、功能规则、时序假设和 corner case\n- 编写或修改 RTL\n- 编写 self-checking testbench\n- 用 `iverilog` 编译\n- 用 `vvp` 跑仿真\n- 生成 `wave.vcd`\n- 用 `yosys` 做 `read_verilog`、`hierarchy -check`、`check`、`synth`、`stat`\n- 汇总 PASS/FAIL、命令、日志路径、波形路径、假设和风险\n\n常用命令模板：\n\n```powershell\nwhere python\nwhere iverilog\nwhere vvp\nwhere yosys\nwhere gtkwave\npython --version\niverilog -V\nyosys -V\ngtkwave --version\n```\n\n```powershell\niverilog -g2012 -Wall -o sim\\sim.vvp tb\\tb_<module>.v rtl\\<module>.v\nvvp sim\\sim.vvp\n```\n\n```powershell\nyosys -p \"read_verilog rtl\\<module>.v; hierarchy -check -top <module>; proc; check\"\nyosys -p \"read_verilog rtl\\<module>.v; hierarchy -check -top <module>; synth -top <module>; stat\"\n```\n\n```powershell\ngtkwave sim\\wave.vcd\n```\n\n### 当前能力边界\n\n| 能力范围 | 说明 |\n|----------|------|\n| 适合覆盖 | 普通组合逻辑、小型时序逻辑、寄存器字段、checksum、counter、FSM、mux/decoder 等基础正确性验证 |\n| 当前覆盖 | 仿真正确性、波形生成、RTL 解析、generic synthesis、资源 lane×2、hit×2），DRD 有效 case 总数达 33。\n- 修复 23 个现有 DRD case 的 `user_def.sv`，补齐 `` `define DRDOD ``。\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| DRD case | 服务器端运行 `t_drdod_cyclic_2lane_BOE1_R`，确认波形为 R 通道 255→55 循环 | 高 |\n| DRD checker | 确认 `drd_input_check_on` / `drd_output_check_on` 在 smoke case 无大量误报 | 中 |\n| DRD case | 确认 `case_list.txt` 中 33 个 case 可被回归脚本枚举 | 中 |\n| DRD checker | 确认 `drd_input_check_on` / `drd_output_check_on` 无大量误报 | 中 |\n\n### 发现问题\n\n- `isptx_sequence.sv` 中直接在函数调用参数内使用 `` `ifdef/`else/`endif ``，VCS 不支持；已改为文件顶部定义常量宏 `` `DRDOD_CYCLIC_MODE ``。\n- `drdod_output_scoreboard.sv` / `drdod_input_scoreboard.sv` 中 `if (...) `uvm_info; else `uvm_error;` 与 UVM 宏展开冲突；已改为两个独立 `if` 分支。\n- 历史遗留的 GOA dual-gate 架构理解问题（06/24）仍待后续处理。\n\n### 明日计划\n\n- 服务器端跑 Cyclic 样例，确认波形与 checker 行为符合预期。\n- 如无阻塞，启动批量回归或 `drdod_data_gen.svh` 进一步改造。\n", "HV2M23/每日记录_0701.md": "# 每日记录 - 07/01 (周三)\n\n### 今日完成\n\n#### DRD Input Checker\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 问题定位 | 修复 `t_drdod_cyclic_*` input checker 持续 mismatch | ✅ |\n| 时序分析 | 通过临时 debug dump 确认 2P 模式下每个像素在 `DATAI_L0/L1` 上稳定 2 个 `DTCLK` 周期 | ✅ |\n| 代码修复 | `drdod_input_monitor.sv` 改为 LS 下降沿后 skip 3 个周期，然后每 2 个 `DTCLK` 周期采样一次 | ✅ |\n| 验证确认 | 服务器端运行 `t_drdod_cyclic_2lane_BOE1_C` 已 PASS | ✅ |\n| 变更记录 | 同步更新 `CHANGES.md` | ✅ |\n\n#### DRD case 编译修复\n\n- 修复 `t_drdod_en_toggle_2lane_HKC1_R.sv` 中 `force` 语句 RHS 直接使用 `rx_cfg.OD_k` 导致的 VCS `DTINPCNS` 编译错误；改为本地 `bit[2:0]` 缓存后再 force。\n\n#### DRD Input Checker Smoke/Cyclic 区分\n\n- 修复 smoke case 打开 `drd_input_check_on` 后仍按 cyclic 期望检查的问题：在 `env_cfg.sv` 新增 `drdod_cyclic_mode` 字段（由 `DRDOD_CYCLIC` 宏控制），`drdod_input_scoreboard.sv` 据此选择固定值或循环递减期望函数。\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| DRD case | 批量回归其余 cyclic case（R/G/B/Y/C/M、hit、1lane） | 高 |\n| DRD checker | 确认 smoke case 在 `drd_input_check_on=1` 下无新增误报 | 中 |\n| DRD case | 如批量回归通过，更新 `REVIEW.md` 准备正式回传 | 中 |\n\n### 发现问题\n\n- 原 input monitor 误认为每个 `DTCLK` 上升沿对应一个 pixel，实际 2P 模式下每个像素占 2 个 `DTCLK` 周期；已修正采样率。\n- `LS_BISR_Lx_PRE` 下降沿后存在 2 个 dummy 周期，且因 `@(posedge)` 语义需再 skip 1 个过渡周期才能落在 pixel 0 起点；已调整 skip 数为 3。\n\n### 明日计划\n\n- 跑完剩余 cyclic case 回归，确认 checker 行为一致。\n- 若回归无阻塞，整理 `REVIEW.md` 并准备服务器回传。\n", "HV2M23/每日记录_0707.md": "# 每日记录 - 07/07 (星期二)\n\n### 今日完成\n\n#### [模块名]\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| [子任务] | [简要描述] | ✅ |\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| [模块名] | [待做事项] | 中 |\n\n### 发现问题\n\n| 模块 | 问题 | 影响 | 状态 |\n|------|------|------|------|\n| - | 暂无 | - | - |\n\n### 明日计划\n\n| 模块 | 计划事项 |\n|------|----------|\n| [模块名] | [计划内容] |\n", "HV2M23/每日记录_0716.md": "# 每日记录 - 07/16 (星期四)\n\n### 今日完成\n\n#### team-share 站点维护\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 内容补充 | 按原始 Word 文档补充 synthesis flow 7 篇文章的二级/三级标题细节 | ✅ |\n| 图片插入 | 从 Word 提取 4 张原图并插入对应章节（LEC、Signoff、流程图等） | ✅ |\n| 页面修复 | 修复 Signoff 与时序页空白：调整 marked 渲染与目录生成顺序，移除 mermaid 代码块 | ✅ |\n| 导航优化 | 左侧目录顶部改为显示当前文章 h1 标题，不再显示\"本页目录\" | ✅ |\n| 站点部署 | 提交并推送到 GitHub Pages（`team-share-public`） | ✅ |\n\n### 下一步待做\n\n- 暂无\n\n### 发现问题\n\n| 模块 | 问题 | 影响 | 状态 |\n|------|------|------|------|\n| synthesis flow 页面 | 原 TOC 脚本在 marked 渲染前执行，导致 article 为空、目录无内容 | Signoff 等页面显示空白 | 🔵 |\n\n### 明日计划\n\n- 暂无\n", "HV2M23/每日记录_0731.md": "# 每日记录 - 07/31 (星期五)\n\n### 今日完成\n\n#### 综合集成流程公开报告（synthesis-integration-flow-guide）\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 图片流程 | 新增 PTPX 报告示意图，识别图中 TOTAL POWER 位置并归位到功耗报告小节 | ✅ |\n| 图片流程 | 全库 19 张图片按报告阅读顺序编号重命名（01-19，改英文短名） | ✅ |\n| 图片流程 | 5 个章节图片引用同步更新，全库扫描确认无旧名残留 | ✅ |\n| 功能新增 | 全站新增关键字搜索：导航栏入口、Ctrl+K 快捷键、结果点击跳转 | ✅ |\n| 功能迭代 | 跳转目标区域呼吸灯高亮：颜色随主题改对冲色、滚动停稳后计时、8 秒周期 | ✅ |\n| 功能迭代 | localStorage 记忆上次搜索关键词与选中项 | ✅ |\n| 缺陷修复 | 修复搜索索引 600 字符截断导致长章节内容搜不到的问题 | ✅ |\n| 图表重建 | 脚本调用关系总图改用 Graphviz 自动布局重建，替换手写 SVG | ✅ |\n| 规范沉淀 | Graphviz 与 fireworks-tech-graph 画图方式写入全部同名 team-share skill（4 处） | ✅ |\n| 清理 | 删除不再需要的 split_fsdb 脚本 | ✅ |\n\n### 图片处理流程（汇总）\n\n1. 用户更新示意图 → 我识别图中关键信息（TOTAL POWER 列位置）→ 插入报告对应小节并配说明文字。\n2. （12ns / 1429）仅作备案，未启用；最终通过约束清理在原频率收敛。\n- 报告网站同步更新（速查表、约束冲突说明等），属辅助工作不单列。\n", "HV2M23/每日记录_0812.md": "# 每日记录 - 08/12 (星期三)\n\n### 今日完成\n\n#### STA PT 流程\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 流程重构 | PT 运行产物目录收敛：每次运行归档到 history/<run_id>/，corner 下只保留 latest 链接指向最新一份 | ✅ |\n| 兼容处理 | 未设置 run_id（手动 source）时回退原平铺结构，原有使用方式不受影响 | ✅ |\n| 历史迁移 | 10 个 corner 旧产物一次性迁入 history/20260807_1，latest 链接重建 | ✅ |\n| 仓库瘦身 | 原已入库的 rpt_* 等约 4442 个文件从 git 移除，history/ 加入 gitignore | ✅ |\n\n### 发现问题\n\n- 无新增；本次为 PT 产物组织重构，不改 RTL 功能。\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| STA PT | run_all 脚本引用不存在的 corner，为历史遗留，可后续清理 | 低 |\n\n### 明日计划\n\n- 基于收敛后的 PT 流程继续推进时序 signoff 与后仿验证。\n\n### 备注\n\n- 仅影响 PT 后仿 STA 产物组织，pre/ 流程独立不受影响，不改 RTL。\n", "HV2M23/每日记录_0813.md": "# 每日记录 - 08/13 (星期四)\n\n### 今日完成\n\n#### STA PT 流程\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 流程新增 | 新增并行 SDF 生成脚本 `run_pt_sdf.py`：一键并行跑 `tt_typical_25` / `wc_cbest_125` / `lt_cbest_m40` 三个 corner | ✅ |\n| 参数自动化 | `DUMP_SDF` 改由环境变量置 1，无需再手动改 `corner_set.tcl` | ✅ |\n| 产物命名 | SDF 自动带日期+版本号（如 `HV2M23_digital_top_typical_25c_0813v1.sdf`），版本号自动递增、可手动指定 | ✅ |\n| 兼容性 | 未跑脚本时 `DUMP_SDF` 保持默认 0，手动 `run_pt` 行为不变 | ✅ |\n\n#### STA PT 目录与脚本归档\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 目录改造 | corner 产物收敛到 `history/<run_id>/`，`latest` 指向最新一份，解决多次运行平铺膨胀 | ✅ |\n| 目录改造 | `summary/` 同步改为 `history/<date>_<n>` + `latest` 结构 | ✅ |\n| 归档脚本 | 新增 `archive_pt_history.py`：一键把平铺产物归入 history 并重建 latest，支持 dry-run / `--apply` | ✅ |\n| 脚本适配 | `run_summary` 输出路径改为 `summary/history/`，`latest` 指向对应目录 | ✅ |\n\n#### STA PT 同步接近 TO 版本\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 报告拆分 | postPT 的 `latest` 拆成 `latest_1p`（1P 报告）/ `latest_2p`（2P 报告），各 10 个 corner + summary，排除 whole_session | ✅ |\n| 脚本约束更新 | 覆盖 11 个接近 TO 文件：`clk_period.tcl`（DPSEL_I 0→1、RX 时钟 10.08→10.71ns）、`sdc_pr` 约束、lec/pre 报告等 | ✅ |\n| 脚本保留 | `pt_setup.tcl`（V0 注释乱码）、`tt_typical_25/corner_set.tcl`（V0 值误写）保留本地 | ✅ |\n| 目录清理 | 删除全部 `history/`、旧 `late _I、reg_lane_pd_L1），需用户确认来源或处理方式。\n- **B 类改 multicycle 后 hold 违例**：跨 exclusive 时钟（SETTING_DET=RX0_CLK_DIV1P5 → DTCTL=CLK_L0_DTCTL_OD_DIV1P5），无 `-start` 时 end-based hold 沿错位。已加 `-start` 修复，待服务器重跑 PT 验证收敛。⚠️\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| STA PT | 确认 `wc_typical_125` 的 tsv 来源（V0 缺失），消除该 corner 的 noload | 高 |\n| STA PT | 服务器验证 A/B 类 multicycle 后的 PT signoff（setup/hold 收敛 + coverage） | 高 |\n| STA PT | 注释 `R_*/CK` false path 后跑 PT，确认无新违例 | 中 |\n| STA PT | 服务器验证 PT 2017.06 是否支持 `create_scenario`/`create_mode`（MMMC 前提） | 中 |\n\n### 明日计划\n\n- 确认 `wc_typical_125` tsv 处理方式，补全该 corner 的 noload 消除。\n- 服务器跑 A/B 类 multicycle 修改后的 PT signoff，验证 setup/hold 收敛。\n- 服务器跑通 SDF 生成流程，供后仿使用。\n\n### 备注\n\n- 本次为后端 STA 报告替换（setcase 错误修复）+ 约束优化（A/B 类 false path→multicycle）+ 展示更新（PPT/网站）+ MMMC 评估，计入日报。\n- PPT v23 已更新 share 副本；网站已推送 GitHub Pages。\n- A/B 类 multicycle 修改：B 类 16 个 false path 注释 + 补 1 条 multicycle + 全加 `-start`；A 类 14 个 false path → multicycle（`-start` 2/1）。\n", "HV2M23/每日记录_0818.md": "# 每日记录 - 08/18 (星期二)\n\n### 今日完成\n\n#### STA 约束分析（`R_*/CK` false path 打开验证）\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 打开验证 | 注释 `ip_cons:846` 的 `set_false_path -from R_*/CK` 后跑 PT，出现大量 R_REG 出发违例 → 证实该 false path 是**承重约束**（非此前判断的\"防御性写法\"） | ✅ 已定位 |\n| 认知修正 | PT 中寄存器发起路径的 startpoint 就是触发器 CK pin；`-from R_*/CK` 实际屏蔽全部 ~100+ 个 R_REG 配置寄存器发起的所有路径（setup + hold + 门控检查） | ✅ |\n| 周期厘清 | **二次修正**：2.52ns 是沿对窗口而非时钟周期；真实周期 RX0_CLK=10.08 / WCLK1_A_DCLK=15.12 / 1P=20.16ns，场景定性为**慢→快跨域** | ✅ |\n| Setup 案例分析 | `R_REG_9 → DRA_CS`（slack −4.88ns），完整拆解见下方\"STA 案例记录\" | ✅ |\n| Hold 案例分析 | `R_REG_0[7] → DTCTL_COMB/C260` 门控保持检查（slack −13.35ns），完整拆解见下方\"STA 案例记录\" | ✅ |\n| 方案实施 | clock-pair multicycle 写入 `ip_cons:863`：`-from WCLK1_A_DCLK -to lane0快时钟 -through R_*/Q`，`-end` setup 2 / hold 1（用户调整位置与 `get_clocks` 写法） | ✅ 已实施 |\n| 约束调整 | `set_max_delay` 12→14（CLKA_L/CLKB_L/CLKA_R/CLKB_R，`ip_cons:657-660`，用户修改）；注意 max_delay 只管 setup，与 hold 无关 | ✅ |\n| PT 实测 | multicycle 后普通路径 setup/hold 收敛；门控 hold 数值逐位不变 → 证实 **clock gating check 不响应 multicycle** | ✅ 已定性 |\n| 定点处理 | C258~C261 门控检查：三轮演变后定为限定路径 false path `-through R_REG_0_reg_7_/Q -to C258~C261/I1`（`ip_cons:873`）；multicycle（3 次实测免疫）与 disable（write_sdc 不导出）均排除，死活分析见案例记录 | ✅ 已实施 |\n| XRST/POL 分析 | 打开 XRST/POL 端口 false path 后：POL 案例 `STB_A_reg→POL2A_L` −1.19（同频相位差）、XRST 案例 `DIOH_DCLK_reg→XRSTB_R` −0.93（快→慢 5.04ns 窗口）；根因同为 launch 时钟树 ~5ns vs 输出端口 capture 0 延迟的结构性 skew | ✅ 已定位 |\n| XRST/POL 实施 | 12 条 `-to` 端口 false path 全部注释，改 `set_multicycle_path 2 -setup -end / 1 -hold -end`（XRST 组、POL 组各一对，`ip_cons:892` 区域，用户决定全换 multicycle） | ✅ 已实施 |\n| 方法论沉淀 | 例外约束作用范围与 `-through` 收窄判断流程（blanket -to 的误伤/放松不足风险 + 起点同质性枚举验证流程）→ 总结上传网站 | ✅ |\n\n#### STA 案例记录（学习依据）\n\n##### 背景：为什么注释一条 false path 会冒出大量违例\n\n- 原约束（`SYNTHESIS/common/ip_cons/HV2M23_digital_top.tcl:846`）：`set_false_path -from [get_pins .../LC_CPUWR_HV2M23/R_*/CK]`\n- 此前判断（**错误**）：WCK1_A 只作时钟、CK pin 无数据扇出 → 以为是防御性写法，打开风险低\n- PT 实测修正：**寄存器发起的路径，其 startpoint 就是触发器的 CK pin**（报告原文：\"Startpoint: R_REG_9_reg_0_ (rising edge-triggered flip-flop clocked by WCLK1_A_DCLK)\"）。所以 `-from R_*/CK` 屏蔽的是全部 R_REG 寄存器发起的**所有**路径\n- 教训：判断 `-from reg/CK` 类约束的覆盖范围时，不能看 RTL 里时钟信号有无数据扇出，要按 PT 的 startpoint 定义（input port + 触发器 CK pin）理解\n\n##### 时钟周期厘清（关键前提，二次修正）\n\n| 时钟 | 周期 | 由来（`ip_cons` 定义链） |\n|:---|:---|:---|\n| RX0_CLK | **10.08ns** | `kv_clock RX0_CLK $RX0_CLKP` |\n| RX0_OD_CLK | 5.04ns | `$RX0_CLKP/2` |\n| RX0_OD_CLK_DIV2 | 10.08ns | OD ÷2（edges {2 4 6}） |\n| RX0_CLK_DIV1P5 | **15.12ns** | DIV2 ×1.5（edges {1 3 4}） |\n| WCLK1_A_DCLK | **15.12ns** | DIV1P5 ÷1 经 MUX（R_REG 的 launch 时钟） |\n| RX0_CLK_DIV1P5_1P | 20.16ns | `kv_genclock $RX0_CLKP×2`（门控检查 capture 时钟） |\n\n- launch 沿 17.64 = DIV1P5 波形的第二个 rise（2.52 → 17.64，间隔 15.12）；capture 沿 20.16 = 2×10.08\n- **窗口 2.52ns 的由来**：WCLK1_A_DCLK（15.12）与 RX0_CLK（10.08）周期不同，PT 取所有沿对中最紧的一对：launch 2.52→capture 10.08 = 7.56ns；launch 17.64→capture 20.16 = **2.52ns（最紧）** → 按 2.52ns 检查\n- 场景定性：**慢时钟（15.12）→ 快时钟（10.08）跨域**，适用慢→快 multicycle 标准配方\n\n##### Setup 案例：R_REG_9_reg_0_ → DRA_CS（slack = −4.884ns）\n\n| 项 | 内容 |\n|:---|:---|\n| Startpoint | `LC_CPUWR_HV2M23/R_REG_9_reg_0_`（launch 时钟 WCLK1_A_DCLK，15.12ns） |\n| Endpoint | `DRA_CS` 输出端口（capture 参考 RX0_CLK，10.08ns，`set_output_delay 0.5`） |\n| 信号性质 | R_REG_9 = `WAKE_CS_SEL[1:0]` / `WAKE_PD_OPT[1:0]`（`LC_CPUWR_HV2M23.v:394-395`），CPU 一次写入的**准静态**配置位 |\n| Path Group / Type | RX0_CLK / max (recalculated = 已做 CRPR) |\n\n三段拆解：\n\n| 段 | 时间 | 说明 |\n|:---|:---|:---|\n| launch 沿 → R_REG CK pin | 17.64 → 22.96（**+5.32ns**） | 时钟树：端口 → IOBUF → 分频器链 → CG 门控 → MUX → buffer 树（post-CTS 真实延迟） |\n| CK → DRA_CS 数据段 | 22.96 → 25.04（**+2.08ns**） | CK→Q 0.36 + 组合逻辑 + pad，本身很小 |\n| capture 侧 | 20.16 − 0.504(uncertainty) + 0.5(external delay) = **20.156** | 输出端口：capture 时钟树按 **0** 计（标准假设：外部器件理想采样） |\n\nslack = 20.156 − 25.040 = **−4.884**\n\n根因：2.52ns 最紧沿对窗口 vs launch 时钟树 5.3ns / capture 0ns 的**结构性 skew**——不是 PT 算错，而是这条检查对准静态信号本不该存在（这正是原 false path 存在的意义）。\n\n##### multicycle 方案：慢→快跨域的 -end 配方（X=2 / X−1=1）\n\n`-start` vs `-end` 对比（每 +1 拍的效果，以 DRA_CS 路径验算）：\n\n| 选项 | 沿移动方式 | X=2 的窗口 | slack | 结论 |\n|:---|:---|:---|:---|:---|\n| `-start` X=2 | launch 沿前移 1×15.12（17.64→2.52），capture 沿重对齐到下一个 RX0 沿（10.08） | 7.56ns | **+0.156（临界）** | 需 X=3 才舒适 |\n| `-start` X=3 | launch 沿再前移 1 拍，capture 沿到 0 | 12.60ns | +5.20 | 可行但 X 偏大 |\n| `-end` X=2 | capture 沿直接后移 1×10.08（20.16→30.24） | 12.60ns | **+5.20** | **推荐** |\n\n**选 -end 的三个理由**：\n\n1. **效率**：capture（10.08）比 launch（15.12）快，-end 每拍买到的窗口更大 → X=2 即达 -start X=3 的效果\n2. **有界**：-end 放松量 = capture 周期，与 launch 无关 → 即使作用到挂 `WCLK1_A_I2C` 慢时钟的 R_REG 位，放松也以 capture 周期（10.08/20.16ns）为界；`-start` 会按 I2C 周期（上百 ns）过度放松（08/17 已预警此风险，-end 天然规避）\n3. **hold 对齐**：慢→快标准配方即 `setup X -end` + `hold X−1 -end`；不加 hold 调整时 hold 检查沿会跟随新 setup 沿前移（变紧），配 X−1 把它拉回默认对齐位置\n\n**hold 配对验算（X−1=1，普通路径）**：默认 hold 沿 = setup 沿 −1 capture 周期（20.16−10.08 = 10.08）；`-hold 1 -end` 回拉 10.08 → 回到 0 沿；数据最小到达 ~23ns，裕量充足。\n\n**具体约束写法**（clock-pair 限定跨域 + through 限定到 R_REG 寄存器路径）：\n\n```tcl\nset_multicycle_path 2 -setup -end \\\n  -from [get_clocks WCLK1_A_DCLK] \\\n  -to   [remove_from_collection $lane0_all_clklist [get_clocks WCLK1_A_DCLK]] \\\n  -through [get_pins u_LOGIC_CENTER/LINK_LOGIC/LC_CPUWR_HV2M23/R_*/Q]\nset_multicycle_path 1 -hold  -end \\\n  -from [get_clocks WCLK1_A_DCLK] \\\n  -to   [remove_from_collection $lane0_all_clklist [get_clocks WCLK1_A_DCLK]] \\\n  -through [get_pins u_LOGIC_CENTER/LINK_LOGIC/LC_CPUWR_HV2M23/R_*/Q]\n```\n\n- `-to` 用 `remove_from_collection $lane0_all_clklist` 复用文件已有时钟清单（line 179），剔除 WCLK1_A_DCLK 自身，避免手维护\n- **through 用寄存器 Q pin**（`R_*/Q`）：每条 R_REG 发起的路径必过自身 Q pin，覆盖完整；原有 `-through LC_CPUWR_*/R_*`（line 666）只匹配 `R_*` 命名的模块输出端口，会漏掉从 `WAKE_PD_OPT` 等非 R_* 口出去的路径（DRA_CS 案例即如此）\n- `-from WCLK1_A_DCLK` 限定 launch 域；`WCLK1_A_I2C` 到 lane0 已被时钟组 false path 覆盖，无需列入\n\n##### Hold 案例：R_REG_0_reg_7_ → DTCTL_COMB/C260（slack = −13.351ns，门控保持检查）\n\n| 项 | 内容 |\n|:---|:---|\n| Startpoint | `LC_CPUWR_HV2M23/R_REG_0_reg_7_`（WCLK1_A_DCLK） |\n| Endpoint | `CENTER1/TOTAL_DTCTL/DTCTL_COMB/C260`——**clock gating check** 终点（`RX0_CLK_DIV1P5_1P` 域，20.16ns） |\n| Path Group / Type | `**clock_gating_default**` / min (recalculated) |\n| 电路 | C260 = DBLON_B 的时钟门控 AND2：I1 = EN（来自 R_REG_0[7]，准静态），I2 = gated clock |\n| Last common pin | `CLKGEN_U0/BUF_DCLK0_DIV/O`（launch/capture 公共时钟树分叉点，CRPR 依据） |\n\n数值拆解：\n\n| 侧 | 计算 | 结果 |\n|:---|:---|:---|\n| launch | WCLK1_A_DCLK rise 17.64 → EN 最早到达（min 路径） | arrival = 25.348 |\n| capture | 门控时钟 **fall edge 32.76** + 时钟树 6.10 − CRPR 0.308 + uncertainty 0.15 | required = 38.699 |\n| slack | 25.348 − 38.699 | **−13.351** |\n\n机制解释：\n\n- 高有效门控（AND）的 hold 语义：EN 必须保持稳定**直到时钟下降沿之后**，否则高电平期间会产生毛刺脉冲\n- 门控时钟 `RX0_CLK_DIV1P5_1P` 是慢时钟（20.16ns），其下降沿离 launch 沿 15.12ns\n- required 还要加上门控时钟自己的 6.1ns 时钟树延迟 → 要求时间被推到 38.7ns，而 EN 数据 25.3ns 就已到达 → 大额 hold 违例\n- 功能视角：EN 是准静态配置位，软件只在时钟静止时改写，门控检查的\"动态使能\"假设不成立 → 本就该放松\n\n对 multicycle 方案的影响（**两次修正**：\"M=6\"基于错误周期假设作废；\"+6.81 估算\"后被 PT 实测证伪）：\n\n- 曾估算 `-hold 1 -end` 按 capture 周期回拉门控检查沿可得 slack +6.81\n- ❌ **PT 实测证伪**：重跑后该违例数值逐位不变（沿 17.64/32.76 未动）→ **clock gating check 不响应 set_multicycle_path**，门控检查沿由门控时钟波形固定推导\n- 正确处理：限定路径 false path 定点关闭（见下一节\"PT 实测反馈\"）\n- 附带认知：原 `R_*/CK` false path 同时覆盖 setup、hold **和门控检查**三类，08/17 把它列为\"保留项\"时这一点被低估了\n\n##### PT 实测反馈：门控检查不响应 multicycle + C258~C261 定点处理\n\n**实测结果**（multicycle + max_delay 14 后重跑 PT）：\n\n- 普通路径 setup/hold：收敛（multicycle 生效）\n- 门控 hold（R_REG_0_reg_7_ → C260）：违例仍在，**沿 17.64/32.76、arrival 25.348415、required 38.699276、slack −13.350860 与上轮逐位相同** → 证实 **clock gating check 不响应 set_multicycle_path**\n\n**附带澄清**：`set_max_delay`（12→14）只管 max/setup 检查；hold 是 min 检查归 `set_min_delay` 管——改 max_delay 对 hold 违例无影响。\n\n**关于 `*R_*/Latch/Q` 覆盖假设的分析（排除）**：\n\n- 观察点：`SNPS_CG_CELL_WCK1_A_R_REG_*` 门控单元名以 SNPS_ 开头，确实不被 `R_*/Q` 匹配\n- 但它们只在 **launch 时钟路径**（WCK1_A 时钟树）出现，**不在数据路径**；本条数据路径 `R_REG_0_reg_7_/Q → REG_MAPPING → … → C260/I1` 已被 `R_*/Q` 覆盖\n- `-through` 只匹配数据路径 pin → 加 latch 模式对本条违例无效\n- 报告数值逐位相同 = 例外已挂上但门控检查沿不移动（检查类型免疫），不是覆盖不足\n- 区分手段（不重跑 PT）：`report_exceptions -from [get_clocks WCLK1_A_DCLK] -to [get_clocks RX0_CLK_DIV1P5_1P] -through [get_pins .../R_REG_0_reg_7_/Q]`，能列出 multicycle 即证明匹配成功\n\n**C258~C261 定点约束 · 三轮演变与最终方案**（最终版已写入 `ip_cons:873`）：\n\n```tcl\nset_false_path -through [get_pins u_LOGIC_CENTER/LINK_LOGIC/LC_CPUWR_HV2M23/R_REG_0_reg_7_/Q] \\\n  -to [get_pins {u_LOGIC_CENTER/CENTER1/TOTAL_DTCTL/DTCTL_COMB/C258/I1 \\\n                 u_LOGIC_CENTER/CENTER1/TOTAL_DTCTL/DTCTL_COMB/C259/I1 \\\n                 u_LOGIC_CENTER/CENTER1/TOTAL_DTCTL/DTCTL_COMB/C260/I1 \\\n                 u_LOGIC_CENTER/CENTER1/TOTAL_DTCTL/DTCTL_COMB/C261/I1}]\n```\n\n- 语义：只罩\"穿过 `R_REG_0_reg_7_`（准静态配置位）→ 这 4 个门控 EN pin\"的检查，其余路径不受影响\n- 注：C260 的 EN pin = I1 已由报告证实；C258/259/261 假设同 cell 类型（CLKAND2X4AS9），PT 报 pin 不匹配时再修\n- 演变：① 初版 false path（同上写法）→ ② 用户决定改 `set_disable_clock_gating_check`（按 cell 操作不依赖 pin 名）→ ③ 发现 postPT 不吃该命令（见下节死活分析）→ ④ multicycle 最后一搏失败 → 回到 false path（最终版）\n\n##### 门控检查三种约束方法的\"死活分析\"（重要学习结论）\n\n问题拆成**两个独立维度**，三个方法各死在不同维度：\n\n**维度一：PT 机制上能否碰到门控检查**\n\n- 门控检查结构：EN pin 是\"数据\"、门控时钟波形是\"时钟\"，**检查沿直接从门控时钟波形推导**（setup 看上升沿、hold 看下降沿），不经任何 launch/capture 寄存器对\n- **multicycle 无效（机制性死亡）**：multicycle 只能搬 launch/capture 寄存器的检查沿；门控检查没有 capture 寄存器 → 没有可搬的沿 → 免疫。共三次实测：① 加 -end multicycle 后报告逐位不变；②③ 用户在 pt_shell 试 `-to C260/I1 -end` 与 `-from reg7/CK -start` 逐点写法，均无效\n- **false path 有效**：它不搬沿，而是按路径端点（from/through/to）匹配路径对象本身；门控检查在 PT 内部就是 startpoint = R_REG、endpoint = C260/I1 的路径对象 → 能被精确罩住\n- **disable 有效**：直接在 cell 上设属性关检查，pt_shell 实测立即生效\n\n**维度二：命令能否活着到达 postPT（prePT→postPT 流程）**\n\n- 约束链路：`ip_cons` → prePT source（`sta/pre/common/pt_setup.tcl:81`，注意整段在 `if {$CK_TIM_EN==1}` 内，本地默认 0）→ `write_sdc`（:114）→ `sdc_pr` → release 流程 → `postcts.sdc` → postPT（实际读 `${SDC_PATH}/${SDC_NAME}_postcts.sdc`，`post/common/pt_setup.tcl:290` + `post/pt/design.set:25`，**不是 ip_cons**）\n- `write_sdc` 只导出标准 SDC 约束（create_clock/delay/false_path/multicycle/clock_gating_check），**不导出 design 属性**\n- **disable 流程性死亡**：`set_disable_clock_gating_check` 是 cell 属性 → 导出时静默丢弃（grep sdc_pr 无此命令实锤）→ postPT 永远没有；pt_shell 直接敲有效正因为它不经过导出环节\n- false path 是标准约束 → 正常导出 → postPT 吃到\n\n**死活矩阵**：\n\n| 命令 | 机制上能关门控检查？ | 能过 write_sdc？ | 结论 |\n|------|---------------------|------------------|------|\n| `set_multicycle_path` | ✗ 无 capture 沿可搬（三次实测） | ✓ | 机制性死亡 |\n| `set_disable_clock_gating_check` | ✓ | ✗ 属性不导出 | 流程性死亡 |\n| `set_clock_gating_check -hold` | 只能改 hold 时间量（报告里仅 1.0ns），救不了 −13.35 的沿位置问题 | ✓ | 剂量不够 |\n| `set_false_path -through -to EN pin` | ✓ 按端点匹配 | ✓ | **唯一两维都活** |\n\n- 流程外备选：postPT 预留 add_on 钩子（`post/common/pt_setup.tcl:292` 注释行 `#source ${SDC_PATH}/add_on.tcl`），可 source 含 disable 命令的小 tcl——属改流程脚本，本次未采用\n- 其余 ICG：待收集完整违例列表后按 false path 同模式批量处理\n\n##### XRST/POL 输出端口案例：false path → multicycle（用户决定全换）\n\n**POL 案例**：`LC_CSPIF_L0/STB_A_reg`（RX0_OD_CLK_DIV2，10.08ns，沿 2.52）→ `POL2A_L`（RX0_CLK，10.08ns，沿 10.08），setup slack **−1.194ns**\n- **同频相位差**场景（非慢→快）：两时钟同为 10.08ns，窗口 = 10.08−2.52 = 7.56ns\n- STB_A 是测试图样激活状态位（`LC_CSPIF_L0.v:1039-1044`，`STB_A <= STB_A_PRE`，激活/退出各跳一次，低频非准静态）\n- arrival 11.27 = launch 树 5.0ns（2.52→7.52）+ 数据段 3.75ns；required 10.076 = 10.08 − 0.504 + 0.5（输出端口 capture 网络延迟 0）\n\n**XRST 案例**：`LC_CSPIF_L0/DIOH_DCLK_reg`（RX0_OD_CLK_DIV2，沿 12.6）→ `XRSTB_R`（RX0_CLK_DIV1P5，15.12ns，沿 17.64），setup slack **−0.928ns**\n- 快（10.08)→慢（15.12）跨域，窗口仅 5.04ns\n\n**根因共性**：launch 时钟树 ~5ns vs 输出端口 capture 名义 0 延迟的结构性 skew（与 DRA_CS 案例同一类型）\n\n**实施**（`ip_cons:892` 区域）：12 条 `-to` 端口 false path（XRSTA/B_L/R、POL1A/1B/2A/B_L/R）全部注释，替换为：\n\n```tcl\nset_multicycle_path 2 -setup -end -to [get_ports {XRSTA_L XRSTB_L XRSTA_R XRSTB_R}]\nset_multicycle_path 1 -hold  -end -to [get_ports {XRSTA_L XRSTB_L XRSTA_R XRSTB_R}]\nset_multicycle_path 2 -setup -end -to [get_ports {POL1A_L POL1B_L POL2A_L POL2B_L \\\n                                                  POL1A_R POL1B_R POL2A_R POL2B_R}]\nset_multicycle_path 1 -hold  -end -to [get_ports {POL1A_L POL1B_L POL2A_L POL2B_L \\\n                                                  POL1A_R POL1B_R POL2A_R POL2B_R}]\n```\n\n- 同频时钟 -end/-start 等效，用惯例 -end；POL 案例预期 slack ≈ +8.9\n- 语义备注：XRST（异步复位输出）/POL（极性控制输出）外部均不按参考时钟采样，multicycle 语义是名义性的——比 false path 裸奔多一层有界检查；原 false path 语义上更诚实，用户决定统一换 multicycle\n- `ip_cons:873` 的 reg7→C258~C261 门控 false path **保持不变**（门控检查免疫 multicycle，false path 是唯一解）\n\n##### 方法论：例外约束的作用范围与 -through 收窄判断（通用）\n\n**问题**：只写 `-to` 的例外（multicycle/false path/max_delay）会罩住到该端点的**全部路径**（所有 startpoint、所有 launch 时钟），按最差一条配的参数会无差别作用于其他路径——会不会出错？要不要加 `-through`？\n\n**两种非预期后果**：\n1. **放松过度（主要风险）**：本身 slack 为正的路径也被放松 → 掩盖未来的真实违例（有人改逻辑拉大延迟时不再报警）\n2. **放松不足**：其他起点的 launch 时钟更慢/窗口结构不同，N=2 可能盖不住 → 误以为端口已处理完\n\n**hold 侧无风险**：`hold N−1 -end` 按 capture 时钟周期回拉，同 capture 时钟下对所有起点都正确，不会引入新 hold 违例\n\n**判断标准 = 起点是否同质**：\n- 同质（如 XRST 全是复位逻辑输出）→ blanket `-to` 可接受，粒度与原 false path 相同，**不需 through**\n- 异质（如 POL 端口可能混 CSPIF 低频 strobe + DTCTL 行频功能逻辑）→ 必须按 `-from`/`-through` 拆开，否则功能路径被误放松\n- 关键认知：把 false path 换成 blanket `-to` multicycle，**粒度并没有变细**（只是从\"不查\"变成\"放松 N 拍\"），精度提升只能靠 `-from`/`-through` 收窄\n\n**通用安全流程**：\n```tcl\n# 第一步：枚举端点的所有起点（把正 slack 也列出来），检查是否同质\nreport_timing -to [get_ports <port>] -max_paths 200 -slack_lesser_than 20 \\\n  -path_type full_clock_expanded > all_paths.rpt\n# 第二步：加完例外后验证匹配范围 + 无新 hold 违例\nreport_exceptions -to [get_ports <port>]\nreport_timing -to [get_ports <port>] -delay_type min -max_paths 50 -slack_lesser_than 0\n```\n\n一句话：**`-through` 不是防\"出错\"的，是防\"误伤异质路径\"和\"放弃过多检查\"的；没枚举过起点之前，默认怀疑它异质。**\n\n### 发现问题\n\n| 模块 | 问题 | 影响 | 状态 |\n|------|------|------|------|\n| STA 约束 | 此前\"N=4 / M=6、4/3 盖不住门控\"的结论基于错误的周期假设（2.52ns 当周期），已修正为慢→快 -end 配方（setup 2 / hold 1） | 旧结论作废，以修正版为准 | ✅ 已修正 |\n| STA 约束 | PT 三次实测确认 clock gating check 机制性免疫 multicycle（无 capture 沿可搬）；`set_disable_clock_gating_check` 被 write_sdc 丢弃（属性不导出）导致 postPT 不吃；C258~C261 最终用限定路径 false path 定点关闭 | 其余 ICG 待收集列表批量处理；C258/259/261 EN pin 名待 PT 复核 | 🔄 处理中 |\n| STA 约束 | XRST/POL 端口 blanket `-to` multicycle 覆盖全部起点，起点同质性未经 PT 枚举证实（POL 端口可能混 DTCTL 行频功能路径） | 若存在异质起点会被过度放松 | 🔄 待 PT 枚举复核 |\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| STA 约束 | 跑 PT 确认 C258~C261 违例从 `**clock_gating_default**` 组消失 + 复核 C258/259/261 EN pin 名（不匹配则修 pin 名）；收集剩余该组违例终点列表，按 false path 同模式批量补 | 高 |\n| STA 约束 | 跑 PT 验证 XRST/POL multicycle 收敛；枚举各端口全部起点（`report_timing -max_paths 200 -slack_lesser_than 20`）复核同质性，异质则按来源拆分 | 高 |\n| STA 约束 | 服务器 PT 全 corner 验证：setup/hold/门控三类收敛 + 最坏 slack 复核 X=2 充分性 | 高 |\n| STA 约束 | 复核挂 `WCLK1_A_I2C` 慢时钟的 R_REG 位（-end 下有界，确认无异常） | 中 |\n\n### 明日计划\n\n- 服务器跑 PT 验证三类检查收敛（multicycle + C258~C261 定点 false path + XRST/POL multicycle），复核 EN pin 名与端口起点同质性。\n- 收集门控检查违例完整列表，按 false path 同模式批量补。\n\n### 备注\n\n- 约束文件当前状态：`ip_cons:846` false path 保持注释；863 区域为 -end clock-pair multicycle（setup 2 / hold 1，through `R_*/Q`）；873 为 C258~C261 门控检查的限定路径 false path（through `R_REG_0_reg_7_/Q`，to 各 cell EN pin I1）；892 区域 XRST/POL 12 条端口 false path 已注释、改 multicycle 2/1 -end。\n- 例外约束 `-through` 收窄方法论已总结上传网站（team-share-public advanced-design）。\n- 本案例已同步记录到项目 `CHANGES.md`（2026-08-18 节）。\n- 遗留问题：无需更新（门控批量处理属进行中任务，已列入\"下一步待做\"）。\n", "HV2M23/每日记录_0819.md": "# 每日记录 - 08/19 (星期三)\n\n### 今日完成\n\n#### STA Coverage 分析与清零（主线）\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| postPT 基线分析 | wc_typical_125 coverage 全归因：untested 48%（21337 项）归入 6 类，无原因不明项；大头为异步复位 RB/SB pin 检查（mpw no_clock 6623 + recovery/removal no_startpoint 3798） | ✅ |\n| 1P/2P 交叉核对 | pin 级对照：模式互补仅 130 pin（闭合无缺口）；6512 pin（99.6%）双模式 untested 主因是异步复位而非模式——修正最初假设 | ✅ |\n| 证伪约束缺失 | no_clock 里 0 个 CK pin（全部 RB/SB），无\"缺时钟\"真 bug | ✅ |\n| 建档 | 新建 `SYNTHESIS/COVERAGE_ANALYSIS.md`：基线 + 1P/2P 对照 + Waiver 清单（W1~W3）+ Q&A 完整记录原则 | ✅ 已入库 |\n| prePT 报告分析 | 08/07 报告（确认 1P 模式）26 项残量三组根因查明：reg_lane_osr 通配符误挂 / WAKE_TP SB↔RB 互查 / BWDAL 异步置位链 | ✅ |\n| reg_lane_osr 修复 | `reg_*` 通配符摘除（remove_from_collection）+ OSC 兜底条款例外列表（用户实施）→ 4 项从 coverage 消失；check_timing 2 条 unconstrained 提示为预期 | ✅ 已实施 |\n| PTAT_EN 修复 | 发现其缺 -max output_delay（同块唯一不成对，此前被 R_*/CK 掩盖）→ 用户补上，out_setup 转 tested | ✅ 已验证 |\n| prePT 重跑排障 | 首次重跑因服务器 output_delay.tcl 同步问题报错中止（sh_continue_on_error false），本地字节级验证无误后重同步跑通 | ✅ |\n| BWDAL 清零 | 用户决定补 `set_input_delay -clock OSC_CLK_IN 5 [get_ports XPONRST_I]`（名义建模，注释已写明语义）→ recovery/removal 16 项转 tested | ✅ |\n| **untested 归零** | 第三轮 prePT：coverage untested = 0（W1~W3 全部关闭） | ✅ |\n| out_hold 违例定性 | 新发现 out_hold 281 项 violated（WCLK1_A_DCLK 组配置类输出，slack 统一 −0.201715）：R_*/CK 打开后同时钟输出 hold 暴露；同时钟 hold 违例 multicycle 原理上无解；min=5ns 对准静态输出过严 | 🔄 待修 |\n\n#### 方法与经验沉淀\n\n- 例外约束 `-through` 收窄判断流程（起点同质性枚举验证）——已上传网站 advanced-design 第 7 章（exception-scope.html）\n- 通配符约束修改教训：要同时检查覆盖同一对象的所有条款（精确 + 通配符 + 兜底），摘一处不摘另一处等于没摘\n- XPONRST_I input_delay 决策记录（Q14）：名义建模让 STA 可查 vs 物理上无关系——最终选择设值并注释写明语义\n- Waiver 可信度靠\"清单 + 每次重跑 diff\"维持，不靠肉眼\n\n### 发现问题\n\n| 模块 | 问题 | 影响 | 状态 |\n|------|------|------|------|\n| STA 约束 | out_hold 281 项 violated（配置类输出，min 过严） | **用户定界：属 APR 处置范围**；清单已确认全部为配置类，候选修复方案留 APR 参考 | 📤 移交 APR |\n| STA 流程 | prePT `sh_continue_on_error false`：约束文件任何报错 → 脚本中止且报告不更新（不报错位置难以察觉） | 排障经验：先看 pt.log 尾部 error M vs Cadence 全系 1P3M → 求助 APR | ⚠️ |\n| [产出] | 评估报告 + IT/APR 分归口求助清单（fc_deploy/planB_inventory_v2_assessment.md） | ✅ |\n\n#### [服务器数据回迁]\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| [提取] | PACK_TAR_0915V0/V1/V2 三包从服务器回传（行为模型 / STD verilog / DV 脚本） | ✅ |\n| [集成] | 三包归位虚拟机 /home/ICer/work/HV2M23（保留服务器目录结构，脚本零改动） | ✅ |\n| [集成] | Analog 行为模型验证：updated→20260725 软链解析正常，DC/DRA/GAMMA/ESD 全部可读，0 悬空 | ✅ |\n| [同步] | 本机仓库 + GitHub 同步今日增量（commit：analog models / STD verilog / DV scripts） | ✅ |\n| [提取] | PACK_TAR_0915V3：M31 标准单元 kit（nldm_db 全 PVT 角 464M / verilog 模型 / lef SL+SS） | ✅ |\n| [集成] | M31 两个悬空软链替换为真文件，nldm_db/lef 归位 cad/STD/9t/，仿真与综合物料齐 | ✅ |\n| [仿真] | **t_LITEST 首跑 PASSED**（UVM_ERROR 0 / 2721.625us 正常结束 / CPU 952s / fsdb 4.3G） | ✅ |\n| [仿真] | **t_8b1lane smoke PASSED**（UVM_ERROR 0 / 1.35ms / 寄存器名表 140 项加载成功），产物落 `/sim_dd/ICer/HV2M23/TOP_TCON_C/` | ✅ |\n| [修复] | 首跑卡死根因=RX PHY 门级 PLL 零延迟环（1050us 冻结 18 分钟），打开 `RX_PHY_BEH` 行为开关解决 | ✅ |\n| [环境] | DC 冒烟通过（dc_shell + M31 nldm 库加载 + list_libs）；服务器式输出结构 `/sim_dd/ICer/HV2M23/TOP_TCON_C/<case>/` 落地 | ✅ |\n\n---\n\n### 发现问题\n\n#### [标准单元模型] M31HSSC900EL150SL/SS.v 软链悬空 ✅ 当日闭环\n\n- 服务器上这两个 .v 本身是指向别处的软链接，打包含入的只是链接本身，虚拟机里打不开（悬空 2 条）\n- **已解决**：V3 包按 readlink 真实目标重新打包（SL_00.01.000 / SS_01.05.000 两个版本目录的 verilog+nldm_db+lef），软链已替换为真文件（3.6M/3.9M）并验证可读\n- 本机 Windows 副本同步完成（真实文件无需软链支持）\n\n#### [仓库合规] 网表/时序库在 git 历史中 ⚠️\n\n- 已跟踪文件含整芯片网表（HV2M23_digital_top.v.gz）、mem/vth 时序库（gitignore 为后加，对已跟踪文件无效）\n- 用户已知情并决定全量上传（私有仓库）；如后续需清理需 git filter-repo 重写历史\n\n#### [方案B 前置项] 三项外部依赖待关闭 ⚠️\n\n| 项 | 问题 | 影响 | 状态 |\n|------|------|------|------|\n| P1 TLU+ | ENEXCHIP 145nm 无 Synopsys 寄生库（全 /eda/process 实测）；仅有 Cadence QRC collateral | FC 全流程时序不可签核 | 🔄 已列 IT 求助清单 |\n| D4 license | fusion feature ABSENT、Synopsys license 服务器不可达 | P&R 能否启动未知 | 🔄 已列 IT 求助清单 |\n| 叠构口径 | milkyway tf=1P4M vs Cadence=1P3M | NDM/B0 floorplan 可比性 | 🔄 已列 APR 求助清单 |\n| P2 RAM | 145nm RAM .db/.lib 全树为零 | 顶层 P&R / B0 选型约束 | 🔄 随 APR 清单一并问 |\n\n---\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 U+ 归口（评估文档 planB_assessment.md 已产出：三形态/前置 7 项/风险 4 项/B0→B1→B2 路线图/决策点 5 项） | ⚠️ | |\n| 09/11 | 综合 / FC 引入 | CSPI_CMD_ALIGN RTL 改动待设计组评审后正式入库：case(1'b1) 重叠项改 OR 累加写法消除 parallel_case 歧义（实验已实测 282→85，吃掉 197 点）。0914 补充：fc_lec 重综合再 PASS（2178/0/0/0）依赖该改动——评审入库前 PASS 基线悬在实验分支上 | 🟡 | |\n| 09/11 | 综合 / FC 引入 | APR_CDM.v 模型代差待 CAD 确认：lib_common_lec.do 第三份模型指向 HV1V21 旧项目路径，疑似旧项目遗留 | ⚠️ | |\n| 09/11 | 综合 / FC 引入 | 历史链（lec_apr / lec_apr_eco）在新 RTL 并行语义下的复验策略待设计组裁决：\"多-hot 是不是合法输入态\" | 🟡 | |\n| 09/08 | 综合 / FC 引入 | Synopsys 寄生库（TLU+，1P4M 叠构）缺失，logic_opto 无法运行；collateral 请求单已拟待发 IT/foundry。09/11 扩充：R1a TLU+（Synopsys 格式 early/late 一对）+ R1b 典型场景 SAIF（或可转 SAIF 的 VCD）——发给 IT/设计组一行字的事，避免 TLU+ 到手后功耗对比白跑一轮（TLU+ 与 SAIF 是乘法关系，缺一不可） | ⚠️ | |\n| 09/08 | 综合 / FC 引入 | RAM .db 路径未确认，NDM 未含 RAM 模型（u_mem* link 会缺） | 🟡 | |\n| 09/08 | 综合 / FC 引入 | 金属叠构 EL150S_1P4M_TM8K 为占位，待 APR 确认。09/15 升级：实测发现两口径矛盾（milkyway 1P4M vs Cadence 全系 1P3M），并入 09/15 合并条目跟踪 | ⚠️ | |\n| 09/08 | 综合 / FC 引入 | `*SFF*` dont_use 模式误伤名字含 SFF 的普通门（SQM-1067），DC 时代同病。09/11 翻案改判关闭：ground truth 实测 `*SFF*` 命中的是 AND2SFFQ* 系列 scan-FF 复合单元（报错消息自带 scan cell 字样），227 次拦截是 SCAN_EN=0 下 dont_use 正常工作，无需收紧（所有单元均以 AL9/AS9 后缀结尾，收紧是 no-op）；结论注释已固化进 dont_use_fc.tcl（行为零改动） | 🔵 | 09/11 |\n| 09/09 | 综合 / FC 引入 | LEC 残留 282 NON-EQ 点判为项目预存 RTL 歧义（CSPI_CMD_ALIGN case(1'b1) parallel_case 重叠项）+ 生产网表 ECO 与 RTL 版本错位，与 FC 无关；移交设计侧立项。09/11 终结：CSPI RTL 修复（282→85）+ phase map 开启（85→0，残余 85 系 phase map 缺席的建模/配点问题）双修复后 fc_lec 终审 PASS（EQ 2178 / NON-EQ 0 / Aborted 0 / Uncompared 0）。0914 终审确认：v4 部署重综合（约束修正真实参与映射，面积 158331.80 = -0.17%）后 fc_lec 再 PASS 2178/0/0/0，结论保持 | 🔵 | 09/11 |\n| 09/02 | 综合 / FC 引入 | FC license 缺失：多台 license 服务器均无 `Fusion-Compiler-NX` feature，fc_shell 无法启动；已反馈 IT，待授权到位后按 `fc/HANDOFF.md` 首跑 | 🔵 | 09/08 |\n| 09/02 | 综合 / FC 引入 | 下游 PT/LEC 写死 `dc/rep_dir/` 路径，FC（`fc/rep_dir/`）产物不被消费；首跑用 `cp fc/rep_dir/*.gv* ../dc/rep_dir/` 过渡，长期方案（SYN_TOOL 参数化 read_design.tcl/rtl_gate.do）待评估结论 | 🟡 | |\n| 06/15 | DRDOD 报告 | 当前 `make_v3.py` 是基于已生成 Excel 的后处理；若从 Markdown 重新生成，需重写生成脚本才能自动把图片放到对应栏目 | 🔵 | 08/25 |\n| 06/24 | DRD_OD / Panel Remap | 当前 RTL 和代码把 G1/G2 当作独立两行处理，但实为 GOA dual-gate；数据无行缓存，按行检测 DRD_OD pattern 的前提错误，需要基于 dual-gate 重新推导 | 🔵 | 06/27 |\n| 06/24 | DRDOD direct data | `drdod_data_gen.svh` 对 L0/L1 的取列方式错误导致 `t_8b2lane_DRD_M_panel_BOE1` 波形异常。已按 `DRD_OD_PATTERN_DETECT.v` 改为 L0 负责奇数列 Y1/Y3/Y5、L1 负责偶数列 Y2/Y4/Y6，并用 `line_num % 4` 循环选 gate。06/29 进一步修正 BOE1/HKC2/HKC5 共 4 处 gate pattern 查表错误，panel 1~7 × G1~G4 全部 28 项与 RTL 模板一致 | 🔵 | 06/29 |\n| 06/24 | DRDOD 部署 | 全部 23 个 DRD case 的 `user_def.sv` 已补 `` `define DRDOD ``；部署包已迭代至 `drd_for_server_v6.tar.gz` | 🔵 | 06/24 |\n| 06/24 | 代码清理 | 已删除 `tests/` 与 `DV_TCON_C/top/tests/` 中废弃的 remap 相关文件 | 🔵 | 06/24 |\n| 06/29 | 项目清理 | 已删除项目根目录 `tests/`；清理 `DV_TCON_C/top/tests/` 下 20+ 个废弃 Python/Shell 脚本与仿真临时产物；case 命名统一为 `t_drdod_<function>_<lane>_<panel>_<color>` | 🔵 | 06/29 |\n| 08/14 | STA PT / TO SIGNOFF | 1P 模式 setup 唯一违例：LENB_R（RX0_CLK 域 output port）output delay 未满足（-0.2255ns @ wc_cbest_125，arrival 10.30 vs required 10.08ns），非内部逻辑路径，需模拟设计师后仿继续确认 | 🔵 | 08/25 |\n", "HV2M23/附件/DRD_OD_dual_gate_analysis_20250624.md": "# DRD_OD 架构理解分析 — RTL 代码验证报告\n\n> **日期**: 2026-06-24  \n> **主题**: 验证 GOA Dual-Gate vs RTL 按行理解的架构偏差  \n> **来源**: 基于 `DRD_OD.v`、`DRD_OD_PATTERN_DETECT.v`、`DRD_OD_ADD_WEIGHT.v` 代码逐行验证\n\n---\n\n## 一、核心结论（用户提出的理解正确）\n\n| 用户观点 | 代码验证结果 | 结论 |\n|---------|------------|------|\n| 数据没有整行缓存 | 无 line buffer，`PATTERN_DETECT` 为纯组合逻辑 | ✅ **正确** |\n| 不存在\"一行缓存\"概念 | 每拍只处理 2 像素（2 列）的 6 个 OP 分量 | ✅ **正确** |\n| G1/G2 是 GOA Dual-Gate，不是两行 | 面板物理层面成立，但 RTL 的 L0/L1 是 2-lane 数据通道 | ✅ **正确（物理层面）** |\n| 之前把 G1/G2 当作 L1/L2 两行是错误理解 | 文档中确实存在 GOA 结构 → RTL 行相位的错位映射 | ✅ **正确** |\n\n---\n\n## 二、RTL 代码逐层验证\n\n### 2.1 数据通路：无整行缓存，per-clock 处理\n\n**文件**: `DRD_OD.v`（line 67-86）\n\n```verilog\nalways @(posedge DTCLK_L0 or negedge RSTN_2P) begin\n    if(!RSTN_2P)\n        DATAI_L0_OD_pre <= 'd0;\n    else if(iSP_1Pto2P) \n        DATAI_L0_OD_pre <= DATAI_L1_OD_pre;            \n    else\n        DATAI_L0_OD_pre <= DATAI_L0;\nend\n```\n\n- `DATAI_L0` / `DATAI_L1` 是 **24-bit 并行输入**（各 1 个 RGB 像素）\n- 每个 `DTCLK` 拍进来 2 个像素，**直接送 `PATTERN_DETECT`**\n- **无 line buffer，无 FIFO，无行级缓存**\n- 处理粒度是 **per-clock（每拍 2 像素）**，不是 per-line（每行 N 像素）\n\n---\n\n### 2.2 PATTERN_DETECT：组合逻辑，每拍只检测 2 列\n\n**文件**: `DRD_OD_PATTERN_DETECT.v`（line 24-38）\n\n```verilog\nwire [7:0]  DATAI_OD_OP1 = DATAI_L0_OD[ 7: 0];  // L0 的 B\nwire [7:0]  DATAI_OD_OP2 = DATAI_L1_OD[ 7: 0];  // L1 的 B\nwire [7:0]  DATAI_OD_OP3 = DATAI_L0_OD[15: 8];  // L0 的 G\nwire [7:0] DATAI_OD_OP4 = DATAI_L1_OD[15: 8];  // L1 的 G\nwire [7:0]  DATAI_OD_OP5 = DATAI_L0_OD[23:16];  // L0 的 R\nwire [7:0]  DATAI_OD_OP6 = DATAI_L1_OD[23:16];  // L1 的 R\n```\n\n`OP1~OP6` 是**同一拍**同时到达的 2 个像素（2 列）的 6 个颜色分量。\n\n但这里的\"2 个像素\"是**当前代码的理解**——即把 2 个 lane 的 48bit 数据当成**横向的 6 个 8bit 数据**（6×8=48bit），按标准 RGB 像素理解：\n\n```\n当前代码的理解（图1）:\n┌────┬────┬────┬────┬────┬────┐\n│ Y1 │ Y2 │ Y3 │ Y4 │ Y5 │ Y6 │  ← 横向 6 个数据（6 列）\n├────┼────┼────┼────┼────┼────┤\n│ R  │ B  │ B  │ R  │ B  │ B  │  ← 行1（某种颜色层）\n│ G  │ R  │ G  │ G  │ R  │ G  │  ← 行2（某种颜色层）\n│ B  │ R  │ B  │ B  │ R  │ B  │  ← 行3（B 层）\n│ G  │ G  │ R  │ G  │ G  │ R  │  ← 行4（G 层）\n└────┴────┴────┴────┴────┴────┘\n```\n\n图1 把数据理解成了**4 行 × 6 列**的完整矩阵（24 个子像素），但 2 个 lane 每拍只有 48bit=6 个 8bit 数据。这意味着图1 不是直接的数据映射，而是当前文档/代码把**面板子像素排列**理解成了\"4 行 phase（L1~L4）× 6 列\"的完整 RGB 矩阵——即每行有完整的颜色分量，把 G1/G2 的 dual-gate 结构错误地展开成了 4 行。\n\n**实际的面板结构（图2）应该是 GOA Dual-Gate：**\n\n```\n实际结构（图2）:\n┌────┬────┬────┬────┬────┬────┐\n│ Y1 │ Y2 │ Y3 │ Y4 │ Y5 │ Y6 │  ← 6 列（每列 1 个子像素）\n├────┼────┼────┼────┼────┼────┤\n│ G  │ B  │ G  │ G  │ B  │ G  │  ← G1 行（Gate 1）= GBGGBG\n│ R  │ R  │ B  │ R  │ R  │ B  │  ← G2 行（Gate 2）= RRBRRB\n└────┴────┴────┴────┴────┴────┘\n```\n\n图2 中：\n- **只有 2 行**（G1/G2），不是 4 行\n- **每列只有 1 个子像素**（不是完整的 RGB 像素）\n- G1 无 R（G1 = GBGGBG），R 都在 G2（G2 = RRBRRB）\n- 每拍 2 个 lane 的 48bit 数据应该对应 **G1 的 3 列 + G2 的 3 列**（共 6 列中的 3 列），而不是 2 个标准 RGB 像素\n\n**两张图的关键差异：**\n\n| 维度 | 图1（当前代码/文档理解） | 图2（实际 GOA Dual-Gate） |\n|------|------------------------|------------------------|\n| 行数 | 4 行（某种颜色层/phase 展开） | 2 行（G1/G2） |\n| 每列分量数 | 每列有多个颜色（完整 RGB） | 每列只有 1 个子像素 |\n| G1 结构 | 隐含在 4 行中，未明确区分 | 明确为 G1 = GBGGBG |\n| G2 结构 | 隐含在 4 行中，未明确区分 | 明确为 G2 = RRBRRB |\n| R 的位置 | 分散在 4 行中 | 集中在 G2 行 |\n| 数据映射 | 6 个 OP = 2 个标准 RGB 像素 | 6 个 OP = G1 的 3 列 + G2 的 3 列 |\n\n> **附件图片**：`图1_当前代码理解_横向6数据.png`、`图2_实际GOA_dual_gate结构.png`\n\n```verilog\nwire [5:0] op_no_zero_match = {OP6_no_zero, OP5_no_zero, OP4_no_zero,\n                                OP3_no_zero, OP2_no_zero, OP1_no_zero};\nwire od_pattern_hit = (op_no_zero_match == od_pattern_match);\n```\n\n- `PATTERN_DETECT` 是**纯组合逻辑**\n- 每拍比较 `op_no_zero_match` 与 `od_pattern_match`\n- 检测范围 = **2 列（2 个像素）的 6 个子像素**\n- 不是\"一行\"的检测，不是\"多列\"的检测\n\n---\n\n### 2.3 `line_cnt_od` 的作用：模板选择器，不是数据处理\n\n**文件**: `DRD_OD_ADD_WEIGHT.v`（line 137-147, 167）\n\n```verilog\nalways @(posedge CLK_L0 or negedge RSTN) begin\n    if(!RSTN)      line_cnt_od <= 'd0;\n    else if(VS)    line_cnt_od <= 'd0;\n    else if(LS_L0)\n        if(line_cnt_od == OD_LINE_CNT_TARGET)\n            line_cnt_od <= 'd0;\n        else\n            line_cnt_od <= line_cnt_od + 1;\nend\nassign OD_phase_sel = line_cnt_od[1:0];\n```\n\n- `line_cnt_od` 是**行计数器**，只在 `LS_L0`（行同步）时 +1\n- 唯一作用：驱动 `OD_phase_sel` 选择当前用哪个 match template（L1/L2/L3/L4）\n- **不参与数据缓冲**，不改变 `PATTERN_DETECT` 的 per-clock 机制\n- `OD_phase_sel` 是**查表索引**，不是数据流控制信号\n\n---\n\n### 2.4 RTL 的 L0/L1 是 2-lane 数据通道，不是 GOA 的 G1/G2\n\n| 概念 | 物理含义 | 对应关系 |\n|------|---------|---------|\n| `DATAI_L0` | 偶数列像素（lane 0） | 数据传输通道 |\n| `DATAI_L1` | 奇数列像素（lane 1） | 数据传输通道 |\n| GOA G1 | Dual gate 的第一条 gate 线 | 面板驱动结构 |\n| GOA G2 | Dual gate 的第二条 gate 线 | 面板驱动结构 |\n\n`OP1~OP6` 检测的是 2 列的 RGB 分量（每列 3 色），这 2 列可能是 GOA G1 和 G2 对应的不同列。但 RTL 并不知道 GOA 的 dual gate 结构，它只处理 2-lane 数据。\n\n---\n\n### 2.5 BOE1 模板的验证：RTL 只检测 2 列，但模板覆盖 6 列逻辑\n\n**文件**: `DRD_OD_PATTERN_DETECT.v`（line 126）\n\n```verilog\n{3'd7, 2'd0}: begin {r_match, g_match, b_match} = \n    {6'b000000, 6'b101101, 6'b010010}; ... // BOE1 L1\n```\n\nBOE1 L1 的模板：\n- `r_match = 6'b000000` → 要求 OP1~OP6 的 R 分量全为 0\n- `g_match = 6'b101101` → G 分量特定位置非零\n- `b_match = 6'b010010` → B 分量特定位置非零\n\n但用户指出 BOE1 的 G1 对应 `GBGGBG`（6 列的 G/B 排列），G1 无 R，R 在 G2。\n\n**问题**：RTL 的 `PATTERN_DETECT` 每拍只检测 2 列（6 个 OP），但 BOE1 的 GOA 结构是 6 列的 dual gate 排列。模板 `6'b000000` 对应 6 个 OP 位，但每拍只有 2 列数据进来。\n\n这意味着：\n1. 模板的设计可能是基于 6 列的某种折叠或聚合逻辑\n2. 或者模板的 `6'b000000` 在 dual gate 结构下意味着\"当前 2 列中无 R\"，而 R 在下一拍（对应 G2 的列）\n3. 当前模板的 zero/non-zero 检测可能不是直接对应物理列的 color 存在性，而是对应某种更抽象的 pattern\n\n这需要结合面板的 GOA 时序和 TCON 的数据发送时序来重新推导。\n\n---\n\n## 三、文档中的理解偏差（已确认）\n\n### 3.1 `DRD_OD_analysis.md` 中的问题\n\n文档将 `OD_phase_sel` 的 L1/L2/L3/L4 描述为\"每 4 行一个 phase 周期\"、\"行相位\"。这个描述在**数据发送时序**层面是正确的，但可能混淆了：\n\n- **数据时序行**：TCON 发送数据时的行计数（`line_cnt_od` 驱动）\n- **GOA gate 行**：面板物理上的 gate 线（G1/G2 是 dual gate 的上下两条线）\n\n图1 展示了当前文档/代码的理解：把面板排列理解成了\"4 行 × 6 列\"的完整 RGB 矩阵（每行有完整的颜色分量）。但图2 显示实际面板只有 **2 行（G1/G2）× 6 列**，每列只有 1 个子像素。\n\n这意味着：\n- **当前文档把 G1/G2 的 2 行 dual-gate 结构错误地展开成了 4 行**（可能是把 G1/G2 + 某种 polarity 或其他因素理解为 4 行）\n- **4 个 phase（L1~L4）可能不是对应 4 行子像素排列**，而是对应某种更复杂的时序（如 G1/G2 × 2 种 polarity = 4 种状态）\n- `OD_phase_sel` 的 4 个值需要重新解释为 GOA dual-gate 的某种时序控制，而不是简单的\"行相位\"\n\n### 3.2 `DRD_OD_Panel_Remap_Plan.md` 中的问题\n\n文档 §2.1 的物理排列表和 §2.4 的 remap 规则表，基于\"L0/L1 分别负责 3 列\"的假设推导。但如果 G1/G2 是 dual gate：\n- G1 和 G2 不是按列划分的（不是 G1=偶数列，G2=奇数列）\n- G1 和 G2 是按**行（水平线）**划分的，可能 G1 驱动上半屏的行，G2 驱动下半屏的行\n- 或者 G1/G2 是同一行上的 dual gate（两条 gate 线控制同一行像素的不同子像素）\n\n无论哪种 dual gate 结构，remap 的\"列分配\"逻辑（L0=col0,2,4；L1=col1,3,5）可能都需要重新审视。\n\n更关键的是，当前文档中的 remap 推导基于**图1 的 4 行理解**，而实际面板是**图2 的 2 行 dual-gate**。这意味着：\n- `panel_remap.svh` 中的 `L0/L1` mask 表可能把数据映射到了错误的行/phase\n- BOE1 L1 的 `BGGBGG` 排列（文档中）与实际 G1 的 `GBGGBG`（图2）不一致\n- 整个 remap 规则的前提（\"标准 RGB 像素 → 面板子像素排列\"）可能需要改为\"标准 RGB 像素 → GOA dual-gate 子像素排列\"\n\n---\n\n## 四、关键发现：RTL 模板与物理面板的映射关系待澄清\n\n### 4.1 当前 RTL 模板的设计假设\n\nRTL 的 `PATTERN_DETECT` 模板是一个 **6-bit 向量**，对应 2 列（2 像素）的 6 个子像素：\n\n```\nOP1 = L0[7:0]   = pixel[even].B\nOP2 = L1[7:0]   = pixel[odd].B\nOP3 = L0[15:8]  = pixel[even].G\nOP4 = L1[15:8]  = pixel[odd].G\nOP5 = L0[23:16] = pixel[even].R\nOP6 = L1[23:16] = pixel[odd].R\n```\n\n模板 `6'b101101` 表示：\n- bit5=1 → OP6 (G2_sub1) ≠ 0\n- bit4=0 → OP5 (G1_sub1) = 0\n- bit3=1 → OP4 (G2_sub2) ≠ 0\n- bit2=1 → OP3 (G1_sub2) ≠ 0\n- bit1=0 → OP2 (G1_sub3) = 0\n- bit0=1 → OP1 (G2_sub3) ≠ 0\n\n**注意**：这里 OP 到 G1/G2 子像素的映射关系需要根据实际数据发送顺序重新推导。当前代码的映射是\"标准 RGB\"理解（B1/B2/G1/G2/R1/R2），但实际的 6 个 OP 应该对应 **G1 的 3 列子像素 + G2 的 3 列子像素**（或反之），具体取决于 TCON 的数据打包顺序。\n\n### 4.2 与 BOE1 G1 = GBGGBG 的关系\n\n如果 BOE1 G1 的排列是 `GBGGBG`（6 列），G2 是 `RRBRRB`（6 列）：\n- G1: col0=G, col1=B, col2=G, col3=G, col4=B, col5=G — **无 R**\n- G2: col0=R, col1=R, col2=B, col3=R, col4=R, col5=B — **有 R**\n\nRTL 每拍处理 2 个 lane 的 48bit 数据。在**当前代码的理解**（图1）中，这 48bit 被当成 2 个标准 RGB 像素（横向 6 个 8bit 分量）：\n\n```\n当前代码的理解：\nL0 = {R, G, B}  (pixel[even] 的标准 RGB)\nL1 = {R, G, B}  (pixel[odd] 的标准 RGB)\nOP1~OP6 = {L1.B, L0.B, L1.G, L0.G, L1.R, L0.R}  ← 按标准 RGB 分量命名\n```\n\n但在**实际的面板结构**（图2）中，这 48bit 应该对应 **G1 的 3 列 + G2 的 3 列**（每列 1 个子像素，不是 3 个）：\n\n```\n实际结构（以 col0~2 为例，假设 TCON 按 G1→G2 顺序发送）：\nL0 = {G1_col2, G1_col1, G1_col0}  = {G, B, G}  ← G1 的 3 列子像素\nL1 = {G2_col2, G2_col1, G2_col0}  = {R, R, B}  ← G2 的 3 列子像素\n\nOP1~OP6 应该对应：\nOP6 = L1[23:16] = G2_col0 = R\nOP5 = L1[15:8]  = G2_col1 = R\nOP4 = L1[7:0]   = G2_col2 = B\nOP3 = L0[23:16] = G1_col0 = G\nOP2 = L0[15:8]  = G1_col1 = B\nOP1 = L0[7:0]   = G1_col2 = G\n\nop_no_zero = {B≠0, R≠0, R≠0, G≠0, B≠0, G≠0} = 6'b111111（所有非零）\n```\n\n但 BOE1 L1 的模板是：\n- `r_match = 6'b000000` — 要求所有 OP 为 0，但 G2 有 R（非零），这不可能匹配\n- `g_match = 6'b101101` — 要求 OP6=1, OP5=0, OP4=1, OP3=1, OP2=0, OP1=1\n- `b_match = 6'b010010` — 要求 OP6=0, OP5=1, OP4=0, OP3=0, OP2=1, OP4=0\n\n**核心矛盾**：\n1. 如果 6 个 OP 对应 G1 的 3 列 + G2 的 3 列，那么 G2 有 R（OP5, OP6 非零），但 `r_match=000000` 要求所有 OP 为 0\n2. 这意味着 `r_match` 在 L1 时永远不匹配（因为 G2 有 R）\n3. 但 `g_match=101101` 和 `b_match=010010` 有非零位，说明模板期望某些 OP 非零\n\n**可能的解释**（待验证）：\n- **解释 A**：`r_match` 在 L1 时确实应该为 `000000`，因为 G1 无 R，且当前拍不检测 G2 的 R（或者 G2 的 R 在另一拍处理）\n- **解释 B**：TCON 的数据发送顺序不是 G1→G2，而是其他方式（如交错发送），导致 6 个 OP 的映射关系不同\n- **解释 C**：模板中的 6-bit 不是直接对应物理列的 zero/non-zero，而是某种经过 remapping 或聚合后的抽象 pattern\n- **解释 D**：当前 RTL 的 `OP1~OP6` 命名（B/G/R）是误导性的，实际数据已经是子像素顺序，但模板设计假设了某种特定的数据打包方式\n\n无论哪种解释，**当前代码把 48bit 当成\"横向 6 个标准 RGB 分量\"的理解与图2 的实际 GOA dual-gate 结构存在根本性偏差**。`OP1~OP6` 的映射关系、模板匹配的含义、以及 `OD_phase_sel` 的 4 个 phase 与 G1/G2 的对应关系，都需要基于 GOA 时序和 TCON 数据发送方式重新推导。\n\n### 4.3 需要重新推导的问题清单\n\n1. **GOA Dual-Gate 的物理时序** vs **TCON 数据发送时序** 的对应关系\n2. **6 列的物理排列** 如何映射到 **每拍 2 列的 OP1~OP6**\n3. **L1/L2/L3/L4 的 phase 定义** 在 dual gate 面板中对应什么（gate 周期？数据发送周期？）\n4. **模板 `r_match/g_match/b_match` 的 6-bit** 是否直接对应物理列的 color 存在性，还是某种抽象 pattern\n\n---\n\n## 五、后续行动建议\n\n| 优先级 | 事项 | 说明 |\n|-------|------|------|\n| 🔴 高 | 获取 BOE1 面板的 GOA 时序文档 | 确认 G1/G2 的 dual gate 结构、驱动时序、与 TCON 数据发送的对齐关系；明确图2 的 G1/G2 与 TCON lane 的映射 |\n| 🔴 高 | 重新推导 6 个 OP 与 G1/G2 子像素的映射关系 | 基于 GOA 时序和 TCON 数据打包方式，重新解释 `OP1~OP6` 对应 G1 的哪 3 列 + G2 的哪 3 列 |\n| 🔴 高 | 重新解释 `OD_phase_sel` 的 4 个 phase | 4 个 phase（L1~L4）在 dual-gate 面板中对应什么（G1/G2 × 2 polarity？或其他时序？） |\n| 🔴 高 | 重新推导 BOE1 L1/L2/L3/L4 模板与物理排列的映射 | 基于 GOA 时序重新解释 `r_match/g_match/b_match` 的 6-bit 含义；验证模板是否与图2 的 G1/G2 排列一致 |\n| 🟡 中 | 重新审视 `panel_remap.svh` 的设计前提 | 如果 dual gate 结构改变了列分配逻辑，remap 方案可能需要重新设计；修正 BOE1 L1 的 `BGGBGG` → `GBGGBG` |\n| 🟡 中 | 验证其他 panel（HKC1~HKC8）是否也存在类似问题 | 检查是否所有 panel 的模板都需要基于 GOA 结构重新推导 |\n| 🟢 低 | 更新 `DRD_OD_analysis.md` 和 `DRD_OD_verification_plan.md` | 在澄清物理映射后，同步更新文档中的架构描述和测试策略 |\n\n---\n\n## 六、附件参考\n\n- 本文件：`附件/DRD_OD_dual_gate_analysis_20250624.md`\n- 附件图片：`附件/图1_当前代码理解_横向6数据.png`、`附件/图2_实际GOA_dual_gate结构.png`\n- 原始 RTL 文件：`E:/project/HV2M23/hdl/DRD_OD.v`、`DRD_OD_PATTERN_DETECT.v`、`DRD_OD_ADD_WEIGHT.v`\n- 相关文档：`E:/project/HV2M23/markdown_drdod/DRD_OD_analysis.md`、`DRD_OD_Panel_Remap_Plan.md`\n", "工作周报/README.md": "# 工作周报\n\n本目录用于存放每周工作周报，按时间范围归档。\n\n## 格式规则\n\n详细规则见：[格式规则.md](格式规则.md)\n\n- 周报周期：**周三 ~ 下周二**\n- 文件命名：`工作周报_YYYYMMDD-YYYYMMDD.md`\n- 结构：本 开经验文档。\n\n//-----------------------------------//\n\n### HK1V11\n\n待确认/待讨论：\n\n- 暂无。\n\n进行中：\n\n1. DV 验证环境（env_cfg/reg_model）与 0811v1 RTL 存在多处不一致（reg51 位偏移、缺 CDR/BCC/VPS_EN 打包），按要求暂缓同步，待确认后执行。\n\n已完成：\n\n1. 完成 LC_CPUWR 按 20260817 寄存器表全表复核：修正 reg51 sw_reg_lane_ctrl 位映射 [5:1]→[6:2]、reg66 命名 LD_F→LD_W，确认全部寄存器位映射与 0817 表一致（含 reg56 EOL、VPS_EN 解析位置），已推送并同步 history 网站。\n\n## 下周计划（Next week's plan）\n\n### HV2M23\n\n1. 服务器跑 PT 全 corner 回归，验证 multicycle 改造后 setup/hold/门控三类检查收敛。\n2. 根据 PT 结果处理 DPSEL_I/LC_MONBLOCK 路径违例，补齐替代约束。\n3. 收集剩余时钟门控检查违例清单，按同模式批量处理。\n4. 跟进 LENB_R 1P setup 违例的模拟后仿确认结果。\n\n### HK1V11\n\n1. BCC SPEC 确认后接入 bcc_ctrl，相关寄存器改由 decoder 驱动。\n2. 确认后同步 DV 验证环境（env_cfg/reg_model）与 0811v1 RTL（含 VPS_EN 打包）。\n3. 确认 VPS_EN_0/VPS_EN_1 更上层连接后完成接入。\n\n## 需要协调和帮助（Needs coordination and assistance）\n\n1. [HV2M23] LENB_R 1P 模式 setup 违例（-0.2255ns，输出端口 output delay 未满足，非内部逻辑路径）需模拟设计师后仿继续确认（本周新反馈）。\n2. [HK1V11] VPS_EN_0/VPS_EN_1 更上层（LOGIC_CENTER 等）连接需确认，当前在 LINK_CONFIG_CTRL 空接。\n3. [HK1V11] BCC 协议 SPEC 需确认，以推进 bcc_ctrl 接入（延续上周）。\n4. [HK1V11] 420b RTL 解码问题（tag_value 块边界时序）需 RTL 侧（俊杰）推进修复（延续上周）。\n5. [HK1V11] 420b K3 使用条件需 Spec/设计确认（延续上周）。\n", "工作周报/工作周报_20260819-20260825.md": "# 工作周报 - 2026/08/19 ~ 2026/08/25\n\n## 本周工作（This week's work）\n\n### HV2M23\n\n待确认/待讨论：\n\n- 暂无。\n\n进行中：\n\n- 暂无。\n\n已完成：\n\n1. 完成 BE Review 报告交付：PPT 自 v24 至 v30 多轮迭代定稿（新增 PowerPro、当前生效 false path、功耗对比等章节页，38 页版式、字体、颜色全量统一为正式标准），配套报告与网站同步更新。\n2. 完成 STA 约束覆盖率清零：prePT untested 归零并建档，out_hold 281 项违例定界为 APR 处置范围。\n3. 完成 PowerPro RTL 级功耗分析流程跑通：6 组模式功耗数据提取（1P 10.53 ~ 2P drdod 14.73 mW）并上图上线。\n4. 完成 HV2M23 签核检查表 Excel 建档（LEC 三段 ALL EQ、UPF/scan/mbist 口径确认）。\n5. 完成 RTL 更新至服务器 0825 最新包并入库；完成 DRDOD 时钟链与选择机制分析存档。\n\n//-----------------------------------//\n\n### HK1V11\n\n待确认/待讨论：\n\n- 暂无。\n\n进行中：\n\n1. 服务器 0825 集成基线下的后续对齐工作推进中（bcc_ctrl 配套、DV env 建模）。\n\n已完成：\n\n1. 完成服务器 0825 集成包同步：HDL RTL（含 bcc_ctrl 升级、新增 CDR_CRC_DET/SHORT/LONG_ENCODING）整体替换本地，DV_TCON_C 按文件名同步，已提交推送。\n2. 完成 BCC 方向定论与实现：确认 CPUWR 无 BCC 总线访问权限，LC_CPUWR 082 至 IT/foundry（TLU+ 1P4M 寄生库、官方 NDM、RAM 模型）。\n3. TLU+ 到位后切换 full 模式，补齐 logic_opto/final_opto 并与 DC 做 QoR 对比。\n4. 开展 PT 冒烟验证（fc_pre/ 验证目录已备好）。\n\n## 需要协调和帮助（Needs coordination and assistance）\n\n1. [HV2M23] 需 IT/foundry 提供 TLU+ 寄生库（1P4M 叠构）、官方 NDM 及 RAM 模型，以解锁 FC logic_opto/final_opto 阶段与 RAM link。\n2. [HV2M23] 需 APR 确认金属叠构 EL150S_1P4M_TM8K。\n3. [HV2M23] LEC 残留不等价点（项目预存 RTL 歧义 + ECO 版本错位）需设计侧立项处理。\n", "工作周报/工作周报_20260909-20260915.md": "# 工作周报 - 2026/09/09 ~ 2026/09/15\n\n## 本周工作（This week's work）\n\n### HV2M23\n\n待确认/待讨论：\n\n1. 方案 B（FC 全流程 RTL→GDS）启动决策待管理层/设计组答复，共 5 个决策点（pilot 投入、后端界面开放、签核工具选型、FC license 等级、TLU+ 归口），评估文档已产出。\n2. CSPI 模块 RTL 修改（消除综合歧义构造）待设计组评审后正式入库，当前 LEC 通过基线依赖该修改。\n3. 历史链（LEC APR / APR ECO）在新 RTL 并行语义下的复验策略待设计组裁决。\n\n进行中：\n\n1. collateral 与外部依赖跟进中（TLU+ 获取路径、fusion license 来源、金属叠构口径矛盾、RAM 模型渠道），已形成 IT/APR 分归口求助清单待答复。\n\n已完成：\n\n1. 完成 FC 引入方案 A 验收闭环：定位 LEC 残留不等价点双重根因（RTL 歧义构造 + 相位映射默认关闭）并修复，不等价点收敛至 0（2178 个比较点形式证明 FC 网表与 RTL 等价）；服务器端部署、重综合、LEC、PT 终验全部通过，并输出 FC vs DC 首份 QoR 硬对比（面积较 DC 低约 5.4%，功耗对比待 TLU+）。\n2. 完成 PT 对 FC 产物消费验证：网表与 SDC 零改动接入、setup 零违例；定位约束错绑根因（工具间门名轮转）并迁移至 RTL 锚点，PT 告警归零。\n3. 完成外部《FC 迁移体检报告》逐条核实定案：确认寄存器合并未生效与 TLU+ 硬性前置两项属实，驳回 RAM 面积口径与 dont_use 误拦两项误判。\n4. 完成 FC 评估资产沉淀归档：部署体系升级并经服务器实测零漂移，全套流程与文档推送仓库。\n5. 完成 HV2M23 本地验证环境搭建与资料完整性盘点：EDA 虚拟机环境落地，RTL/验证环境/综合脚本体检齐全、缺口定性，服务器数据包与标准单元库回迁归位并同步仓库。\n6. 完成 FC 全流程（方案 B）服务器资源侦察：确认综合/P&R/签核工具链无缺口，145nm 工艺无 Synopsys 寄生库但锁定 Cadence QRC 备选，产出评估报告与 IT/APR 分归口求助清单。\n\n//-----------------------------------//\n\n### HK1V11\n\n待确认/待讨论：\n\n- 暂无。\n\n进行中：\n\n1. postPT 两项 P0 收尾推进中：skew 抓取脚本需按新网表重写；时序收敛尚未达成。\n2. 0914 新版 APR 交付后的全量基线建立中：全 corner postPT 与汇总待跑，配套交付文件同版性待核对。\n3. 跟进下个服务器包吸收本地寄存器修复，完成内外版本对齐。\n\n已完成：\n\n1. 定位并修复 postPT 网表/寄生数据跨源跨版问题：寄生注解率仅 0.2% 导致整批假时序数据，切回同源后注解率恢复、结果确认正常；旧批次数据作废，沉淀\"注解率先行检查\"判据。\n2. 完成 post/PT 报告结构改造并上线服务器：产物按运行轮次归档，存量 120+ 历史运行一次性收编零丢失，上线过程三个问题当日闭环。\n3. 完成 LC_REG_MAPPING 版本对齐服务器口径（保留门控修复、停用服务器已另行处理的条件编译分支），双分支验证通过，变更台账同步入库。\n4. 完成 0909 服务器包整树集成与逐模块一致性评估，明确本地与服务器版本差异清单及吸收计划。\n\n## 下周计划（Next week's plan）\n\n### HV2M23\n\n1. 推动 CSPI RTL 修改设计组评审入库，消除 LEC 基线对实验分支的依赖。\n2. 跟进 TLU+ / SAIF 到位；到位后切换 full 模式补齐 logic_opto/final_opto，并完成与 DC 的功耗/QoR 对比。\n3. 根据方案 B 决策结论启动试点准备或继续挂起。\n4. 跑通虚拟机首次 UVM 仿真（环境与模型已就绪），并跟进 IT/APR 对方案 B 求助清单的答复。\n\n### HK1V11\n\n1. 完成全量 10 corner postPT 与汇总，建立 0914 新基线。\n2. 启动 skew 抓取脚本按新网表重写。\n3. 推进时序收敛。\n4. 跟进下个服务器包对本地修复的吸收对齐。\n\n## 需要协调和帮助（Needs coordination and assistance）\n\n1. [HV2M23] 需管理层/设计组对方案 B（FC 全流程）启动的 5 个决策点给出裁决。\n2. [HV2M23] 需设计组评审 CSPI RTL 修改并正式入库，同时裁决历史链复验策略。\n3. [HV2M23] 需 IT 支持核实并开放：fusion feature license 来源与档位（当前服务器确认缺失）、TLU+ 寄生库获取路径（145nm 无 Synopsys 寄生库，待归口）、SAIF 场景及 NDM/RAM 模型；已预先向顾老板知会，待全部需求梳理清楚后统一提交给她。\n4. [HV2M23] 需 APR 对金属叠构口径定论（milkyway 1P4M 与 Cadence 1P3M 存在矛盾），需 CAD 确认 APR_CDM.v 模型代差。\n", "工作周报/工作周报格式规则.md": "# 工作周报格式规则\n\n> 本文件定义 AI 助手生成 `工作周报/` 目录下周报时必须遵守的格式、周期和填写规范。\n\n## 一、周报周期\n\n- **起始**：每周三\n- **结束**：下周二\n- **覆盖范围**：起始日至结束日（含）之间的所有项目日报\n- **文件命名**：`工作周报_YYYYMMDD-YYYYMMDD.md`\n  - 例如：`工作周报_20260610-20260616.md`\n\n## 二、文件位置\n\n- 存放目录：`E:\\每日记录\\工作周报\\`\n- 索引文件：`E:\\每日记录\\工作周报\\README.md`（生成新周报后必须追加到列表）\n\n## 三、周报核心原则\n\n周报是**给领导看的总结**，不是个人流水账。必须满足：\n\n1. **精简**：每个项目\"已完成\"控制在 3~5 条，最多不超过 6 条。\n2. **准确**：只写真实状态，不虚构、不夸大、不猜测。\n3. **合并**：同类、同模块、同目标的事项必须合并成一条。\n4. **无日期**：周报是总结，不需要标注 `[MM/DD]` 日期。\n5. **去脚本化**：内部工具脚本（如 `fix_xxx.py`、`make_v3.py`）是自己用的，不写进周报；只有需要分享/复用的工具才简要提及。\n6. **状态真实**：\n   - **待确认/待讨论**：必须是真正需要外部确认或设计决策的事项，不能把\"下一步计划\"\"待验证\"\"内部待做\"放进来。\n   - **进行中**：必须是本周已开始、尚未完成、下周还会继续的真实工作。\n   - **已完成**：必须是本周内实际完成、可验证的交付物或结论。\n   - **需要协调和帮助**：必须是真正需要他人配合、支持或确认的事项，不能是内部可自行推进的工作。\n\n## 四、周报结构\n\n周报必须包含以下 3 个一级标题，**禁止**添加\"今天更新汇总\"等额外一级标题：\n\n```markdown\n# 工作周报 - YYYY/MM/DD ~ YYYY/MM/DD\n\n## 本周工作（This week's work）\n\n## 下周计划（Next week's plan）\n\n## 需要协调和帮助（Needs coordination and assistance）\n```\n\n### 4.1 本周工作\n\n- 按项目分二级标题，格式：`### 项目名`\n- 当前周报涉及的所有项目都必须列出\n- 每个项目下按状态分组，使用纯文本标签（不要用加粗标题，避免 lint 警告）：\n  - `待确认/待讨论：` 后面换行跟列表\n  - `进行中：` 后面换行跟列表\n  - `已完成：` 后面换行跟列表\n- 状态分组必须全部出现，无内容时写：`- 暂无。`\n- 项目之间使用 `//-----------------------------------//` 分隔\n\n#### 已完成事项写作要求\n\n- 每条一句话，说明**交付了什么结果**，不要罗列过程细节。\n- 禁止出现：代码行号、具体文件名（除非该文件本身就是交付物）、实现步骤、调试过程。\n- 示例：\n  - ✅ 完成 DRDOD 设计报告 Excel v3，图片按规则分散到各内容 sheet。\n  - ✅ 完成 LC_CPUWR 及 LC_REG_MAPPING 重写，支持 chip_sel=1。\n  - ❌ 完成 `LC_CPUWR_20260616_v2_decimal.v` 创建，0x09/0x0A/0x1D/0x1E 改为参与 Seg1 checksum 并受 shadow 寄存器保护，`VBK_EN` 不再由 LC_CPUWR 直接输出。\n\n#### 进行中事项写作要求\n\n- 说明当前状态和阻碍/风险。\n- 如果工作被拖延或转移，如实说明原因，不要含糊。\n- 示例：\n  - ✅ 修改 TCON 环境以适配 DRDOD 功能；途中内网 AI 环境故障，同时转向处理 HK1V11，目前拖延，后续是否继续推进尚不确定。已输出修改计划 Markdown 文件。\n\n#### 待确认/待讨论事项写作要求\n\n- 只写真正需要外部决策或他人反馈的事项。\n- 不能把\"待验证\"\"待优化\"\"待继续\"放进来。\n- 示例：\n  - ✅ DRDOD 规格与 RTL 差异边界待 SPEC/RTL review 确认。\n  - ❌ v3 Excel 图文排版效果待验证后调整。\n\n### 4.2 下周计划\n\n- 按项目分二级标题：`### 项目名`\n- 列出明确的下周待执行事项\n- 事项以动词开头，标明目标或交付物\n- 如果本周某工作已停滞或转移，下周计划需反映真实打算\n\n### 4.3 需要协调和帮助\n\n- 跨项目的协调事项统一放在此处\n- 每条标注所属项目：`[项目名] 事项描述`\n- 只写真正需要他人配合的事项，内部可自行推进的不写\n- 示例：\n  - ✅ [HK1V11] 需夏鹏协助讨论并确定 LC_CPUWR / LC_REG_MAPPING 新功能的验证环境修改方案。\n  - ❌ [HK1V11] 完成 LC_CPUWR 上层 module 实例化同步修改。\n\n## 五、内容来源\n\n生成周报前必须阅读以下资料：\n\n1. **本周所有日报**：检查 `E:\\每日记录\\HK1V11\\每日记录_*.md` 和 `E:\\每日记录\\HV2M23\\每日记录_*.md`\n2. **遗留问题文件**：\n   - `E:\\每日记录\\HK1V11\\遗留问题.md`\n   - `E:\\每日记录\\HV2M23\\遗留问题.md`\n3. **上周周报**（如有）：用于延续未关闭事项\n4. **每周记录.md**（参考）：`E:\\每日记录\\每周记录.md`\n\n## 六、遗留问题同步规则\n\n整理周报时必须检查各项目的 `遗留问题.md`：\n\n- 本周新出现的跨天未关闭问题，应在周报\"待确认/待讨论\"或\"需要协调和帮助\"中体现\n- 状态发生变化的遗留问题，应更新描述\n- 已关闭的问题不再写入周报\n- 不要把\"下一步计划\"\"待继续推进\"自动当作遗留问题\n\n## 七、禁止事项\n\n1. ❌ 禁止添加\"今天更新汇总\"\n2. ❌ 禁止标注日期 `[MM/DD]`\n3. ❌ 禁止罗列过程细节、代码实现、调试步骤\n4. ❌ 禁止写入内部脚本/工具文件名（除非作为分享交付物简要提及）\n5. ❌ 禁止虚构未提及的内容、责任人或结论\n6. ❌ 禁止把\"待验证\"\"待优化\"\"待继续\"放入\"待确认/待讨论\"\n7. ❌ 禁止把内部可自行推进的工作放入\"需要协调和帮助\"\n8. ❌ 禁止遗漏本周有日报记录的项目\n9. ❌ 禁止在周报中混入非项目内容（如本地网站建设、工具优化等）\n\n## 八、生成流程\n\nAI 生成周报时应按以下顺序执行：\n\n1. 确定本周起止日期（周三→周二）\n2. 列出本周所有日报文件\n3. 逐份阅读日报，按项目/状态分类提取关键事项\n4. 合并同类事项，删除过程细节和日期\n5. 判断每个事项的真实状态：\n   - 是否真正需要外部确认 → 待确认/待讨论\n   - 是否正在推进但未完成 → 进行中\n   - 是否本周已完成 → 已完成\n   - 是否真正需要他人配合 → 需要协调和帮助\n6. 按本规则结构撰写周报\n7. 更新 `E:\\每日记录\\工作周报\\README.md` 周报列表\n\n## 九、示例结构\n\n```markdown\n# 工作周报 - 2026/06/10 ~ 2026/06/16\n\n## 本周工作（This week's work）\n\n### HV2M23\n\n待确认/待讨论：\n\n1. DRDOD 规格与 RTL 差异边界待 SPEC/RTL review 确认。\n\n进行中：\n\n1. 修改 TCON 环境以适配 DRDOD 功能；因内网 AI 环境故障及转向 HK1V11，目前拖延。已输出修改计划。\n\n已完成：\n\n1. 完成 DRDOD 设计报告 Excel v3。\n\n//-----------------------------------//\n\n### HK1V11\n\n待确认/待讨论：\n\n- 暂无。\n\n进行中：\n\n1. LC_CPUWR / LC_REG_MAPPING 已完成第一次修改，准备移入内网，正在推进。\n2. 对新功能进行验证，并与夏鹏讨论验证环境修改方案。\n3. 验证 LINK_LOGIC 上层实例化变更在目标环境的应用效果。\n\n已完成：\n\n1. 完成 LC_CPUWR 寄存器映射变更与源码实现。\n2. 完成 NG Unlock 方案设计与定稿，确定 Plan B 为推荐方案。\n3. 完成 LC_CPUWR 及 LC_REG_MAPPING 重写，支持 chip_sel=1。\n4. 完成 LINK_LOGIC 上层 module 实例化同步与文档归档。\n\n## 下周计划（Next week's plan）\n\n### HV2M23\n\n1. 视内网 AI 环境恢复情况，继续推进 TCON 环境修改。\n\n### HK1V11\n\n1. 推进 LC_CPUWR / LC_REG_MAPPING 向内网迁移。\n2. 完成新功能验证，并与夏鹏确认验证环境修改方案。\n3. 验证 LINK_LOGIC 实例化变更在目标环境的效果。\n\n## 需要协调和帮助（Needs coordination and assistance）\n\n1. [HV2M23] 需确认 DRDOD 规格与 RTL 差异边界。\n2. [HK1V11] 需夏鹏协助讨论验证环境修改方案。\n3. [HK1V11] 需内网环境支持以完成迁移与验证。\n```\n\n## 十、修订记录\n\n| 日期 | 修订内容 |\n|------|----------|\n| 2026/06/16 | 初版：明确周报周期、结构、格式要求 |\n| 2026/06/16 | 新增精简、准确、合并、无日期、去脚本化、状态真实等核心原则 |\n"};

    function renderTree(tree, parentPath = "") {
      let html = "";
      const dirs = tree.__dirs__ || {};
      const files = tree.__files__ || [];

      for (const dirName of Object.keys(dirs).sort()) {
        const fullPath = parentPath ? parentPath + "/" + dirName : dirName;
        html += `<div class="dir" onclick="toggleDir(this)">📁 ${dirName}</div>`;
        html += `<div class="dir-children" style="display:block">${renderTree(dirs[dirName], fullPath)}</div>`;
      }

      for (const file of files.sort().reverse()) {
        const fullPath = parentPath ? parentPath + "/" + file : file;
        html += `<div class="file" data-path="${fullPath}" onclick="openFile('${fullPath}')">📝 ${file}</div>`;
      }
      return html;
    }

    function toggleDir(el) {
      const children = el.nextElementSibling;
      if (children) {
        children.style.display = children.style.display === "none" ? "block" : "none";
      }
    }

    function openFile(path) {
      document.querySelectorAll(".file").forEach(f => f.classList.remove("active"));
      const fileEl = document.querySelector(`.file[data-path="${path}"]`);
      if (fileEl) fileEl.classList.add("active");

      const raw = FILE_CONTENTS[path] || "文件不存在";
      const title = path.split("/").pop().replace(/\.md$/i, "");
      document.getElementById("content").innerHTML =
        `<h1>${title}</h1><hr>` + marked.parse(raw);
      document.title = title + " - 每日记录";
      window.location.hash = encodeURIComponent(path);
    }

    function filterFiles(keyword) {
      keyword = keyword.toLowerCase();
      document.querySelectorAll(".file").forEach(f => {
        const path = f.getAttribute("data-path").toLowerCase();
        f.style.display = path.includes(keyword) ? "block" : "none";
      });
      document.querySelectorAll(".dir-children").forEach(d => {
        d.style.display = keyword ? "block" : "block";
      });
    }

    function toggleTheme() {

      localStorage.setItem("daily-record-theme", document.body.classList.contains("dark-theme") ? "dark" : "light");
