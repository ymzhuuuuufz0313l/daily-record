<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日记录 - Daily Record Site</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-strong: #f9fafb;
      --line: #d9e0e7;
      --text: #17212b;
      --muted: #607080;
      --accent: #176b5b;
      --accent-soft: #dcefe9;
      --shadow: 0 12px 28px rgba(26,36,46,0.08);
    }
    body.dark-theme {
      --bg: #101820;
      --surface: #17212b;
      --surface-strong: #202b36;
      --line: #344252;
      --text: #edf2f7;
      --muted: #a9b6c4;
      --accent: #45b39d;
      --accent-soft: #183b35;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }
    .app-shell {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100vh;
    }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-strong);
    }
    .sidebar-header h1 {
      margin: 0;
      font-size: 16px;
      color: var(--accent);
    }
    .sidebar-header .meta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    .search-box {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
    }
    .search-box input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .dir-children { padding-left: 18px; }
    .dir, .file {
      padding: 5px 16px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dir:hover, .file:hover { background: var(--accent-soft); }
    .dir { font-weight: 600; color: var(--accent); }
    .file { padding-left: 28px; color: var(--text); }
    .file.active { background: var(--accent-soft); font-weight: 600; }
    .main {
      overflow-y: auto;
      padding: 32px 48px;
      background: var(--bg);
    }
    .content {
      max-width: 900px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 12px;
      padding: 36px 44px;
      box-shadow: var(--shadow);
    }
    .content h1 { font-size: 26px; border-bottom: 2px solid var(--line); padding-bottom: 12px; }
    .content h2 { font-size: 20px; margin-top: 28px; }
    .content h3 { font-size: 17px; margin-top: 22px; }
    .content table {
      border-collapse: collapse;
      width: 100%;
      margin: 14px 0;
    }
    .content th, .content td {
      border: 1px solid var(--line);
      padding: 8px 12px;
      text-align: left;
    }
    .content th { background: var(--surface-strong); }
    .content code {
      background: var(--surface-strong);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: Consolas, monospace;
    }
    .content pre {
      background: var(--surface-strong);
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
    }
    .content pre code { padding: 0; background: transparent; }
    .content blockquote {
      border-left: 4px solid var(--accent);
      margin: 14px 0;
      padding: 8px 16px;
      background: var(--accent-soft);
      color: var(--text);
    }
    .toolbar {
      position: fixed;
      top: 14px;
      right: 18px;
      display: flex;
      gap: 8px;
    }
    .toolbar button {
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 12px;
    }
    .toolbar button:hover { background: var(--accent-soft); }
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 80px 20px;
    }
    @media (max-width: 768px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .main { padding: 16px; }
      .content { padding: 20px; }
    }
  </style>
</head>

  <script>
    const FILE_CONTENTS = {"HK1V11/checksum_update_时序图.md": "# CHECK_SUM UPDATE 时序图\n\n## CHPI 写入与 I2C 写任务竞争时序\n\n```\n信号              |  0     0.5T    1T     1.5T    2T     2.5T    3T\n------------------|--------------------------------------------------\nCHPI 帧           |  ~~~~~~~~~~~~~~|~~~~~~~~~~~~~~~|~~~~~~~~~~~~~~~~~~~\n                  |  cfg_frame0   |  无 cfg_frame1 |\n                  |               | (第二次写入)    |\n                  |               |               |\nI2C 写任务        |               |~~~~~~~~~~~~~~~|~~~~\n(内部执行)        |               |  写任务进行中   | 完成\n                  |               |  (耗时 1.25T) |\n                  |               |               |\nI2C_EN            |  ____________ | _____________ |  __________\n(使能信号)        |               |               | /\n                  |       0       |       0       |/  1 (打开)\n                  |               |               |\ncfg_frame 标志    |  ~~~~~~~~~~~~~|               |\n                  |  cfg_frame0=1 |               |\n                  |               |               |\n寄存器写入        |               X               |\n(目标地址)        |          写入生效              |\n```\n\n### 时序说明\n\n| 时间点 | 事件 |\n|--------|------|\n| **1T** | `cfg_frame0` 有效，CHPI 第一次写入目标寄存器；同步触发 I2C 写任务开始执行 |\n| **1T → 2.25T** | I2C 写任务执行中（耗时约 1.25T），期间 I2C_EN 保持为 0 |\n| **2T** | CHPI 第二次写入数据到达，但此时 **没有 cfg_frame1**，无法触发新的帧写入 |\n| **2.25T** | I2C 写任务完成，I2C_EN 拉高（打开），后续 I2C 通路可用 |\n\n### 关键问题\n\n- **2T 时刻**：CHPI 第二次写入时 `cfg_frame1` 缺失，导致该帧数据无法被正确捕获\n- **I2C_EN 滞后**：I2C_EN 在 2.25T 才打开，若第二次写入依赖 I2C 通路则会出现数据通路错误\n- **1T → 2.25T 窗口**：I2C 写任务与 CHPI 帧写入存在 1.25T 的竞争窗口\n", "HK1V11/每周记录.md": "# 每周记录\n\n## 2026-09\n\n### 本周概要 (09/14 - 09/20)\n> 0914 postPT 新 APR 交付（hmnie 0914）重跑并闭环 P0-2：SPEF 注解率 0.2%（网表/spef 跨源跨版）定位修复，网表/spef 同源化（PR_PATH 单开关）；6/04 旧数据作废，0914 批次成新基线。0915-0916 postPT 约束专项：wc_cbest setup -0.588 根因定位为 `R_REG*_L_*→RX_CLK` 缺 multicycle（准静态配置写被按半周期窗口检查），逐条 mc 草案 round1 70 条（采纳 42 条已生效）+ round2 30 条待评审；\"POSTPT 生成时钟节点失配\"排除。0916 傍晚：**网表 A/B 审判选 A**（0916V4 gating15/19373 cells，同约束纯净对比，签核 corner 双优+gating 违例率 31.9% vs 55.6%）；**DPLC_GROUP 大族 108 条定稿 G10**（set_max_delay 2× 强限定两配置寄存器，R_REG48 先例；PT 例外优先级 max_delay>multicycle 实锤 mc 无效）；约束接受三级标注落地（G1~G8 ACCEPTED 0916 13:00 / G2 先启用待 jjlu / round5·6·G10 NOT-YET-CONFIRMED 17:08）；round6（G9/G11）与 G10 合并为单一 pending bundle；服务器新一轮 POSTPT 已启动。0916 夜间：**skew \"-900\" 定案**——真实报表本地精确复现（旧 perl 复现 -993.55687），根因=时钟探针层级错 + perl 0/1000 哨兵，并揪出 3 份 `invalid start point` 回退出的\"假得合理\"数字（其中 +2.84 落在规格窗内最危险）；探针改 CLKGEN 时钟源脚 + perl 去哨兵 + 删除伪造 dplc 行（3a2de19）；第二轮发现真根因 **SD 输出端口零输出约束**（2M23 有 set_max_delay 14，1V11 整块注释未适配，slack 7.732434=14−6.267566 实锤），去 slack 过滤后 **run 20260916_10 验证通过**（1p 全 corner margin 落在 [-2.5:+2.5]，最大 1.82ns；setup 总账 173→64、RX_CLK 114→50）；SD 输出约束草案 `pending_constraints_SD_output_20260916.tcl` 待评审。0917：**skew 探针完备性复盘**——逐端口 RTL 驱动链审计（6 对 1 错 1 缺：clk_b 第二探针非 CLKB 驱动源待移除；DPLC_CLK 无生成时钟不可测），选点标准 4 条 + 无遗漏检验三法 + 2M23 对照成文（`skew_probe_audit_20260917.md`），DPLC 空数据四层定因；RX_CLK 56 条违例报告（+PDF）交付评审。0917 深夜：**SD 输出约束终版定稿**——俊杰口径落地（中间路径 setup/hold 卡、输出口 MPW 卡），无 case_analysis/无开关/无 false_path，`set_max_delay 14`×4 口 + MPW 2×6 正常腿 + MPW 0.73×8 数据腿，一次 run 覆盖全部 4 个产品 case（a3049b7）；交接文档 `CONTEXT_HANDOFF_20260917.md`（e658919）。0918：回传服务器清单 server_sync_0918v1 + ip_cons 时钟定义块补注释/STATUS 溯源标注（约束数值零改动，fbe6665/a18cd24）+ 2M23 遗留注释块存在性审计（对象在 1V11 不存在，防误用）+ 日报站/实践站双线核查补齐。\n\n| 模块 | 本周进展 | 状态 |\n|------|---------|------|\n| 后端流程 | postPT 0914 新基线重跑；P0-2 网表/spef 异源修复验证通过；遗留 P0 三项剩两项（skew 重写→已闭环、时序收敛） | 🔄 |\n| postPT 约束 | -0.588 根因=mc 缺口；round1~5 全部生效（配置跨域+K1 清零）；G2/G9/G11/G10 待 jjlu 评审；三级接受标注落地；SD 输出约束草案新增待评审 | 🔄 |\n| postPT/网表 | **网表 A/B 审判选 A**（0916V4 gating15）：签核 corner 双优、B 的 CONFIG_DATA hold 硬伤排除；翻转条件已记录 | ✅ |\n| 后端流程/skew | **skew \"-900\" 三轮闭环**：定案→真根因（端口无约束）→run 20260916_10 验证通过（1p margin 全入窗）；0917 完备性复盘成文（6 对 1 错 1 缺 + 标准成文）；DPLC 通路四层定因待补 | ✅ 1p / 🔄 DPLC |\n\n### 详细记录\n- 09/18：**回传准备 + 记录体系补齐**。① server_sync_0918v1.md：确认 git 已同步（main=origin/main），回传只需带 oEQ off 时 UTC 检测失效~~ → 已修改逻辑并新增 4 个 case 验证。\n\n### 明日计划\n- [I2C] 继续推进 I2C 相关环境与 case 问题收敛。\n", "HK1V11/每日记录_0507.md": "# 每日记录 - 05/07 (周四)\n\n### 今日完成\n#### [BWD]\n- [Case开发] 新增 `t_8b1lane_unlock_bwdl` case，用于验证 BWDL 功能；从其他 case 移植时发现部分信号缺失，需补充排查。\n- [Case开发] 新增 `t_8b1lane_unlock_bwda` case，用于验证 BWDA 功能。\n- [Case开发] 新增 `t_8b1lane_unlock_bwdb` case，用于验证 BWDB 功能。\n\n  | Case | 验证目标 | 状态 |\n  |------|----------|------|\n  | `t_8b1lane_unlock_bwdl` | BWDL 功能 | 移植后部分信号缺失，需排查 |\n  | `t_8b1lane_unlock_bwda` | BWDA 功能 | 已新增 |\n  | `t_8b1lane_unlock_bwdb` | BWDB 功能 | 已新增 |\n\n#### [I2C]\n- [方案讨论] 与模拟同事讨论 password error reset 的数字设计思路。\n- [设计修复] 修复 I2C only 区域（粉色）寄存器在 password error reset 时未复位的问题，代码已上传并编译通过。\n- [Case补充] 新增 3 个 case 覆盖 I2C only 区域寄存器的 reset 行为。\n\n  | 场景 | 验证目的 |\n  |------|----------|\n  | 最后发送密码 | 验证 password 最后生效时寄存器行为 |\n  | 先发送密码再发送错误寄存器值 | 验证错误写入后的 reset 行为 |\n  | 先发送错误寄存器值最后发密码 | 验证 password 恢复后的寄存器记忆/输出行为 |\n\n### 下一步待做\n#### [BWD]\n- [Case排查] 排查 `t_8b1lane_unlock_bwdl` case 移植后部分信号缺失的问题。\n\n### 发现问题\n- ~~[I2C] 寄存器 30 写入 `0x5A` 后，password 从正确值 `0x72` 切换为任意值时输出应回 default~~ → 已解决。\n- ~~[I2C] password 从任意值恢复为 `0x72` 时，寄存器 30 应重新输出 `0x5A`~~ → 已解决。\n- ~~[I2C] 模拟同事希望清除寄存器值，与数字侧设计冲突~~ → 已按数字设计思路确认，现有设计正确。\n- ~~[I2C] I2C only 区域寄存器 password error reset 时未复位~~ → 已修复并新增 3 个 case 验证。\n- [BWD] `t_8b1lane_unlock_bwdl` case 移植时部分信号缺失导致报错。\n\n### 明日计划\n- [BWD] 继续排查 `t_8b1lane_unlock_bwdl` case 信号缺失问题。\n", "HK1V11/每日记录_0508.md": "# 每日记录 - 05/08 (周五)\n\n### 今日完成\n#### [I2C]\n- [寄存器更新] 按模拟同事 05/07 发送的寄存器大表，更新 CHPI 和 I2C 访问的寄存器逻辑代码。\n\n  | 信号 | 原地址/位域 | 新地址/位域 |\n  |------|-------------|-------------|\n  | `AVE_R` | `0x00[2:0]` | `0x00[7:5]` |\n  | `reg_lane_ck_inv_en` | `0x25[7]` | `0x50[1]` |\n\n#### [帧协议寄存器校验和]\n- [方案设计] 完成视频消隐期寄存器更新的校验和省面积方案讨论，并输出设计文档。\n- [需求梳理] 明确 checksum 更新需求：35 个 8-bit 寄存器参与 XOR 折叠校验，连续 3 帧校验和一致后才更新。\n- [方案优化] 简化实现方式，去掉 FSM，改为 `xor_en = |addr_match` 的流式累加方案，并使用 SOF/EOF 边界信号控制窗口。\n- [模式设计] 新增 `REG_07` 模式开关：`REG_07 == 0x50` 时开启 checksum，否则直写；`REG_07` 自身不参与 XOR。\n- [时序补充] 完善普通模式与 checksum 模式切换时序，并整理验证清单。\n\n  | 方案 | 设计方式 | 面积影响 | 备注 |\n  |------|----------|----------|------|\n  | 方案 A（无影子） | always 块增加 `&& update_en` 门控 | 额外约 19 FF | 建议保留 |\n  | 方案 B（有影子） | 增加完整 shadow 寄存器 | 额外约 304 FF | 面积代价较高 |\n\n### 下一步待做\n#### [帧协议寄存器校验和]\n- [方案确认] 确认最终采用的 checksum 省面积方案，当前建议方案 A。\n- [RTL实现] 根据选定方案完成 RTL 编码。\n\n### 发现问题\n- 暂无新增问题。\n\n### 明日计划\n- [帧协议寄存器校验和] 继续推进方案确认和 RTL 实现。\n", "HK1V11/每日记录_0511.md": "# 每日记录 - 05/11 (周一)\n\n### 今日完成\n#### [综合]\n- [流程跑通] 完成 DC 综合流程：`ckf`、`nlint` 通过后运行 `run_dc`，综合结果正常。\n- [约束修复] 解决 `dont_touch.tcl` 缺失问题，补充约束后重新综合，网表正常输出。\n- [等价验证] 完成 LEC 逻辑等价性检查，`rtl` vs `gate` 对比通过。\n- [时序验证] 完成 `pre_pt` 静态时序分析，timing slack > 0，时序满足要求。\n- [面积分析] 完成面积报告，对比 1V21 / 1V22 项目数据并给出本设计面积分析。\n\n  | 流程 | 结果 |\n  |------|------|\n  | DC | 通过 |\n  | LEC | 通过 |\n  | pre_pt | timing slack > 0 |\n  | 面积报告 | 已完成 |\n\n#### [文档]\n- [文档整理] 整理 Project Integration Flow 综合流程文档。\n\n### 下一步待做\n#### [综合]\n- [流程收尾] 推进网表 signoff release。\n\n### 发现问题\n- [环境] 服务器内除 Qwen 外其余模型均不可用，严重影响工作效率，当前处于 delay 状态。\n\n### 明日计划\n- [综合] 推进网表 signoff release。\n", "HK1V11/每日记录_0512.md": "# 每日记录 - 05/12 (周二)\n\n### 今日完成\n#### [DV_TCON_C]\n- [调试] 协助搭建 `t_all_reg_analog` 的正确 case，解决 `porsd` 不正常拉 1 的问题，问题涉及 SCREN 寄存器相关逻辑。\n- [逻辑确认] 确认 `I2C_EN == 1` 时也不再 reset SCREN 寄存器，该行为已由文裕最终确认。\n\n#### [寄存器修改]\n- [规格同步] 根据寄存器调整要求完成删除项与修改项梳理。\n\n  | 类型 | 信号 | 地址/变更项 | 旧值 | 新值/说明 |\n  |------|------|-------------|------|-----------|\n  | Delete | `SMART_CS[3:0]` | `@0x02[7:6] [3:2]` | - | 删除 |\n  | Delete | `VPS_EN[1:0]` | `@0x03[7] @0x28[6]` | - | 删除 |\n  | Delete | `PDF_EN` | `@0x06[4]` | - | 删除 |\n  | Delete | `PDF_CTRL` | `@0x06[6]` | - | 删除 |\n  | Delete | `R_BWDB_V_OFF` | `@0x23[0]` | - | 删除 |\n  | Delete | `R_LSP_DET_EN` | `@0x50[0]` | - | 删除 |\n  | Modify | `reg_pin_eq_auto[3:2]` | 地址 | `0x02[5:4]` | `0x02[3:2]` |\n  | Modify | `regr_lane_ctrl[4:0]` | default value | `5'b00000` | `5'b11000` |\n  | Modify | `regr_lane_ctrl[4:0]` | description | - | 显示 gray code 前的数据 |\n\n### 下一步待做\n#### [DV_TCON_C]\n- [功能更新] 等待俊杰和 James 讨论后上传 CHECK_SUM UPDATE 功能，再继续推进相关代码更新。\n- [功能更新] 后续一并更新 SCR_EN 在 I2C model 下即使 K3 检测到也不会 reset 的功能。\n\n### 发现问题\n#### [CHECK_SUM UPDATE]\n- [机制问题] 当前 checksum 更新机制与部分信号的即时生效需求存在冲突。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 当前机制 | 写入一个寄存器需要 3 次 CHPI 帧 blank 期间都一致才会更新 |\n  | PORSD/POL 时序冲突 | PORSD/POL 等信号需要在第一帧结束就置位 1 或 0，但 CHECK_SUM 要求 3 帧一致才生效，导致时序不满足 |\n  | ch_sel 响应滞后 | 环境按 `ch_sel` 发送数据时，首次发送 `ch_sel=000`，但寄存器仍为 default value `011`，导致后级模块按 `011` 处理 `000` 的数据 |\n\n### 明日计划\n- [DV_TCON_C] 继续推进 CHECK_SUM UPDATE 和 SCR_EN 功能更新。\n", "HK1V11/每日记录_0513.md": "# 每日记录 - 05/13 (周三)\n\n### 今日完成\n#### [DV_TCON_C]\n- [功能上传] 将 CHECK_SUM UPDATE 功能 bypass 后上传。\n- [功能上传] 上传 SCR_EN 在 I2C model 下即使 K3 检测到也不会 reset 的功能。\n\n#### [I2C]\n- [Case更新] 更新所有 I2C case，使 error case 与 normal case 的寄存器内容匹配 05/12 寄存器大表。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 更新对象 | 所有 I2C case |\n  | 覆盖类型 | error case、normal case |\n  | 参考基准 | 05/12 寄存器大表 |\n\n### 下一步待做\n#### [DV_TCON_C]\n- [机制跟进] 继续跟进 CHECK_SUM UPDATE 机制问题的解决方案。\n\n### 发现问题\n#### [DV_TCON_C]\n- [遗留记录] I2C SCL 信号在仿真中加速后，内部模块解析出错；信号路径经过模拟单元和数字单元，暂未定位问题归属。该问题当前仅记录，不要求立即解决。\n\n#### [CHECK_SUM UPDATE]\n- [机制问题] CHECK_SUM UPDATE 机制问题与 05/12 记录一致，3 帧一致机制与即时生效需求仍存在冲突。\n\n### 明日计划\n- [DV_TCON_C] 继续推进 DV_TCON_C 功能更新。\n- [I2C] 继续推进 I2C case 验证。\n", "HK1V11/每日记录_0514.md": "# 每日记录 - 05/14 (周四)\n\n### 今日完成\n#### [综合]\n- [面积优化] 注释部分功能后重新综合，面积减少约 6K。\n- [时序修复] 修正综合 timing，寄存器模块已达到 timing clean。\n- [逻辑修复] 修复 `lc_cpuwr` 模块时序与逻辑错误，checksum 导致的问题全部解决。\n- [报告输出] 完成新代码更新并输出面积报告。\n\n  | 项目 | 结果 |\n  |------|------|\n  | 面积优化 | 减少约 6K |\n  | 寄存器模块 timing | clean |\n  | `lc_cpuwr` 问题 | 已修复 |\n  | 面积报告 | 已输出 |\n\n### 下一步待做\n#### [综合]\n- [时序收敛] 继续修正其余模块的时序问题。\n\n### 发现问题\n- ~~[综合] 综合后出现 timing violation，定位到 `lc_cpuwr` 模块时序和逻辑错误~~ → 已修复。\n\n### 明日计划\n- [综合] 继续修正其余模块时序。\n", "HK1V11/每日记录_0515.md": "# 每日记录 - 05/15 (周五)\n\n### 今日完成\n#### [CHECK_SUM UPDATE]\n- [面积优化] 删除 `0x20-0x38` 地址段，面积进一步下降，并低于 ORG PLAN 目标。\n- [方案评审] CHECK_SUM UPDATE 方案获得 James 认可。\n- [环境同步] 与验证同事完成沟通，并完成验证环境修改。\n\n  | 项目 | 结果 |\n  |------|------|\n  | 地址段调整 | 删除 `0x20-0x38` |\n  | 面积结果 | 低于 ORG PLAN 目标 |\n  | 方案状态 | James 认可 |\n  | 验证环境 | 已修改完成 |\n\n### 下一步待做\n#### [CHECK_SUM UPDATE]\n- [验证补充] 下周搭建更多 case，进行全面功能验证。\n\n### 发现问题\n- 暂无新增问题。\n\n### 下周计划\n- [CHECK_SUM UPDATE] 搭建更多验证 case。\n- [综合] 继续修正其余模块时序。\n- [综合] 推进网表 signoff。\n", "HK1V11/每日记录_0518.md": "# 每日记录 - 05/18 (周一)\n\n### 今日完成\n#### [CHECK_SUM UPDATE]\n- [Case开发] 针对寄存器 `0x1F` 特殊处理逻辑，创建 8 个 longtest case 进行验证。\n- [问题修复] 检查出代码中存在异常，定位原因为模拟侧修改了 macro 代码，数字侧需要同步修改；当前已完成同步修复。\n- [面积优化] 修改 `LC_CPUWR` 代码，注释掉未使用的 `shadow1F` 寄存器，以优化面积和时序。\n- [跨端同步] 确认模拟侧 macro 修改后，数字侧相关内容已全部对齐；该同步由俊杰完成。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 新增 case | `0x1F` 相关 8 个 longtest case |\n  | 问题来源 | 模拟侧 macro 修改后数字侧未同步 |\n  | 修复状态 | 已同步修复 |\n  | 优化项 | 注释未使用的 `shadow1F` 寄存器 |\n\n### 下一步待做\n#### [CHECK_SUM UPDATE]\n- [功能验证] 继续推进 CHECK_SUM UPDATE 功能验证。\n\n### 发现问题\n- ~~[CHECK_SUM UPDATE] 模拟侧修改 macro 代码后数字侧未同步，导致功能异常~~ → 已修复。\n\n### 明日计划\n- [CHECK_SUM UPDATE] 继续推进功能验证。\n", "HK1V11/每日记录_0519.md": "# 每日记录 - 05/19 (周二)\n\n### 今日完成\n#### [寄存器]\n- [默认值修改] 修改 `reg_kvco_ctrl[3:0]` 默认值，地址为 `@0x26[7:4]`，默认值由 `8` 调整为 `A`。\n- [功能位更新] 更新 `REG07[3:0]` 为 `CTRLF_CHECKSUM[3:0]`，默认值设置为 `5`，用于使能校验和。\n\n  | 信号 | 地址/位域 | 变更 |\n  |------|-----------|------|\n  | `reg_kvco_ctrl[3:0]` | `@0x26[7:4]` | 默认值 `8 → A` |\n  | `REG07[3:0]` | - | 更新为 `CTRLF_CHECKSUM[3:0]`，默认值 `5` |\n\n### 下一步待做\n#### [CHECK_SUM UPDATE]\n- [问题排查] 继续排查 CHECK_SUM 导致 2T 时刻寄存器乱写的问题。\n\n### 发现问题\n#### [CHECK_SUM UPDATE]\n- [机制问题] 发现 CHECK_SUM 导致 2T 时刻寄存器乱写。\n\n  | 阶段 | 行为 | 结果 |\n  |------|------|------|\n  | 1T | 发送 `SCREN=1` | 接收端因 checksum 暂存，未立即生效 |\n  | 2T | 发送端认为解扰已开启并发送加扰数据 | 接收端解扰仍被 checksum 阻塞 |\n  | 错误结果 | 加扰数据直接写入寄存器 | 寄存器值全部错误 |\n\n### 明日计划\n- [CHECK_SUM UPDATE] 继续推进功能验证与机制问题排查。\n", "HK1V11/每日记录_0520.md": "# 每日记录 - 05/20 (周三)\n\n### 今日完成\n#### [CHECK_SUM UPDATE]\n- [方案设计] 完成 checksum 功能更新方案，并与 James 对齐确认 K1 latch 后的数据更新策略。\n\n  | 项目 | 方案 |\n  |------|------|\n  | 默认行为 | `REG_07` 默认值改为 0，使能 checksum 检测 |\n  | 关闭方式 | `data=0x05` 时关闭 checksum 检测，进入直写模式 |\n  | LSP 至 K1 前 | LSP 阶段结束至 K1 发起前不做 checksum，寄存器直写 |\n  | K1 FIND 后 | K1 FIND 后生成 latch；`latch=1` 且 checksum 使能时，所有数据输入均需经过 checksum 验证，通过后才更新寄存器 |\n\n#### [寄存器]\n- [排查] 排查模拟同事反馈的 VBK PDF 功能是否未删除问题，确认相关功能已全部删除。\n\n#### [DV_TCON_C]\n- [验证] 在 PWRC 验证中发现 PWRC 看似在 BKDU 阶段仍会变化，并完成现象分析。\n\n  | 项目 | 结论 |\n  |------|------|\n  | 现象 | PWRC 看似在 BKDU 阶段仍会变化 |\n  | 原因 | 仅删除了寄存器，原逻辑为 `assign a = b & c`，`b` 寄存器删除后等效为 `assign a = c` |\n  | 结论 | PWRC 与 BKDU 呈现相关性，该现象符合当前逻辑 |\n\n#### [UTC]\n- [修复] 修复 env 中直接对 1bit 信号赋 0 导致 K CODE FIND 位置偏移的问题。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 问题原因 | env 直接对 1bit 信号赋 0，导致 K CODE FIND 位置偏移，最佳采样点改变 |\n  | 修复方式 | 改为直接对错误赋值 10bit |\n  | 修复结果 | 最佳采样点位置保持不变，问题解决 |\n\n### 发现问题\n- ~~[寄存器] VBK PDF 功能可能未删除~~ → 排查完成，确认已全部删除。\n- ~~[UTC] UTC 模块 1ps 毛刺干扰~~ → env 由 1bit 赋 0 改为 10bit 赋值，已解决。\n\n### 明日计划\n- [CHECK_SUM UPDATE] 按新方案实现 CHECK_SUM UPDATE 代码修改。\n", "HK1V11/每日记录_0521.md": "# 每日记录 - 05/21 (周四)\n\n### 今日完成\n#### [CHECK_SUM UPDATE]\n- [修复] 解决 2T 时刻乱写寄存器问题，利用 K1 latch 机制保证加扰发送与接收端解扰状态同步，RTL 已更新。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 问题现象 | 2T 时刻出现寄存器乱写 |\n  | 根因 | 1T 发送 `SCREN=1` 被 checksum 暂存，未立即生效；2T 发送端认为解扰已开启并发送加扰数据，但接收端解扰仍被 checksum 阻塞 |\n  | 错误结果 | 加扰数据直接写入寄存器，导致寄存器值全部错误 |\n  | 修复方式 | 加扰数据在首次 K1 之前发送，此阶段 `latch=0`，无 checksum，寄存器直写 |\n  | 修复结果 | 接收端/发送端解扰同步，加扰功能恢复正常，RTL 已更新 |\n\n#### [寄存器]\n- [修改] 将 P2WRC 映射由 `3'b001` 改为 `3'b000`，补齐去年已决定但今日才完成的修改。\n- [修复] 修复 DBC 寄存器因 PDF 寄存器删除而被级联误删的问题。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 原始逻辑 | `assign a = b & c` |\n  | 问题原因 | DBC 功能与 PDF 寄存器关联，PDF 寄存器删除后 DBC 被级联误删 |\n  | 错误表现 | DBC 被错误赋值为 0 |\n  | 修复结果 | DBC 修正为 `1'b1` 独立赋值，KEEPLOW 已实现 |\n\n#### [I2C]\n- [验证] 更新所有 I2C case 环境并执行回归。\n\n### 发现问题\n#### [CHPI_SD_CTRL]\n- [时序偏差] `CHPI_SD_CTRL.v` L487-L496 时序与 SPEC 不符，该问题来自同事代码，需后续同步排查。\n\n  | 条件 | 仿真表现 | SPEC 要求 | 建议/状态 |\n  |------|----------|-----------|-----------|\n  | `W_SEL=0/1` | 仿真差 4 个时钟周期，约 53.8ns | 差值 70ns | 建议增加 1 个时钟周期 |\n  | `W_SEL=2` | 与 `SEL=1` 差 24 个时钟周期，由 case 逻辑决定 | 155-140 约 1 个时钟周期 | 偏差较大，需排查 |\n  | `W_SEL=3` | 待确认 | 待确认 | 需同步排查 |\n\n- ~~[CHECK_SUM UPDATE] CHECK_SUM 导致 2T 时刻寄存器乱写~~ → 利用 K1 latch 机制解决，加扰发送在 `latch=0` 阶段完成，TX/RX 同步。\n- ~~[寄存器] DBC 寄存器因 PDF 删除被级联误删~~ → 已修正，DBC = `1'b1`，KEEPLOW 已实现。\n\n### 明日计划\n- [CHECK_SUM UPDATE] 继续 CHECK_SUM UPDATE 功能验证。\n", "HK1V11/每日记录_0522.md": "# 每日记录 - 05/22 (周五)\n\n### 今日完成\n#### [DV_TCON_C]\n- [排查] 发现 `LD_R=0` 时 STB_A 开始阶段出现在 K2 之前，LD 与 K2 之间存在宽度要求，当前时序未按要求执行。\n- [验证方法] 抓取 `K2_FIND` 与 `TP_ACT0_SET_OK` 两个信号之间的宽度及相对时序位置，并与 SPEC 中 DBC Timing Setting 时序图对比。\n\n#### [I2C]\n- [修复] 排查 I2C_WR_BURST case 输出数据为 X 态的问题，当前仍在修复中。\n\n### 发现问题\n#### [DV_TCON_C]\n- [时序问题] `LD_R=0` 时 STB_A 在 K2 之前开始，LD 与 K2 之间应有宽度间隔，当前实现未满足。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 问题现象 | `LD_R=0` 时，STB_A 开始阶段出现在 K2 之前 |\n  | SPEC 要求 | LD 与 K2 之间应存在宽度间隔 |\n  | 当前验证方式 | 对比 `K2_FIND` / `TP_ACT0_SET_OK` 宽度与 SPEC DBC Timing Setting 时序图 |\n  | 状态 | 继续排查 |\n\n- [行为确认] `EQ_I=3'b000 / AEQ_I=1'b0` 行为暂不判定为错误，需要确认 SPEC 最近是否有修改。\n\n  | 观察项 | 说明 |\n  |--------|------|\n  | 现象 1 | 格雷码编码后数据未输出 |\n  | 现象 2 | `reg_lane_ctrl` 选择 00 通道寄存器数据 |\n  | 当前判断 | 不确定当前行为是否符合最新 SPEC，需进一步确认 |\n\n  | 信号/逻辑 | 追踪结果 |\n  |-----------|----------|\n  | 格雷码编码后数据 | 送往 analog，信号名为 `eq_ctrl[4:0]` |\n  | `regr_lane_ctrl` | `ER_EN ? PRE数据 : 寄存器输入数据`，该值不是格雷码编码 |\n  | PRE 数据 | default = `5'b11000`，追入为 `reg_lane_ctrl_pre_p` |\n  | 寄存器输入数据 | 根据 EQI 选择 `reg_lane_ctrl00/01/10/11` |\n  | EQ 状态机 | 按 SPEC 要求，内部大部分逻辑由 `eq_out` 赋值 |\n  | `eq_out` 后续 | `eq_out → eq_out_pre`，与 goldentime 状态、计数器、`EQ_MODE` 相关 |\n\n### 明日计划\n- [DV_TCON_C] 继续排查 LD_R 与 K2 时序问题。\n", "HK1V11/每日记录_0525.md": "# 每日记录 - 05/25 (周一)\n\n### 今日完成\n#### [模拟]\n- [问题修复] 解决模拟同事反馈的 STB fake 类信号问题，确认 fake 类信号与寄存器 `HIZ_MIN_SEL`、`HIZ_MIN_VAL` 相关。\n\n#### [I2C]\n- [问题修复] 解决 I2C_BURST case 输出 X 态问题，根因是 `I2C_READ` 函数未发送 SLAVE ID，导致 slave 设备无法识别 ID 后的 R/W 信号。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 问题现象 | I2C_BURST case 输出 X 态 |\n  | 根因 | I2C 协议发送流程缺少 SLAVE ID 段 |\n  | 修复方式 | 使用 `I2C_READ_SINGLE` 和 `I2C_READ_BURST` 函数替代原 `I2C_READ` |\n  | 结果 | 问题已修复 |\n\n### 下一步待做\n#### [DV_TCON_C]\n- [问题排查] 继续推进模拟同事反馈的 t_all_reg_analog_line 相关问题排查。\n\n### 发现问题\n#### [DV_TCON_C]\n- [模拟反馈] t_all_reg_analog_line case 中模拟同事反馈 2 个问题；其中 CS=0 问题已确认是旧 MACRO TOP 仿真导致，实际设计无误。\n\n  | 问题 | 当前状态 |\n  |------|----------|\n  | `DPOLINV=1` 时 POL 信号应与 `DPOLINV=0` 时反向，当前未反转 | 待排查 |\n  | `R_CH12&34_HIZ` 功能 fail，仅找到 `R_OHIZ_12&34` 相关寄存器 | 待排查 |\n\n- ~~[I2C] I2C_BURST case 输出 X 态~~ → `I2C_READ` 函数缺少 SLAVE ID 发送，已修复。\n\n### 明日计划\n- [DV_TCON_C] 继续推进遗留问题排查。\n", "HK1V11/每日记录_0526.md": "# 每日记录 - 05/26 (星期二)\n\n### 今日完成\n#### [DV_TCON_C]\n- [验证] 关闭 DPOLINV 问题，确认模拟同事反馈的 DPOLINV 项已 pass，根因是 case 未按 SPEC 构造，并非设计问题。\n- [分析] 深入排查 OHIZ 问题，确认 STB_A 与 STB_B 同时回 high 的设计存在问题。\n\n  | 项目 | 结论 |\n  |------|------|\n  | STB_B high 条件 | `STB_B_PRE` 或 `R_OHIZ_34` |\n  | AABB 设计影响 | `STB_B_PRE` 在 AABB 设计中等效等于 `STB_A` |\n  | 错误表现 | 仅 `OHIZ_12` enable 时，预期只有 Y1/2 与 Y5/6 HiZ，实际 Y3/4 与 Y7/8 也被 HiZ |\n  | 当前判断 | STB_A 与 STB_B 同时回 high 的设计需要继续修复 |\n\n### 发现问题\n- ~~[DV_TCON_C] DPOLINV=1 POL 未反向~~ → case 未按 SPEC 构造导致预期不符，非设计问题。\n- [DV_TCON_C] `OHIZ_12` 使能时 STB_A/B 同时回 high，导致 Y3/4 与 Y7/8 被错误 HiZ。\n\n### 明日计划\n- [DV_TCON_C] 继续跟进 `R_CH12&34_HIZ` fail 修复。\n", "HK1V11/每日记录_0527.md": "# 每日记录 - 05/27 (星期三)\n\n### 今日完成\n#### [DV_TCON_C]\n- [答疑] 梳理 TP_F_AHEAD 与 FAKE 信号行为，回复模拟同事关于提前触发、FAKE 选择及宽度控制的问题。\n\n  | 项目 | 结论 |\n  |------|------|\n  | TP_F_AHEAD 链路 | `TP_F_AHEAD → TP_ACT0_RST_OK / CS_NE → STB_A`，该路径不是唯一链路 |\n  | 提前触发影响 | `TP_F_AHEAD=1` 时提前触发 reset，并影响计数器，间接导致 `STB_A_FAKE` 提前 |\n  | FAKE/Normal 选择 | 由 `HIZ_SEL`、`POL`、`POLC`、`LD_F`、`LD_W` 共同决定，不由 `TP_F_AHEAD` 直接控制 |\n  | LD_F 影响 | `LD_F=1` 时，`POL` 选择 FAKE；`TP_F_AHEAD` 负责提前 `STB_A/STB_A_FAKE` 并传导至 `STB_B` |\n  | FAKE 宽度 | 可通过 `HIZ_MIN_SEL` 与 `HIZ_MIN_VAL` 寄存器设定；未设定时 FAKE 较短，由计数器决定 |\n  | OHIZ 关系 | FAKE 不受 OHIZ 功能影响 |\n\n- [答疑] 明确 AHEAD 值计算与选择逻辑，说明 2B/2D 差距来源、packet 转换关系及寄存器约束。\n\n  | 项目 | 结论 |\n  |------|------|\n  | 基础公式 | 2B 与 2D 差距由 2D 决定，2D 由 `LD_W` 决定，公式为 `2*LD_W + 1` |\n  | 公式含义 | `2*LD_W` 表示 packet 到 clk 的转换；`+1` 表示计数器逻辑判断（packet base） |\n  | 高频场景 | 高频下 2 个 packet 时间很短，AHEAD 值需要向上补 packet |\n  | 寄存器约束 | AHEAD 值需要大于寄存器 `HIZ_MIN_VAL` |\n  | 选择逻辑 | 若 `(2*LD_W + 1 - HIZ_MIN_VAL) < HIZ_MIN_VAL`，选择 `HIZ_MIN_VAL`；否则选择 `2*LD_W + 1 - HIZ_MIN_VAL` |\n\n#### [Checksum Env]\n- [环境修复] 修复 checksum env 中 shadow 寄存器提前一帧提取的问题，明确仿真环境对 CHPI 协议时序理解不足导致 frame 对齐异常。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 问题现象 | 仿真环境提取 shadow 寄存器时总是提前一帧，例如 F2 提取到 F3 的 shadow |\n  | 根因分析 | 仿真环境并不知道 CHPI 协议，错误理解了 `CFG_FRRAME0.TXT` 的发送时机 |\n  | 正确时序 | `CFG_FRRAME0.TXT` 实际会在 LSP 结束的 K4 后发送，而不是在第一个 frame 有效帧后发送 |\n  | 处理结果 | 修复 checksum env 的 shadow 提取时序，使其按 `CFG_FRRAME0.TXT` 的实际发送位置进行处理 |\n\n- [脚本开发] 新增 `run_parallel.py` 脚本，用于并行运行 case，提升 checksum 相关 case 的执行效率。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 脚本用途 | 支持多个 case 并行执行，减少串行运行等待时间 |\n  | 新增接口 | 增加 `time` 输入接口，用于控制并行运行的执行时长 |\n  | 防护效果 | 通过 `time` 参数保证循环能够按预期停止，避免脚本持续运行无法退出 |\n\n- [Case更新] 修改全部 checksum case，将上来前三帧发送的数据改为 default value 的取反值，用于更有效验证 checksum 功能是否真正生效。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 原有方式 | 前三帧直接发送 default value |\n  | 幻觉来源 | `00-08` 寄存器除 `07` 外都有 shadow reg 进行判断；但 `1F` 地址因当前设计 plan 不存在 shadow reg，会直接读取实际寄存器值 |\n  | 存在问题 | 若上来直接发送 default value，`1F` 这类无 shadow reg 地址即使 checksum 机制未正确生效，也可能读到看似正确的 default value，导致前三帧验证存在假通过风险 |\n  | 新验证方式 | 前三帧发送 default value 的取反值 |\n  | 验证目的 | 通过制造与 default value 明确不同的数据，避免 default value 掩盖问题，确认 checksum 功能确实参与并拦截/更新相关寄存器行为 |\n\n- [回归验证] 完成 checksum case 回归，全部 19 个 case 通过，`UVM_ERROR=0`。\n\n  | 项目 | 结果 |\n  |------|------|\n  | PASS | 19 |\n  | FAIL | 0 |\n  | TOTAL | 19 |\n  | UVM_ERROR | 0 |\n  | 短 case | 11 个，耗时 171s ~ 213s |\n  | longest case | 8 个，耗时 264s ~ 303s |\n\n\n### 明日计划\n- [DV_TCON_C] 与俊杰确认 FAKE 信号生成机制。\n", "HK1V11/每日记录_0528.md": "# 每日记录 - 05/28 (星期四)\n\n### 今日完成\n#### [Checksum Env]\n- [回归验证] 对 checksum case 进行回归验证，当前 checksum case 全部通过。\n\n  | 项目 | 结果 |\n  |------|------|\n  | 回归对象 | checksum case |\n  | 回归结果 | 全部通过 |\n  | 当前状态 | checksum 相关回归结果正常 |\n\n#### [I2C]\n- [回归验证] 对朱彦铭创建/维护的 I2C case 进行回归验证（不代表全部 I2C case），初始结果中大部分 case 报告 `UVM_ERROR`，后续定位到其中一类并非真实 error，而是检查逻辑需要区分场景。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 回归对象 | 朱彦铭创建/维护的 I2C case，不代表全部 I2C case |\n  | 初始现象 | 大部分 case 报告 `UVM_ERROR` |\n  | 排查结论 | 部分 error 来自只读寄存器和密码保护寄存器的检查策略，不应直接等同于设计错误 |\n  | 处理方向 | 将符合预期的受限场景从 error 降级为 warning |\n  | 当前状态 | 主要分类回归已完成，结果符合修改预期 |\n\n- [环境修正] 定位到 I2C case 报错的一类原因：环境对只读寄存器也进行检查，但这些只读寄存器可能与模块实际工作状态相关，因此本质不应判定为 error。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 问题类型 | 只读寄存器检查导致 `UVM_ERROR` |\n  | 原因分析 | 只读寄存器值可能受模块工作状态影响，不一定与静态预期值一致 |\n  | 修正方式 | 将该类检查结果由 `UVM_ERROR` 调整为 `UVM_WARNING` |\n  | 当前判断 | 该类问题本质不是 error，后续按 warning 追踪即可 |\n\n- [检查逻辑更新] 将 LSI 密码保护寄存器导致读出 `00` 的情况也调整为 `UVM_WARNING`，并更新 `I2C_REG_CHECK.SVH` 中的寄存器检查函数。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 新增 warning 场景 | LSI 密码保护寄存器导致读出 `00` |\n  | 调整原因 | 该现象由密码保护机制触发，不应直接判定为真实 error |\n  | 函数更新 | 更新 `I2C_REG_CHECK.SVH` 中的寄存器检查函数 |\n  | 判定分类 | 函数现在区分四种结果：只读寄存器 warning、LSI 密码保护 warning、error、correct |\n\n- [回归收敛] 更新朱彦铭创建/维护范围内的 I2C case 分类回归状态，`lconfig`、`fconfig`、`i2cdedicated`、`testreg` 四类已全部跑完，结果均符合本次检查逻辑修改预期。\n\n  | 分类 | 状态 | 结果/备注 |\n  |------|------|-----------|\n  | `lconfig` | 已完成 | 符合修改预期 |\n  | `fconfig` | 已完成 | 符合修改预期 |\n  | `i2cdedicated` | 已完成 | 符合修改预期 |\n  | `testreg` | 已完成 | 符合修改预期 |\n\n### 下一步待做\n#### [I2C]\n- [结果确认] 朱彦铭创建/维护的 I2C 主要分类回归均已完成，后续继续关注该范围内是否还有未覆盖的真实 `UVM_ERROR` 场景。\n- ~~[Warning复核] 复核当前修改后的 `UVM_WARNING` 是否均符合预期，避免将真实错误误降级。~~ → 05/29 已完成 owner 是自己的 I2C case 复核，全部通过，确认 warning 降级符合预期。\n\n### 发现问题\n- [I2C] 已定位两类可降级为 warning 的场景：只读寄存器检查、LSI 密码保护寄存器读出 `00`。05/29 已完成 owner 是自己的 I2C case 复核，全部通过，确认 warning 降级符合预期。\n\n### 明日计划\n- [I2C] 基于 `I2C_REG_CHECK.SVH` 的四类判定结果继续观察后续回归；owner 是自己的 I2C case 已于 05/29 完成复核并全部通过。\n", "HK1V11/每日记录_0529.md": "# 每日记录 - 05/29 (星期五)\n\n### 今日完成\n#### [回归脚本]\n- [脚本优化] 修改并行跑 case 脚本，补强 `delete` 输入场景下的停止与确认逻辑，避免用户输入 `delete` 后脚本无法按预期停止。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 修改对象 | 并行跑 case 脚本 |\n  | 原问题 | 输入 `delete` 后无法停止 |\n  | 修正方式 | 增加多层保护和确认逻辑 |\n  | 交互优化 | 支持用户选择要删除的对象，并通过多轮询问确认 |\n\n#### [I2C]\n- [Warning复核] 完成 owner 是自己范围内 I2C case 的 warning 复核，确认 `I2C_REG_CHECK.SVH` 中只读寄存器检查和 LSI 密码保护寄存器读出 `00` 降级为 `UVM_WARNING` 的处理符合预期；owner 是自己的 case 已全部通过。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 复核范围 | owner 是自己的 I2C case |\n  | 复核对象 | `I2C_REG_CHECK.SVH` warning 分类逻辑 |\n  | 关注点 | 只读寄存器检查、LSI 密码保护寄存器读出 `00` |\n  | 结论 | warning 降级符合预期，owner 是自己的 case 全部通过 |\n\n- [回归验证] 回归 I2C owner 不属于自己的 case，用于观察非本人维护范围内的 I2C case 当前表现。\n\n  | 项目 | 说明 |\n  |------|------|\n  | 回归对象 | I2C owner 不属于自己的 case |\n  | 回归目的 | 观察非本人维护范围 case 的当前状态 |\n  | 范围说明 | 与朱彦铭创建/维护的 I2C case 分开记录，不代表全部 I2C case 的完整结论 |\n\n### 下一步待做\n#### [I2C]\n- [结果确认] owner 是自己的 I2C case 已完成检查并全部通过；后续仅继续观察 owner 不属于自己的 I2C case 回归结果，如发现真实 error 再单独归类跟进。\n\n### 发现问题\n- 暂无新增明确问题。\n\n### 明日计划\n- [I2C] 继续根据回归结果判断是否需要补充问题归类或同步 owner。\n", "HK1V11/每日记录_0601.md": "# 每日记录 - 06/01 (星期一)\n\n### 今日完成\n#### [I2C]\n- [Case维护] 修改 owner 不属于自己的 I2C case，处理寄存器初值长期未同步导致的不匹配问题，并基于 owner 是自己的 case 经验进行迁移。\n- [仿真修复] 修复 `I2C_BURST`、`I2C_DEFAULT` 两个 case 仿真无法停止的问题。\n- [Env修复] 定位部分 case 跑不完的原因是 env 阶段被注释；如不需要相关 checker，则直接将相关 env 信号赋值为 0。\n- [环境优化] 更新 `i2c_env`，将 I2C 时钟频率从 3.7KHz 提升到 11.42KHz，约提升至 3 倍速率。\n- [逻辑修正] 修复部分 case 内循环逻辑错误，避免回归流程异常。\n- [Checker优化] 细化 checker 判定逻辑，将预期内错误调整为 `UVM_WARNING`，不再统一报 `UVM_ERROR`。\n- [回归确认] 补充夜间回归结果：除 3 个 XP 创建/维护的 case 出现 `UVM_FATAL` 外，其余 case 均通过；`ID MISMATCH` 及其内部出现的 16 个 `UVM_ERROR` 符合预期。\n\n### 下一步待做\n#### [I2C]\n- [回归验证] 继续跟进 3 个 XP 创建/维护 case 的 `UVM_FATAL`，确认 phase、延时和时钟加速相关处理是否稳定。\n\n### 发现问题\n- [I2C] owner 不属于自己的 I2C case 长时间未更新，需要继续通过回归收敛。\n- [I2C] 3 个 XP 创建/维护的 case 在夜间回归中出现 `UVM_FATAL`。\n\n### 明日计划\n- [I2C] 定位 3 个 XP 创建/维护 case 的 `UVM_FATAL`。\n", "HK1V11/每日记录_0602.md": "# 每日记录 - 06/02 (星期二)\n\n### 今日完成\n#### [I2C]\n- [问题定位] 定位 3 个 XP 创建/维护的 case 在 I2C 时钟加速后报错的问题，与 reset 阶段前缺少延迟、仿真启动时系统仍处于复位状态有关。\n- [实验验证] 通过调整 phase 阶段，并组合验证前置延时/无延时、时钟加速/不加速等场景，确认问题触发条件和解决方法。\n- [回归确认] 完成 3 个 XP 创建/维护 case 的回归验证，当前结果全部 `PASS`。\n- [复核关闭] XP 已完成复核确认，3 个 XP 创建/维护 case 回归通过，当前无遗留问题。\n- [原因判断] 当前判断底层原因可能与 UVM 竞争或 phase 时序有关，暂不继续深挖。\n\n#### [回归脚本]\n- [超时处理] 更新脚本，修复超时后直接 kill case 导致 VCS 无法打印报告、从而隐藏真实错误的问题。\n- [结果校验] 增加 case 实际 runtime 与脚本记录时间的一致性检查；如二者不一致，脚本会额外报出提示。\n\n### 下一步待做\n#### [I2C]\n- [结果确认] 3 个 XP 创建/维护 case 已完成正式确认和 XP 复核，当前无需继续跟进。\n\n### 发现问题\n- [I2C] 快时钟在 build phase 使用时可能存在竞争；reset phase 前需要增加延迟，否则仿真启动时系统可能仍处于复位状态。\n\n### 明日计划\n- [I2C] 继续观察后续 I2C 回归结果，如无新增异常则保持当前处理。\n", "HK1V11/每日记录_0603.md": "# 每日记录 - 06/03 (星期三)\n\n### 今日完成\n#### [UTC]\n- [case 修复] 修复 4 个 UTC case 的预期帧序判断。\n- [原因定位] 当前验证环境会跳过前三帧检查，因此会额外发送三帧 `frame0`；原 UTC case 仍按旧帧序判断，导致原本预期出现在 `frame2` 的错误也需要整体后移三帧。\n- [验证调整] 将相关 case 的错误判断位置同步后移，保证预期错误与当前环境帧序一致。\n- [回归确认] UTC case 回归已完成，结果正确。\n\n#### [回归脚本]\n- [脚本增强] 修改 `run_parallel.py`，新增多轮交互能力，强制在执行前展示接下来要跑的 case，避免误跑或漏确认。\n- [执行流程] 默认先 `clear simdd` 再 `runvcs`，规避 `bsub` 的 `clean` 参数可能未生效导致环境未清理的问题。\n- [范围控制] 补充 `--exclude` 参数，可直接剔除 I2C 等长时间 case，优先保证短 case 快速出报告。\n- [交付状态] 当前脚本已交付同事使用。\n\n### 发现问题\n- UTC case 预期帧序与验证环境“跳过前三帧检查”的行为不一致，已通过调整预期错误位置修复。\n\n### 明日计划\n- 根据后续回归结果继续处理新增问题。\n- 观察 `run_parallel.py` 在同事侧的使用反馈。\n", "HK1V11/每日记录_0605.md": "# 每日记录 - 06/05 (星期五)\n\n### 今日完成\n#### [AI 使用报告]\n- [报告撰写] 撰写 AI 使用方向报告，围绕每日记录工作流、只读网站布局、项目看板、遗留问题追踪和历史问题搜索追溯进行整理。\n- [内容补充] 根据截图补充只读网站布局、项目看板行动中心、问题雷达和 `checksum` 搜索追溯示例说明。\n- [表达调整] 将报告重点从“网站建设过程”调整为“日常怎么使用、工作流程是什么、使用后带来的追溯价值”。\n\n### 下一步待做\n#### [AI 使用报告]\n- [后续方向] 继续整理第二个 AI 使用方向，保持以实际使用流程和工作价值为主。\n\n### 发现问题\n- 暂无\n\n### 明日计划\n- [AI 使用报告] 继续补充第二个 AI 使用方向的材料。\n", "HK1V11/每日记录_0612.md": "# 每日记录 - 06/12 (星期五)\n\n### 今日完成\n\n#### LC_CPUWR\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 寄存器搬移 | 完成 5 个信号位段搬移：`reg_cal_result_display_sel`、`reg_ana_test_sel`、`reg_cdr_icp`、`reg_cdr_rlpf`、`R_BAC`，默认值随信号搬移 | ✅ 已完成 |\n| 新增信号 | 新增 8 项信号/寄存器输出：`ACS_EN`、`Level_Skip_frame`、`Skip_frame_count`、`VBK_EN`、`SP_S`、`VBK`、`R_REG09_F`、`R_REG0A_F`；0x09/0A/1D/1E 进帧配置但不参与 XOR 校验和 | ✅ 已完成 |\n| 时钟统一 | 取消 `WCK1_A_TEST`，全模块 85 处统一用 `WCK1_A`，消除跨时钟域同步问题 | ✅ 已完成 |\n| CHIPSEL 隔离 | 明确本层按 CHIPSEL=0 设计，不实现 CHIPSEL=1 的 bit 级语义；09/0A/1F 仅整字节输出 | ✅ 已确定 |\n| FREG_CHPI 映射 | 确定新增地址帧槽公式 `(addr>>1)+1` | ✅ 已确定 |\n| 源码修改 | 完成 `LC_CPUWR_20260612.v` 端口声明、assign 源地址、4 个新地址译码、R_REG23/25/27/28/1F 注释与默认值同步、4 个直写 always 块 | ✅ 已完成 |\n| 文档同步 | 更新 `lccpuwr_modify_plan_20260612.md` §1~§14、同步 `lccpuwr_simulate_plan_20260612.md`、新建 `lccpuwr_regmap_change_list_20260612.md` | ✅ 已完成 |\n\n新增地址帧槽映射：\n\n| 地址 | FREG_CHPI | 数据线 | 共槽 |\n|------|-----------|--------|------|\n| 0x09 | 5'h05 | DATA_D | 与 0x08 |\n| 0x0A | 5'h06 | DATA_C | — |\n| 0x1D | 5'h0F | DATA_D | — |\n| 0x1E | 5'h10 | DATA_C | 与 0x1F |\n\n#### CHECK_SUM\n\n- [死锁分析] 识别 scramble/descramble 状态错配导致的 checksum 死锁：TX 加扰→RX descramble_en 在 checksum 保护范围内无法写入→乱数下永远不匹配。\n- [方案提出] 提出 NG Unlock 双路径方案：正常路径 3 帧连续匹配写入 + 解锁路径 6 帧 checksum 全不同触发强制直写；unlock 生效时机及恢复路径待确认。\n\n### 下一步待做\n\n#### LC_CPUWR\n- [方案写入] 将 NG Unlock 方案写入新 plan 文档（基于 0612 基线复制）。\n- [实现细化] 确定 unmatch_cnt 计数逻辑与 unlock 生效时序细节。\n\n### 发现问题\n\n- [CHECK_SUM] scramble/descramble 错配导致 checksum 死锁，寄存器组永久卡死。已提出 NG Unlock 6 帧不一致解锁方案，实现细节待确认。\n\n### 明日计划\n\n- [CHECK_SUM] 继续讨论并确定 NG Unlock 方案细节，完成后写入新 plan。\n", "HK1V11/每日记录_0615.md": "# 每日记录 - 06/15 (星期一)\n\n### 今日完成\n\n#### LC_CPUWR\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 文档修正 | 统一修正 0x1F 描述：参与 XOR 校验和但无 shadow；细化 `R_REG1F_F` 更新条件 | ✅ |\n| 文档/代码 | 为 0x09/0A/1D/0x1E 补充 I2C readback 说明，并在 0612 / PlanA / PlanB 三份源码 Part 16 加入对应 case | ✅ |\n| 代码修正 | 修正 NG Unlock Plan B mismatch 计数阈值 off-by-one：上限 `< 3'd6` → `< 3'd5`，置位 `== 3'd5` → `== 3'd4` | ✅ |\n| 代码修正 | 将 `unmatch_cnt_a/t`、`unlock_latch_a/t` 声明从 Part 18 提前到 Part 6，解决 declaration-after-use | ✅ |\n| 验证 | 三份源码（0612、PlanA、PlanB）及对应 `_decimal.v` 均通过 iverilog 语法编译 | ✅ |\n| 决策确认 | 0x38 跳过不改；0x09/0A/1D/0x1E 进帧配置但不参与校验和；Plan B 确定为推荐方案，Plan A 保留为备选 | ✅ |\n| 文档 | 完成代码级变更清单 `lccpuwr_code_changelist_20260615.md`、simulate_plan、modify_plan | ✅ |\n| 归档 | 新建 `LC_CPUWR_history/` 目录，集中存放版本、changelist、计划文件与脚本；补充版本血缘说明与 `README.md` | ✅ |\n\n#### CHECK_SUM\n\n- [阈值修正] Plan B `unmatch_cnt` 上限改为 `< 3'd5`，`unlock_latch` 置位条件改为 `== 3'd4`，即 5 次连续 mismatch（6 帧全不同）后下一帧直写。\n- [方案确认] NG Unlock 最终方案确定为 **Plan B（registered `unlock_latch`）**；Plan A 保留为历史备选。\n\n### 下一步待做\n\n#### LC_CPUWR\n- [待修改] 上层 module 实例化需同步：删除 `WCK1_A_TEST`、新增 9 个输出端口、调整 `R_BAC` 接法。\n\n### 发现问题\n\n- 无新增问题。\n\n### 明日计划\n\n- 完成 LC_CPUWR 上层 module 实例化同步修改。\n", "HK1V11/每日记录_0616.md": "# 每日记录 - 06/16 (星期二)\n\n### 今日完成\n\n#### LC_CPUWR\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 代码升级 | 创建 `LC_CPUWR_20260616_v2_decimal.v`：0x09/0x0A/0x1D/0x1E 参与 Seg1 checksum 并受 shadow 保护；`VBK_EN` 不再由 LC_CPUWR 输出 | ✅ |\n| 代码升级 | 创建 `LC_CPUWR_20260616_v3_decimal.v`：彻底删除 `CHKSUM_T_EN` 宏及 Seg2（0x20~0x38）checksum 逻辑，代码从约 3280 行精简至约 2060 行 | ✅ |\n| 文档修正 | 更新 `chip_sel0/1_register_address_map.md` 访问属性；修正 0x51 `reg_eq_mode` 注释与复位值一致 | ✅ |\n| 报告 | 创建/更新 `lc_cpuwr_chip_sel0_compliance_report_20260616_v2/v3.md` | ✅ |\n\n#### LC_REG_MAPPING\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 重写 | 创建 `LC_REG_MAPPING_20260616_decimal.v`：端口十进制化，新增 `R_REG09/10/29/30/31_F`，删除旧 `CHPI_SEL` 切换与死代码 | ✅ |\n| 新增输出 | 新增 `SP_S`/`VBK`/`VBK_EN` 输出（受 `LSI_PRTECT` 掩码保护）；新增 chip_sel=1 专用 `SR_*`/`PWRC_*` 输出 | ✅ |\n| Bugfix | 恢复 `PWRC_DOWN = R_BKDU`：修复固定为 `1'b0` 导致 power-down 分支永不命中的问题 | ✅ |\n| 验证 | 新 `LC_REG_MAPPING_20260616_decimal.v` iverilog 语法检查通过 | ✅ |\n\n#### LINK_LOGIC 与目录归档\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 代码 | 创建 `LINK_LOGIC_20260616_decimal.v`：同步 LC_CPUWR / LC_REG_MAPPING 端口变更（删除 `WCK1_A_TEST`/`R_REG07_F`/`SSFC`/`R_BAC`，新增互联与空接） | ✅ |\n| 代码 | 将当前版本 Verilog 中文注释全部替换为英文，并用脚本复核无中文字符 | ✅ |\n| 归档 | 建立 `verilog_hdl/` 与 `markdownfile/` 子目录；历史版本 `.v` 与资料归档；清理临时编译产物；更新 `README.md` | ✅ |\n| 验证 | LC_CPUWR v2/v3、LC_REG_MAPPING、LINK_LOGIC 均通过 iverilog 语法检查 | ✅ |\n\n### 关键信号输出责任确认\n\n| 信号 | 输出模块 | 说明 |\n|------|---------|------|\n| `R_BAC` | LC_CPUWR | 0x28[2]，BAC check control |\n| `VBK_EN` | LC_REG_MAPPING | 0x1F[1]，受 `LSI_PRTECT` 掩码保护 |\n| `SP_S[2:0]` | LC_REG_MAPPING | 0x1D，LC_CPUWR 内部生成后通过 `R_REG29_F` 传入 |\n| `VBK[7:0]` | LC_REG_MAPPING | 0x1E，同上 |\n\n### 下一步待做\n\n#### LC_CPUWR\n- [待修改] 上层 module 实例化需同步：删除 `WCK1_A_TEST`、新增 9 个输出端口、调整 `R_BAC` / `VBK_EN` 接法。\n- [待确认] I2C readback 中 0x09/0A/0x1D/0x1E 是否增加 `LSI_PRTECT` 掩码统一策略。\n- [待确认] `CHPI_SEL` 在 LC_CPUWR 内部仍硬编码为 chip_sel=0，chip_sel=1 的 0x09/0A/0x1F 映射待后续处理。\n\n### 发现问题\n\n- 无新增问题。\n\n### 明日计划\n\n- 继续推进 LC_CPUWR 上层 module 实例化同步。\n- 处理 I2C readback LSI_PRTECT 掩码统一问题。\n", "HK1V11/每日记录_0617.md": "# 每日记录 - 06/17 (星期三)\n\n### 今日完成\n\n#### LC_CPUWR 0617_v2\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 代码 | 发布 `LC_CPUWR_20260617_v2_decimal.v`：I2C 地址字面量与信号名十进制化 | ✅ |\n| 代码 | 创建 `LC_REG_MAPPING_20260617_v2_decimal.v`：`SP_S`/`VBK`/`VBK_EN` 不再受 `LSI_PRTECT` 掩码 | ✅ |\n| 代码 | 创建 `LINK_LOGIC_20260617_v2_decimal.v`：实例化新版 `LC_REG_MAPPING`，删除 `.LSI_PRTECT()` | ✅ |\n| Bugfix | 补声明 `LC_CPUWR` 的 `R_REG29_F`/`R_REG30_F` 输出端口；在 `LINK_LOGIC` 中补连这两个端口 | ✅ |\n| 验证 | 三文件联合 iverilog 语法检查通过 | ✅ |\n\n#### Checksum Case\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 代码 | 重写 `checksum_sdc_checker.sv`：寄存器名十进制化，检查地址从 9 个扩展到 13 个 | ✅ |\n| 代码 | 同步 18 个 case checker；更新 17 个 test class 数组维度与寄存器名 | ✅ |\n| 代码 | BAC case `cfg_frame` 字段由 `R_BAC` 改为 `VBK_EN`（含 longtest） | ✅ |\n| 文档 | 创建 `case_0617v2_sync_checksum.md`；重写 SDC/PWRC/BAC README；UTC 目录新增 `DEPRECATED.md` | ✅ |\n| 验证 | 脚本复核：18 份 checker 一致、无旧信号名残留、test sv 维度正确 | ✅ |\n\n#### 文档与归档\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 文档 | 重写 `lccpuwr_code_changelist_20260617_v2.md` 为当前版对比原始版的净差异清单；更新 `README.md` | ✅ |\n| 文档 | 重写 regmapping changelist；更新合规报告分析对象与 I2C 寄存器名 | ✅ |\n| 清理 | 删除临时 official changelist、编译产物及过时 regmapping changelist | ✅ |\n\n### 关键结论\n\n- `SP_S` / `VBK` / `VBK_EN` 输出职责已转移至 `LC_REG_MAPPING`，且不再受 `LSI_PRTECT` 掩码。\n- `R_REG29_F` / `R_REG30_F` 必须声明为 `LC_CPUWR` 输出并在 `LINK_LOGIC` 中显式连接，否则 `SP_S` / `VBK` 悬空。\n- 0617_v2 三件套已统一并通过语法检查。\n- Checksum case 已完成与 0617_v2 RTL 同步：18 份 checker 一致，17 个 test class 维度正确，新增 0x09/0x0A/0x1D/0x1E 检查点，UTC 标记为废弃。\n\n### 下一步待做\n\n#### LC_CPUWR\n- [待验证] 提交 0617_v2 三件套到综合/仿真环境验证。\n- [待确认] 确认 `LOGIC_CENTER` / `HK1V11_digital_top` 是否需同步 0617_v2 端口变更。\n\n#### Checksum Case\n- [待验证] 跑现有 18 个 checksum case 回归，确认 checker 改动未引入回归。\n\n### 发现问题\n\n- [差一风险] 0615 仿真计划描述与 RTL 实现可能存在差一：`unmatch_cnt_a` 在首帧 `match=0` 时也会 +1，NG Unlock case 设计时应动态监测 `unlock_latch_a`，不要硬编码帧号。\n\n### 明日计划\n\n- 新增 `t_8b1lane_checksum_vbk_en_ng_unlock` 专项 case。\n- 在通用 checker 中加入 NG Unlock 监测逻辑并同步到 case 目录。\n", "HK1V11/每日记录_0618.md": "# 每日记录 - 06/18 (星期四)\n\n### 今日完成\n\n#### LC_CPUWR Checksum / NG Unlock\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 代码 | 修复 `checksum_sdc_checker_0618v1.sv` one-shot unlock 帧内 R_REG 期望判断逻辑 | ✅ |\n| 代码 | 将修复同步覆盖到 19 个 case 的 `checksum_sdc_checker.sv` | ✅ |\n| 文档 | 更新 `case_0618v1_sync_ng_unlock.md` 与 `server_sync_checklist_0618v1.md` 的 checker 修复说明 | ✅ |\n| 验证 | 本地 19 份 checker 与源文件一致性复核；RTL iverilog 语法检查通过 | ✅ |\n| 同步 | 内网服务器 19 份 `checksum_sdc_checker.sv` 与 `cfg_frame*.txt` 同步修正 | ✅ |\n| 验证 | `t_8b1lane_checksum_vbk_en_ng_unlock`、`t_8b1lane_checksum_bac_longtest` 及现有 18 个 checksum case 回归全部通过 | ✅ |\n\n#### NG Unlock 结论\n\n- [根因] one-shot unlock 帧内 `expected[]` 已被提前切换为下一帧 cfg 值，checker 按 `expected[]` 判断当前帧 R_REG，导致误判。\n- [修复] unlock 帧内 R_REG 期望改为当前帧 `shadow`；跳过 shadow 一致性检查；帧末用实际 R_REG 更新 `loaded[]` 基线。\n- [结果] 解决 `t_8b1lane_checksum_vbk_en_ng_unlock` 在 unlock 帧报 `R_REG31_F rreg=00 expected=02` 的问题。\n\n#### I2C case 0617_v2 同步收尾\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 代码 | 26 个 `i2c_reg_check.svh` 寄存器名十进制化，新增 0x09/0x0A/0x1D/0x1E 分支，I2C 地址改为 0x80~0x86 | ✅ |\n| 代码 | 26 个 `reg_defines_bak.svh` 扩展 FCONFIG 到 14 个地址，更新默认值 | ✅ |\n| 代码 | `t_reg_i2c_unlock_rst.sv` 特殊处理：地址/信号名/默认值表对齐 0617_v2 | ✅ |\n| 文档 | 创建 `case/i2c_modify_0617.md` 完成记录与同步建议 | ✅ |\n| 确认 | 精简服务器同步清单：16 个 `reg_defines.svh` 与 25 个 test `.sv` 无需同步，实际只需 53 个文件 | ✅ |\n| 同步 | 53 个文件已复制到内网服务器对应目录 | ✅ |\n\n### 关键结论\n\n- I2C case 0617_v2 同步已完成并上传服务器。\n- 26 个 `i2c_reg_check.svh` 内容完全相同，可复制 1 份到 26 个目录。\n- 26 个 `reg_defines_bak.svh` 分 5 组，同组内容相同。\n- 16 个 `reg_defines.svh` 因 test.sv 不引用，不需要同步；25 个 test `.sv` 检查无变化，也不需要同步。\n\n### 下一步待做\n\n- [观察] 持续观察 checksum 回归稳定性；后续 RTL 改动时同步评估 checker 是否需要更新。\n- [验证] 在服务器上跑 I2C case 回归仿真，确认 0617_v2 改动在实际环境中通过。\n\n### 发现问题\n\n- [版本同步] 手动拷贝到内网服务器存在版本滞后风险，当前已接受；后续如频繁迭代可考虑改为 symlink 或统一源文件管理。\n- I2C case 0617_v2 同步无新增遗留问题。\n\n### 明日计划\n\n- [观察] 观察 checksum case 回归稳定性，按需同步更新 checker。\n- [归档] 整理 0618v1 最终报告与归档。\n- [验证] 推进 I2C case 服务器回归验证。\n", "HK1V11/每日记录_0622.md": "# 每日记录 - 06/22 (星期一)\n\n### 今日完成\n\n#### 1V11 case 回归验证\n\n完成一轮 HK1V11 case 回归，覆盖 checksum 与 i2c 两大类约 40 个 case。\n\n| 分类 | 结果 | 数量 |\n|------|------|------|\n| checksum case | 全部 PASS | 20 |\n| i2c case | PASS | 19 |\n| FAIL case | 需进一步定位根因 | 5 |\n\n> **NOT_FOUND 说明**：`t_reg_i2c_wr_lconfig` 首次运行 STATUS=NOT_FOUND（截图第 68 行），复跑后 ✅ PASS。\n>\n> **下午回归**：checksum case 回归通过 ✅\n>\n> **RTL 基线**：本次回归基于 6/15–6/16 的 5 条 LC_CPUWR RTL 变更：I2C 地址译码十进制化、Seg2 时钟域统一与 checksum 删除、Seg1 地址扩展与 NG Unlock 机制、LC_REG_MAPPING 输出重构、寄存器位置调整与新增。\n\n#### LC_CPUWR Checksum / K4_FIND 对齐修复\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 代码 | 修复 `checksum_sdc_checker_0618v1.sv` 帧边界采样偏移：改用 `K4_FIND` 上升沿作为帧边界 | ✅ |\n| 代码 | 移除 `cfg_frame` 的 `+1` 偏移：frame `fid` 加载 `cfg_frame{fid}` | ✅ |\n| 代码 | 新增辅助函数 `read_k4_find()` / `read_update_en()` / `read_chksum_mode()` | ✅ |\n| 代码 | `monitor_frames()` 结构调整：`env_cfg.frame_num` 解释为总帧数，循环改为 `fid < frame_num`，最后一帧为 `frame_num-1`；`K4_FIND` 作为每帧入口，首个无条件等待，后续 100us 超时报 `UVM_ERROR`；`apply_cfg_frame(fid)` 放在每个 `K4_FIND` 之后、`frame_end_a` 之前；最后一帧 `frame_end_a` 上升沿 50us 超时报 `UVM_WARNING` | ✅ |\n| 代码 | 修复 50us 超时补丁中的命名块冲突：最后一帧 fork 改名为 `wait_fe_pos_last`，避免 `Identifier previously declared` 编译错误 | ✅ |\n| 同步 | 覆盖 19 个 case 的 `checksum_sdc_checker.sv` | ✅ |\n| 服务器验证 | 全部 checksum case 通过 | ✅ |\n| 代码 | `t_8b1lane_checksum_sdc` / `t_8b1lane_checksum_sdc_longtest` 的 `cfg_frame*.txt` 中 `SDC` 字段改为 `VBK_EN`，匹配 0618_v1 寄存器位变更 | ✅ |\n| 文档 | 更新 `case_0618v1_sync_ng_unlock.md` 与 `server_sync_checklist_0618v1.md` | ✅ |\n\n#### K4_FIND 对齐结论\n\n- [根因] 原 checker 用 `frame_end_a` 计数并 `apply_cfg_frame(fid+1)`，导致 F5 检查时实际采样到 F6 的 `R_REG` 值。\n- [修复] 以 `K4_FIND` 上升沿作为帧边界；`cfg_frame{fid}` 与 frame `fid` 一一对应；`loaded[]` 在第一个 `K4_FIND` 处同步。\n\n### 发现问题\n\n本轮回归共有 5 个 FAIL case（截图第 78 / 95 / 96 / 101 / 102 行），需进一步定位：\n\n| 截图行 | case | UVM_ERROR | UVM_FATAL | 问题类型 |\n|--------|------|-----------|-----------|----------|\n| 78 | t_reg_i2c_wr_testreg_lastLSI | 0 | >0 | i2c testreg lastLSI 异常终止 |\n| 95 | t_reg_i2c_wr_default | 3 | 0 | i2c 默认值检查失败 |\n| 96 | t_reg_i2c_rst | 2 | 0 | i2c 复位行为异常 |\n| 101 | t_reg_i2c_unlock_rst | 16 | 0 | i2c unlock 复位异常 |\n| 102 | t_reg_i2c_w_id_mismatch | 20 | 0 | i2c 写 ID 不匹配处理异常 |\n\n- `t_reg_i2c_wr_testreg_lastLSI`：根因为 case 目录下 test `.sv` 被误替换为 `.checker` 文件，恢复正确 test 文件后 PASS。\n- [K4_FIND 采样] 修改 `cfg_frame6.txt` 的 `VBK_EN` 0→1 后，暴露 checker 帧边界采样晚一帧的问题；本地已修复，待上传服务器验证。\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| LC_CPUWR Checksum | 上传 K4_FIND 对齐后的 checker 到内网服务器，跑 `vbk_en_ng_unlock`（`cfg_frame6 VBK_EN=1`）确认 F5=00/F6=02 | 高 |\n| LC_CPUWR Checksum | 跑其余 18 个 checksum case 回归，确认 cfg 索引偏移不影响原有 case | 高 |\n| I2C | 提取 5 个 FAIL case 的详细日志，定位失败场景与信号 | 中 |\n| I2C | 确认 FAIL 是否与 0618_v1 / i2c 0617_v2 修改相关 | 中 |\n| I2C | 优先排查 `t_reg_i2c_wr_testreg_lastLSI` 的 UVM_FATAL | 中 |\n| I2C | 下午启动 I2C case 回归，当前正在跑 | 🔄 |\n| LC_CPUWR | 5 条 6/15–6/16 RTL 变更（I2C 译码、Seg2/Seg1、REG_MAPPING、寄存器位置）仍处于“等待验证”状态 | 高 |\n| LC_CPUWR | 确认 checksum 下午回归通过是否已覆盖上述 5 条变更 | 高 |\n| case 环境 | 5 条变更均标注“需要修改 case 环境”，case 适配进度待确认 | 中 |\n\n### 明日计划\n\n- 内网服务器验证 K4_FIND 对齐后的 checker。\n- 继续分析 5 个 FAIL i2c case 的日志，输出初步根因分类。\n- 与 owner 确认 `t_reg_i2c_unlock_rst` 的期望值是否需要随 0617_v2/0618_v1 更新。\n\n---\n\n## 附录：完整 PASS 结果\n\n### checksum case PASS 列表\n\n| case | UVM_ERROR | UVM_FATAL | 状态 |\n|------|-----------|-----------|------|\n| t_8b1lane_checksum_bac | 0 | 0 | ✅ PASS |\n| t_8b1lane_check 通过 | ✅ |\n\n#### LC_CPUWR Checksum Checker 升级\n\n| 类型 | 事项 | 状态 |\n|------|------|------|\n| 升级 | 18 个 case 的 `checksum_sdc_checker.sv`：默认值与字段映射对齐 `AVE_RGBW`、`DPLC_MODE/GROUP` | ✅ |\n| 补齐 | `case_list.txt` 新增 `t_8b1lane_checksum_vbk_en_ng_unlock` 与 longtest 条目 | ✅ |\n| 迁移 | 统一 checker 架构：`isprx_env/isptx_agent/checker_for_checksum.sv` 由 `tb.f` 编译，18 个 case 改为 class 实例化 | ✅ |\n| 验证 | `iverilog` 基础语法检查通过；完整编译需在 VCS 环境验证 | ✅ |\n\n#### LINK_LOGIC / LOGIC_CENTER 0626v1_temp 端口同步\n\n| 类型 | 事项 | 状态 |\n|------|------|------|\n| 同步 | `LOGIC_CENTER` 中 `LINK_LOGIC` 实例化：新增 `DPLC_GROUP`、`reg_pin_eq`、`CG_OFF`、`EQ_DC_L0`、`AVE_RGBW`，删除旧 `AVE_R/G/B/AUTO/DELTA` | ✅ |\n| 修正 | 删除误加入的 5 个非 `LINK_LOGIC` 顶层端口 | ✅ |\n| 适配 | `CENTER1` 的 `AVE_R/G/B/AUTO/DELTA` 输入改为历史默认值 | ✅ |\n| 验证 | 脚本对比确认实例化端口与顶层端口一致；`iverilog` 语法检查通过 | ✅ |\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| 验证 | 内网服务器跑 0626v1 回归 | 高 |\n| 验证 | 新 case `t_reg_i2c_rst_chip_sel1` / `t_reg_i2c_wr_chip_sel1` 服务器真实仿真 | 高 |\n| 验证 | 统一 checker `checker_for_checksum.sv` VCS 编译与运行 | 高 |\n| 文档 | 更新 `chip_sel0/1_register_address_map.md` | 中 |\n\n### 发现问题\n\n- 新 chip_sel=1 case 已完成本地创建与语法检查，尚未在服务器执行真实回归。\n- 统一 checker 依赖 UVM package 与 unpacked array parameter，需在 VCS 真实环境验证编译与运行。\n\n### 明日计划\n\n- 推进 LC_CPUWR 0626v1 服务器回归验证（含统一 checker 与 chip_sel=1 新 case）\n- 根据回归结果修复 checker、case 或 RTL\n- 完成 chip_sel0/1 寄存器映射表同步\n", "HK1V11/每日记录_0629.md": "# 每日记录 - 06/29 (周一)\n\n### 今日完成\n\n| 模块 | 类型 | 事项 | 状态 |\n|------|------|------|------|\n| HDL | 审查 | HDL/DV_TCON_C 服务器同步后差异对比 | ✅ |\n| HDL | 确认 | 当前 RTL 已完成 2026/6/24 寄存器重构 | ✅ |\n| DV_TCON_C | 评估 | 40 case 覆盖映射审查，生成一级路径报告 | ✅ |\n| DV_TCON_C | 修正 | `case_list.txt` 19→41 case | ✅ |\n| DV_TCON_C | 新增 | `t_reg_i2c_chip_sel1_mapping` case | ✅ |\n| DV_TCON_C | 调整 | 回归脚本策略与 ppm 资产链接策略 | ✅ |\n\n### 发现问题\n\n- ✅ `case_list.txt` 过时 → 已修正\n- ✅ chip_sel=1 映射缺 case → 已新增，待服务器验证\n- ⏸️ BWDL/DBC/SSFC case 缺口 → 不由我负责\n- ✅ 变更清单 #22 与 RTL 不一致 → 清单已过时，当前 RTL 为准\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------ ----|---------|-----|-----|-----|\n| LSP 单帧 | 全错 | 1错(byte11) | 1错(byte11) | **PASS** |\n| Payload 单帧 | 全错 | PASS | PASS | PASS |\n| Payload 5帧 | — | 169错 | 1错(byte123) | 1错(byte123) |\n\n#### 420b 数据流完整分析\n\n**编码侧: 420 bit 怎么组成的**\n\nSpec (`CHPI_420b`): \"输入413比特，输出420比特\"\n\n```\n420 bit = 7 bit header + 413 bit data\n       = 21 包 × 20 bit/包\n\n第 1 包 (pack_20b_cnt=0, tag_pack=1):\n  bit[6:0]  = header: {tag[5:0], toggle}\n  bit[19:7] = 13 bit 数据\n\n第 2~21 包 (pack_20b_cnt=1~20):\n  bit[19:0] = 20 bit 数据\n\n数据量验证: 13 + 20×20 = 13 + 400 = 413 ✓\n```\n\n**解码侧: decoder_7b 怎么收**\n\n| 条件 | HDL 位置 | 加多少 bit | 取哪些位 |\n|------|---------|-----------|---------|\n| `tag_pack && decode_en` | `decoder_7b.v:217` | +13 | `din_20b_aligned[19:7]` |\n| `decode_en && half_valid` | `decoder_7b.v:221` | +10 | `din_20b_aligned[9:0]` |\n| `decode_en && !K2/K3` | `decoder_7b.v:225` | +20 | `din_20b_aligned[19:0]` |\n\n**解码侧: 7-bit 组怎么切**\n\n| 条件 | HDL 位置 | 出几组 | 减多少 bit |\n|------|---------|--------|-----------|\n| `raw_data_num >= 21` | `decoder_7b.v:174` | 3 (valid=3) | -21 |\n| `raw_data_num >= 14` | `decoder_7b.v:179` | 2 (valid=2) | -14 |\n| `raw_data_num >= 7` | `decoder_7b.v:184` | 1 (valid=1) | -7 |\n\n**解码侧: 7-bit 组→24-bit 字节打包**\n\n| 条件 | HDL 位置 | 出几字节 | 减多少 bit |\n|------|---------|---------|-----------|\n| `dec_data_num >= 24` | `long_decoding_top.v:212` | 3 (byte0~2) | -24 |\n| `dec_data_num >= 16` | `long_decoding_top.v:212` (v4新增) | 2 (byte0~1) | -16 |\n| `dec_data_num >= 8` | `long_decoding_top.v:212` (v4新增) | 1 (byte0) | -8 |\n\n**LSP 59 组完整累加追踪**\n\n```\ndecoder_7b 侧(group→dout_21b_valid)  │  long_decoding_top 侧(组→字节)\n                                     │\nraw=13 → 切1组(余6)  dout: valid=1   │  +7bit  → dec_data_num=7   (<24,不输出)\nraw=6+20=26→切3组(余5) dout:valid=3  │  +21bit → dec=28 → 输出24 → 余4   bytes 0,1,2\nraw=5+20=25→切3组(余4) dout:valid=3  │  +21bit → dec=25 → 输出24 → 余1   bytes 3,4,5\nraw=4+20=24→切3组(余3) dout:valid=3  │  +21bit → dec=22 → 不输出         ← 跳跃！\nraw=3+20=23→切3组(余2) dout:valid=3  │  +21bit → dec=43 → 输出24 → 余19  bytes 6,7,8\nraw=2+20=22→切3组(余1) dout:valid=3  │  +21bit → dec=40 → 输出24 → 余16  bytes 9,10,11 ← byte11!\nraw=1+20=21→切3组(余0) dout:valid=3  │  +21bit → dec=37 → 输出24 → 余13  bytes 12,13,14\nraw=0+20=20→切2组(余6) dout:valid=2  │  +14bit → dec=27 → 输出24 → 余3   bytes 15,16,17\nraw=6+20=26→切3组(余5) dout:valid=3  │  +21bit → dec=24 → 输出24 → 余0   bytes 18,19,20\nraw=5+20=25→切3组(余4) dout:valid=3  │  +21bit → dec=21 → 不输出         ← 跳跃！\nraw=4+20=24→切3组(余3) dout:valid=3  │  +21bit → dec=42 → 输出24 → 余18  bytes 21,22,23\nraw=3+20=23→切3组(余2) dout:valid=3  │  +21bit → dec=39 → 输出24 → 余15  bytes 24,25,26\nraw=2+20=22→切3组(余1) dout:valid=3  │  +21bit → dec=36 → 输出24 → 余12  bytes 27,28,29\nraw=1+20=21→切3组(余0) dout:valid=3  │  +21bit → dec=33 → 输出24 → 余9   bytes 30,31,32\nraw=0+20=20→切2组(余6) dout:valid=2  │  +14bit → dec=23 → 不输出\nraw=6+20=26→切3组(余5) dout:valid=3  │  +21bit → dec=44 → 输出24 → 余20\nraw=5+20=25→切3组(余4) dout:valid=3  │  +21bit → dec=41 → 输出24 → 余17\nraw=4+20=24→切3组(余3) dout:valid=3  │  +21bit → dec=38 → 输出24 → 余14\nraw=3+20=23→切3组(余2) dout:valid=3  │  +21bit → dec=35 → 输出24 → 余11\n... (后续同理，不再列出)\n```\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| longcode | 修复 5帧 byte 123: 标签假阳性 (scrambled prefix 与 tag 冲突) | 中 |\n| 日报 | 更新周报 | 低 |\n\n### 发现问题\n\n| 归属 | 问题 | 根因 | 状态 |\n|------|------|------|------|\n| DUT | descrambler LFSR 偏移 | data_pre1 用 lfsr_k1 非 lfsr_key | ✅ v1 |\n| DUT | 位反转 | 420b MSB先发 vs DUT LSB先存 | ✅ v1 反转补偿 |\n| DUT | 5帧 LFSR 漂移 | dout_21b_valid 滞后1拍→幽灵valid | ✅ v2 门控 |\n| DUT | **LSP byte 11** | dec_data_buf batch跳跃+>>24截断 1bit偏差 | ✅ v4 |\n| DUT | 5帧 byte 123 | scrambled prefix与tag冲突→假阳性替换 | ❌ |\n| ENV | SV 顺序错误 | replace→scramble 应为 scramble→replace | ✅ v3 |\n| ENV | scramble_en 竞态 | tb posedge后才置位→DUT采样到0 | ✅ v1 |\n\n#### DUT byte 11 详细分析\n\nbyte 11 在 `dec_data_num=43` 输出后的批次里。这一轮的输入来自 decoder 的 `raw_data_num`=3→23→切3组(valid=3) 这个 group batch。\n\n累积过程：\n```\n上一轮余 19 bit（来自 batch 4 输出后的 >>24 截断）\n+ 本轮 21 bit（3 组 × 7）\n= 40 bit\n→ 输出 24 bit = bytes 9,10,11\n→ 余 16 bit\n```\n\n`dec_data_buf >> 24` 截断时，`dec_data_buf[23:0]` 被取为输出，`dec_data_buf[41:24]` 右移成新余数。但 batch 3 跳跃（22<24 未输出）导致那 22 bit 未被截断，累积到 43 bit 后才做 `>>24`。\n\n**关键**：正常每 3 batch 输出一次（28→25→22→43→40→37→...），batch 3 的跳跃打乱了 7-bit 组边界和 24-bit 输出边界的对齐关系。跳跃的那次，`dec_data_buf_pre = dec_data_buf`（不右移），下一轮再加 21 bit 后整体右移 24。这个不右移→整体右移的切换，让截断线和 7-bit 组边界差了 1 bit。\n\n具体到 byte 11（输出 batch 的第 3 个字节）：\n```\nByte 11 = dout_24b[23:16] = dec_data_buf[23:16]\nbit23~16 来自：余 19 的高位 + 新 21 的低位\nbit16~18 = 前余[16:18], bit19~23 = 新组[0:4]\n                              ↑ 这个边界差了 1 bit\n```\n\n这就是为什么 31 字节正确、唯独 byte 11 错 1 bit。v4 修复：新增 `>=16→2bytes`, `>=8→1byte` 的**部分字节输出**，在 batch 3 (22 bit) 时出 2 字节 (16 bit)，不再跳跃，>>16 截断线与 7-bit 边界对齐。\n\n**为什么 8b10b 不受影响**：8b10b 没有 7-bit 分组、没有 24-bit 批量输出、没有 dec_data_buf 累加。\n\n### 明日计划\n\n| 模块 | 事项 |\n|------|------|\n| longcode | 修复标签假阳性 (tag 冲突) |\n| longcode | 出 v4 完整报告 |\n", "HK1V11/每日记录_0713.md": "# 每日记录 - 07/13 (周一)\n\n### 今日完成\n\n#### 420b 长编码 Normal frame 本地仿真\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 环境 | 从 `HDL/HK1V11_digital_top/long_encoding/` 重新提取 DUT，仅加 debug | ✅ |\n| 参考模型 | 保持 LSB-first 6 点修改，`replace_cnt==0` 保留 `tag=6'b100000` | ✅ |\n| Testbench | 实现 5 帧 × 16 active line + 8 vblank line，1024 bytes/line 完整帧序列 | ✅ |\n| 仿真 | Icarus Verilog 跑通，按区域统计 mismatch | ✅ |\n| 报告 | 更新 `DATA_REPORT.md`、`CHANGELOG.md`、`simulation/README.md` | ✅ |\n\n#### 420b 长编码 local_normal_case_v3\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 环境 | 新建 `simulation/local_normal_case_v3`，DUT 从 v2 复制（仅 debug） | ✅ |\n| 参考模型 | 在 v2 LSB-first 参考模型上扩展 `encode_with_70b_alignment` | ✅ |\n| Testbench | 参考 `current_work v3` 帧结构，参考 `t_8b1lane` 参数（HACT=3840, VACT=16, VBP=4, VFP=5, FRAME_NUM=8, PORT_NUM=12） | ✅ |\n| 仿真 | Icarus Verilog 跑通，完成跨帧结构 | ✅ |\n| 报告 | 生成 `DATA_REPORT.md`，更新 `CHANGELOG.md`、`simulation/README.md` | ✅ |\n\n---\n\n### 发现问题\n\n#### 错误分布（单帧典型值）\n\n| 区域 | 字节数 | 错误数 | 正确数 | 说明 |\n|------|--------|--------|--------|------|\n| INIT_CTRL_F | 60 | 1 | 59 | byte 38 固定错误：期望 `0x26`，收到 `0x22` |\n| FRAME_START | 60 | 1 | 59 | 同为 byte 38 固定错误 |\n| Active line 0 | 1024 | 773 | 251 | 前 251 bytes 正确，之后被 IDLE K-code 污染 |\n| Active line 1~15 | 1024×15 | 1023×15 | 1×15 | 仅首字节正确 |\n| FRAME_END | 60 | 59 | 1 | 几乎全错 |\n| Vblank line 0~7 | 1024×8 | 759~769 | 255~265 | 全 IDLE 段被当数据解码 |\n\n#### 错误逻辑\n\n1. **DUT 无法识别 K-code IDLE**\n   - `decoder_7b` 在 `K1`/`K4` 与 `K2` 之间持续把所有 420-bit 输入当 payload 解码，没有跳过 K-code 的逻辑。\n   - 因此 active line 视频数据后紧跟的 1024 bytes K-code IDLE 被当作有效数据继续解码，污染后续输出。\n\n2. **第一条 active line 前 251 bytes 正确，后续漂移**\n   - K1 后的初始阶段，decoder 状态干净，能正确恢复视频前 251 bytes。\n   - 一旦 K-code IDLE 进入，decoder 的加扰器/替换状态被污染，导致同一条 line 剩余数据及后续 line 基本全部错误。\n\n3. **FRAME_END 几乎全错**\n   - `K4 + FRAME_END(60B)` 后的 IDLE 同样被持续解码，60 bytes 中仅 1 byte 正确。\n\n4. **Vblank 被当数据解码**\n   - 8 条 vblank line 全是 K1 + IDLE + K2 + IDLE，但 decoder 不区分 payload 与 IDLE，mismatch 稳定在 759~769，说明错误模式相对规律。\n\n5. **INIT_CTRL_F / FRAME_START 主体结构正确**\n   - 60 bytes 中仅 byte 38 固定出错，说明配置包/帧起始包主体解码正确，但存在一处固定的编码/解码差异（可能与 `tag` 或 `toggle` 边界有关）。\n\n#### 当前正确的内容\n\n- 帧时序、K-code 发送顺序、参考模型 LSB-first 逻辑与 DUT 初步对齐。\n- `INIT_CTRL_F` / `FRAME_START` 主体结构正确（59/60 bytes 匹配）。\n- 第一条 `active line` 前 251 bytes 正确。\n- `K2` 前用 K-code IDLE 比用 420b 编码 zeros 更优：后者会导致 `FRAME_START` 和 active lines 全部输出为 0，已回退。\n\n#### 团队知识库 / 公开分享\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 图表 | 用 `fireworks-tech-graph` skill 重画 420b 架构对比图、验证环境架构图为 SVG，解决乱码 | ✅ |\n| 网站 | 更新 `team-share-public` 文章，图片引用改为 SVG | ✅ |\n| 网站 | 修复 Markdown 渲染空白问题（改用 `text/template` 避免 JS 转义错误） | ✅ |\n| 网站 | 添加左侧悬浮大纲索引（TOC），支持滚动高亮与移动端抽屉 | ✅ |\n| 网站 | 将单页长文拆分为「首页概览 + 9 个章节子页」，首页突出框架/结构，详情通过卡片跳转 | ✅ |\n| Skill | 更新 `team-share` skill，补充多页拆分工作流（landing + chapters） | ✅ |\n| 网站 | 添加常驻顶部导航栏，所有页面滚动时导航可见，点击可跳转到任意章节 | ✅ |\n| 网站 | 首页增加作者署名 ymzhuuuu，去掉来源行 | ✅ |\n| 网站 | 章节页恢复左侧悬浮 TOC；左侧 TOC 仅显示当前页标题和本章小节，不跨页面 | ✅ |\n| 网站 | 将所有章节页统一重构为 `h2`/`h3` 编号层级，左侧 TOC 完整显示二级、三级标题 | ✅ |\n| 网站 | 修复左侧 TOC 滚动时消失问题：让 TOC wrapper 撑满容器高度，sticky TOC 随页面滚动始终可见 | ✅ |\n| 网站 | 新增公开文章《HK1V11 LC_CPUWR 代码修改全记录》，基于 `LC_CPUWR_history` 整理 6 个章节 | ✅ |\n| 网站 | 读取 `3.HK1V11_changelist.xlsx` 中「Register Change」sheet，将详细寄存器变更同步更新到 LC_CPUWR 文章 | ✅ |\n| 网站 | 根据 `LC_CPUWR_20260714_v1_changelist.md` 更新 0714v1 chip_sel=1 默认值实现机制（LC_REG_MAPPING 回拼） | ✅ |\n| 网站 | 根据 0612~0714 每日记录补充 LC_CPUWR 文章细节：checksum 死锁、NG Unlock 修复、checker 数组越界、K4_FIND 帧边界、cfg_frame 解析一致性等 | ✅ |\n| 网站 | 为所有页面添加 `Cache-Control` / `Pragma` / `Expires` 缓存禁用 meta 标签，减少刷新依赖 | ✅ |\n| 网站 | LC_CPUWR 复位域图补充 N_RST/N_RST_NLOCK 区别与 RSTN_SCR_EN 加扰复位说明 | ✅ |\n| 网站 | LC_CPUWR 复位域图补充 I2C_EN=1 关闭 N_RST_NLOCK unlock reset 的 RTL 路径说明 | ✅ |\n\n#### 420b Spec 理解\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 确认 | 重新确认 420b 发送顺序为 LSB-first（bit0 先发） | ✅ |\n| 文档 | 更新 `longcode_ver/longcode_spec_understanding.md`，补充 Header/toggle/tag 位序与 DUT tag 提取说明 | ✅ |\n| 文档 | 同步更新公开文章中的发送方向描述 | ✅ |\n\n---\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| 420b 长编码 | 待用户决策：继续小调提升匹配率，或接受当前错误归档 | 中 |\n\n---\n\n#### 420b 帧结构最后一帧 CTRL_F 越界确认\n\n- `send_420b_ctrl_f_data(frame_num + 1)` 与 8B/10B `send_CTRLF_seq(c+1)` 行为一致，保持原样。\n- 补注释说明：最后一帧缺 `cfg_frame{frame_num}.txt` 时 `process_line()` 静默跳过，不修改行为。\n\n---\n\n### 明日计划\n\n- 根据用户决策继续优化 testbench 或整理最终报告。\n- 继续完善 LC_CPUWR 公开文章可视化细节。\n- **寄存器默认值更新**（待办）。\n\n\n---\n\n### 备注\n\n- 用户已确认“有错是正常的”，当前错误可接受。\n- v2：单帧 mismatch 约 22,320，5 帧总 mismatch 约 111,600。\n- v3：总 mismatch 191,794 / 193,540；K4 后 descrambler 关闭导致跨帧数据无法解扰，与 v2 的“DUT 无法识别 K-code IDLE”结论一致。\n", "HK1V11/每日记录_0714.md": "# 每日记录 - 07/14 (星期一)\n\n### 今日完成\n\n#### SV参考模型 LSB修正\n\n| 事项 | 状态 |\n|------|------|\n| 编码顺序 scramble→replace | ✅ |\n| Tag基于scrambled prefix | ✅ |\n| 发送顺序 MSB→LSB | ✅ |\n| 头部{toggle,tag}→{tag,toggle} | ✅ |\n| 替换组{tag,type}→{type,tag} | ✅ |\n| wire concat反转→LSB线序 | ✅ |\n| DUT检查{tag_value,1'b0}→{1'b0,tag_value} | ✅ |\n| decode函数缺j编译bug修复 | ✅ |\n\n#### sequence/driver LSB同步\n\n| 事项 | 状态 |\n|------|--- 不一致导致 K-code 路由错位\n\n**现象**：\n\nLSP 阶段本应是 `K2 K3 K2 K3 K2 K3 K2 K3 K2 K3`，但实际波形为 `K1 K2 K1 K2 K1 K2 K1 K2 K1 K2 K3 K4`；\n`send_420b_lsp()` 在 320.248us 发送 K2，但 driver 日志显示收到 K1。\n\n**根因**：\n\n`isptx_transaction_20260714_v1.sv` 与 `isptx_driver_20260714_v1.sv` 中 420B enum 顺序不一致。\n\n- transaction/sequence 顺序：`K2_420B, K3_420B, K4_420B, K1_420B`\n- driver 顺序：`K1_420B, K2_420B, K3_420B, K4_420B`\n\n由于 `tr.id` 传输的是整数值，driver 按照自己的 enum 解析，导致同样的 id 被路由到错误的 K-code task。\n\n**映射错位示例**：\n\n| sequence 意图 | sequence 设置的 `tr.id` | driver 解析的类型 | driver 实际驱动 |\n|--------------|------------------------|------------------|----------------|\n| 发 K2 | `TYPE_DRV_K2_KEY_420B` | `TYPE_DRV_K1_KEY_420B` | `tr.k1_420b` = K1 |\n| 发 K3 | `TYPE_DRV_K3_KEY_420B` | `TYPE_DRV_K2_KEY_420B` | `tr.k2_420b` = K2 |\n| 发 K4 | `TYPE_DRV_K4_KEY_420B` | `TYPE_DRV_K3_KEY_420B` | `tr.k3_420b` = K3 |\n| 发 K1 | `TYPE_DRV_K1_KEY_420B` | `TYPE_DRV_K4_KEY_420B` | `tr.k4_420b` = K4 |\n\n**波形解释**：\n\n`send_420b_lsp()` 循环 5 次，每次 `K2 + data + K3`。driver 侧 5 次循环被错解为 `K1 K2` 重复 5 次，即 `K1 K2 K1 K2 K1 K2 K1 K2 K1 K2`；\nLSP 结束后 `send_420b_ctrl_f_line(0)` 发 K4，被 driver 错解为 K3；\n随后 `send_ppm_420b()` 第一行发 K1，被 driver 错解为 K4；\n因此观察到末尾 `K3 K4`。\n\n**状态**：✅ 已修复并验证通过（transaction enum 已改为与 driver 一致：K1/K2/K3/K4；case 已跑通）。\n\n---\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| 420b 长编码 | clean rebuild（SV enum 值编译期确定，必须清缓存重编） | 高 |\n| 420b 长编码 | 确认仿真实际引用的是 `current_work` 还是 `DV_TCON_C` 路径，必要时同步修改 | 高 |\n| 420b 长编码 | 重新抓取 LSP + 帧头波形，验证 K2/K3/K4/K1 顺序正确 | 高 |\n\n---\n\n### 明日计划\n\n| 模块 | 计划事项 |\n|------|----------|\n| 420b 长编码 | 验证 LSP 阶段 K2/K3 正确输出，DUT 能正常检测 |\n| 420b 长编码 | 继续调试 frame 阶段 K-code 与数据 payload 对齐 |\n\n### 备注\n\n- 本次修改仅更新了 `longcode_ver/current_work/isptx_transaction_20260714_v1.sv`。\n- 若仿真 filelist 指向 `DV_TCON_C/top/agents/isprx_env/isptx_agent/isptx_transaction.sv`，需要将该同步也应用过去。\n", "HK1V11/每日记录_0716.md": "# 每日记录 - 07/16 (星期四)\n\n### 今日完成\n\n#### LC_CPUWR 寄存器变更\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 变更评估 | 核对 Excel 寄存器表，确认仅 0x35 新增 FSEL[1:0] 一项变更 | ✅ |\n| RTL 修改 | LC_CPUWR 新增 FSEL[1:0] 输出端口，R_REG53_F 拆分为 FSEL + Reserved | ✅ |\n| RTL 修改 | LINK_LOGIC 新增 FSEL[1:0] 输入端口并空接，LC_REG_MAPPING 不变 | ✅ |\n| 版本归档 | 将 0714v1 RTL 移入 `verilog_hdl/`，生成 0716v1 当前版本 | ✅ |\n| 环境归档 | 新建 `current_env/`，生成 0716v1 reg_model/env_cfg/checker/reg_define | ✅ |\n| 规范修正 | 将 FSEL assign 从端口声明区移到 Part 10 输出赋值区，并补 LSI_PRTECT 门控 | ✅ |\n| 文档更新 | 新建 0716v1 changelist，更新 README.md 与 CHANGES.md | ✅ |\n| GitHub | 当前变更已推送到 `https://github.com/ymzhuuuuufz0313l/HK1V11` | ✅ |\n\n#### 工作流规范\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 流程沉淀 | 在 `.kimi/AGENTS.md` 与 `AGENTS.md` 中新增 Plan Mode 工作流模板 | ✅ |\n| Git 配置 | 配置全局 user.name / user.email，并修正提交作者信息 | ✅ |\n\n#### longcode 420b 验证环境\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 版本管理 | `current_work/` 备份为 `0716v2/`（含 debug），重命名为 `0717v1/` 并升级文件名 | ✅ |\n| 帧结构修改 | Config Line 单独成行：VACT 后单独发送 `K4+CTRL_F+Dmy+K2` | ✅ 待仿真 |\n| 帧结构修改 | 所有 active line（含最后一行）统一以 K2 结束，不再嵌入 K4+CTRL_F | ✅ 待仿真 |\n| Spec 确认 | Config Line 的 Dmy 确认内嵌于 413b/420b 编码对齐，结构无需变更 | ✅ |\n\n---\n\n### 发现问题\n\n#### FSEL assign 初始位置不符合 LC_CPUWR 代码规范\n\n**现象**：最初将 `assign FSEL[1:0] = R_REG53_F[1:0];` 放在模块端口声明之后、内部寄存器声明之前。\n\n**根因**：LC_CPUWR 中所有寄存器字段输出赋值统一集中在 `Part 10: Register Bit Field Output Assignment`，按地址顺序排列，并带 `LSI_PRTECT` 门控。\n\n**修正**：将 FSEL assign 移到 0x33 与 0x36-0x37 输出之间，改为 `assign FSEL[1:0] = LSI_PRTECT ? R_REG53_F[1:0] : 2'b00;`。\n\n**状态**：✅ 已修正并重新推送 GitHub。\n\n#### 420b K-code 序列出现异常 \"K1 K2 K2 K1 K2\"\n\n**现象**：driver 侧偶发两个 K2 后接一个 K1，预期应为一个 K2 一个 K1。\n\n**排查**：已在 sequence/driver 两侧增加 per-lane K-code 序列日志（`long_kcode_seq/drv_laneN.md`）。\n\n**状态**：⏳ 待 0717v1 仿真后用日志复核（帧结构修改后可能已消除）。\n\n---\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| longcode 420b | 仿真验证 0717v1 帧结构，用 kcode 日志复核 K-code 序列 | 高 |\n| longcode 420b | 与 Spec 确认 K3 使用条件（DUT 中 K4 关解扰、仅 K3 重新使能） | 中 |\n| LC_CPUWR | 根据项目节奏，决定是否将 0716v1 归档副本同步到 `HDL/` 工作区 | 中 |\n| LC_CPUWR | 根据项目节奏，决定是否将 0716v1 env 同步到 `DV_TCON_C/` 工作区 | 中 |\n\n---\n\n### 明日计划\n\n| 模块 | 计划事项 |\n|------|----------|\n| 待确认 | 根据用户下一步指令确定 |\n\n### 备注\n\n- 本次变更严格限定在 `LC_CPUWR_history/` 下，`HDL/` 与 `DV_TCON_C/` 工作区未修改。\n- FSEL 当前在 LINK_LOGIC 内部空接，未连接到顶层模拟模块。\n", "HK1V11/每日记录_0717.md": "# 每日记录 - 07/17 (星期五)\n\n### 今日完成\n\n#### longcode 420b 验证环境\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| Debug 增强 | 新增 `long_rawbyte_seq_laneN.md`：编码前 raw 数据按 byte 转储（LSP/CTRL_F/CTRL_L/Video/VBK） | ✅ 待仿真 |\n| Debug 增强 | K 码（K1~K4）作为不编码时间标记，与字节流按时间交织，可核对各 region 原始字节与 K 码时刻 | ✅ 待仿真 |\n| Debug 增强 | 新增 RTL 接收侧日志 `long_rtl_rx_lane0.md`：bind 注入 LINK_LOGIC，抓 K_FIND/BK_ST/INDATA/对齐数据/解码器输入/像素输出 | ✅ 待仿真 |\n| Debug 增强 | 新增 seq 侧 `long_pkt20_seq_laneN.md`：实际发出的 20-bit 包流，与 RTL 侧逐包 diff | ✅ 待仿真 |\n| 编译修复 | bind 模块改为端口连接（内部不能直接引用目标作用域信号），仅替换 tap 文件 | ✅ |\n| Debug 增强 | tap 模块新增第二输出 `long_rtl_dec_lane0.md`：解码+解扰后字节流（16B/行，`[K]` 分段） | ✅ |\n| RTL 验证 | 确认 `din_20b_aligned` 误接 DATA_POINT_LAT，改接 `DATA0_ALIGN_LONG` 后 LSP 解码正确 | ✅ |\n| 结论确认 | \"K1 后数据全 0 不对\"答疑：VBK 全 0 是 dummy 设计，配置在 K4 CTRL_F 且逐项对上（POL/PORSD/CH_SEL/TEST_PRTCT），用户确认结论正确 | ✅ |\n| 位序修复 | pixel/VBK 压流由 MSB-first 改为 LSB-first（与 CTRL_L/CTRL_F/LSP 一致），修复 ACT 像素解码逐位反转问题 | ✅ 待仿真 |\n| 加扰对齐 | 三处 encode 的 scramble_en 由硬编码 `1'b1` 改为 `env_cfg.SCREN`（对齐 DUT R_SCREN） | ✅ 待仿真 |\n\n---\n\n## 🎯 关键结论：420b 长编码线上数据全部正确 ✅\n\n> ### 📌 接收端使用 Python 对 `DATA_ALIGN_PRE` 进行离线 413b/420b 解码比对，发现 **LSP / CTRL_F / CTRL_L / VBK / Video 数据全部正确** —— 问题在 RTL 解码侧，**不在发送数据**。\n\n### 🔍 验证过程（三级独立交叉验证）\n\n| 步骤 | 内容 | 产出 |\n|------|------|------|\n| ① 抓取 | `long_rtl_tap_debug.sv` bind 进 `CHPI_KCODE_ALIGN_LONG_L0`，每拍全量记录 `DATA_ALIGN_PRE`（对齐后 20-bit 流） | `long_rtl_dap_lane0.md` |\n| ② 解码 | Python `decode_dap.py` 离线 413b/420b 解码（K 码对定位、tag 替换、G16 解扰；与 encode/DUT 语义一致；roundtrip 500 块随机数据全对） | `long_pydec_lane0.md` |\n| ③ 比对 | 与发送端编码前原始字节 `long_rawbyte_seq_lane0.md` 逐区域 diff | `long_pydec_report_lane0.md` |\n\n### ✅ 比对结果\n\n| 区域 | 期望内容 | Python 解码 | 结果 |\n|------|----------|-------------|------|\n| LSP | `ed ec eb ea` ×8 | 完全一致 | ✅ |\n| CTRL_F | 64B 帧配置（PORSD=1 / CH_SEL=1 / TEST_PRTCT=0x72 / POL=0） | 逐项一致 | ✅ |\n| CTRL_L | 行控制（FSYNC / BKDU / POL） | 完全一致 | ✅ |\n| VBK | dummy 全 0 | 完全一致 | ✅ |\n| Video | 像素渐变 `00 01 02...` | 完全一致（修位序后） | ✅ |\n\n### 🖼️ 证据截图\n\n![0717 长编码 python 解码数据正确](https://ymzhuuuuufz0313l.github.io/daily-record/images/HK1V11/0717_longcode_pydec_ok.jpg)\n\n> 本地原图：`E:\\每日记录\\HK1V11\\image\\0717长编码 python解码数据正确 图.jpg`（ACT 行解码：`11 05 16 00 00` CTRL_L + `00 01 02 03...` 像素渐变，与发送完全一致）\n\n### ⚠️ 过程中定位并处理的问题\n\n| 问题 | 侧 | 状态 |\n|------|-----|------|\n| `din_20b_aligned` 误接 `DATA_POINT_LAT`（对齐位置标志当数据） | RTL | 🔵 已改 `DATA0_ALIGN_LONG` 并验证 |\n| `K1_FIND` 被 `& BK_ST` 与逻辑遮盖（\"K1 K2 K2 K1 K2\" 异常） | RTL | 🔵 移交俊杰 |\n| RTL 解码区域边界：起始残流 / 尾部溢出 / 个别位错 | RTL | 🟡 待俊杰跟进（pydec 可作对照证据） |\n| TX 加扰硬编码 `1'b1` vs case `SCREN=0` | TX | 🔵 已改 `env_cfg.SCREN` |\n| TX pixel/VBK 压流 MSB-first（像素逐位反转） | TX | 🔵 已改 LSB-first |\n\n---\n\n### 发现问题\n\n#### 420b K-code 异常 \"K1 K2 K2 K1 K2\" 根因已定位 ✅\n\n**根因**：RTL 420b/8B10B mux 处部分信号逻辑未随 420b 更新。`CHPI_KCODE_ALIGN_LONG_L0.v` 中：\n\n```verilog\nassign K1_FIND = K1_CODE2 & K1_CODE1_D1 & BK_ST;  // K2/K3/K4 无 BK_ST 门控\n```\n\n`BK_ST` 由 `BIT_ALIGN_PT | (R_BKDU & K2_FIND)` 置位、由 `K1_FIND` 清零。`BIT_ALIGN_PT` 源自 8B/10B 的 `CHPI_SD_CTRL` 数据结束时序，420b 行结构下置位时序不匹配时，`BK_ST` 保持为 0，后续 K1 被 `& BK_ST` 与逻辑遮盖，表现为 K1 偶发丢失。\n\n**处理**：RTL 修复由俊杰负责（07/17 移交），遗留问题已关闭 🔵。\n\n#### 疑似 420b mux 接线问题（已确认并修复）✅\n\n`LINK_LOGIC.v:1250` 将 `DATA_POINT_LAT`（对齐**位置标志**锁存，非数据）接到 `long_decoding_top.din_20b_aligned`——证据：LSP/CTRL_F/VBLK 三个区域解码输出均为同一套载荷无关的重复模式（`28 00 80 02`）。改接 `DATA0_ALIGN_LONG` 后 LSP 成功解出原始训练码 `ed ec eb ea`，接线修复生效。\n\n#### TX/RX 加扰策略不一致（已修复 TX 侧）✅\n\nTX sequence 对 payload 硬编码 `scramble_en=1'b1`，但 case `SCREN=0`（cfg_frame 无配置，默认 1'b0）→ DUT 解扰器全程旁路，CTRL_F/VBLK/ACT 解出密文。已将三处 encode 调用的 scramble_en 改为 `env_cfg.SCREN`（与 DUT `R_SCREN` 同源），LSP 保持不加扰。\n\n#### \"K1 后数据全 0 是否错误\"答疑（结论：数据正确）✅\n\n**用户提问**：从收到的数据看，K1 后面的数据全是 0，与 `cfg_frame0.txt` 的配置（POL 0 / PORSD 1 / CH_SEL 1 / TEST_PRTCT 01110010）对不上，是否解码错误？\n\n**回答（用户已确认正确）**：\n- K1 行结构是 `CTRL_L(5B) + VBK dummy(960×0x00)`，**全 0 部分是 VBK dummy，本来就是零**，不是错误；\n- 帧配置在 **K4 CTRL_F 行**（64B），逐项核对全部一致：`0x01[5]=PORSD=1`(0x20)、`0x05[7:5]=CH_SEL=1`(0x20)、`0x30=TEST_PRTCT`(0x72)；\n- CTRL_L `10 05 16 04 00` 中 `0x40[1]=POL=0` 也与 cfg 一致。\n\n#### ACT 像素字节逐位反转（已定位并修复）✅\n\n**现象**：pydec 解码 ACT 行，前 5 字节 CTRL_L 正确，其后像素为 `00 80 40 c0 20 a0...`，与发送的渐变 `00 01 02 03...` 逐位反转。\n\n**根因**：TX sequence 中 pixel/VBK 压流循环按 MSB-first（`j=7..0`）推入 bit_stream，而 CTRL_L/CTRL_F/LSP 均为 LSB-first，发送侧位序不一致。\n\n**修复**：`send_420b_active_line()` 与 `send_420b_vblank_line()` 的压流循环均改为 LSB-first（`j=0..7`），待仿真用 pydec 复核（预期 ACT 区由 MATCH(rev8) 变为 MATCH）。\n\n---\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| longcode 420b | 实验：tb 中 `force` LC_CPUWR 模块时钟为 0（冻结寄存器写入），二分定位\"寄存器 RTL 解码错误导致数据乱写\"假设——现象变则与写入路径相关，不变则排除 | 高 |\n| longcode 420b | 仿真验证 0717v1（帧结构 + rawbyte 日志），复核 K-code 序列 | 高 |\n| longcode 420b | 与 Spec 确认 K3 使用条件（DUT：K4 关解扰、仅 K3 重新使能） | 中 |\n\n---\n\n### 明日计划\n\n- 重跑仿真后逐区域对比 `long_rawbyte_seq_lane0.md` ↔ `long_rtl_dec_lane0.md`（预期 CTRL_L/CTRL_F/VBK 字节一致），并检查 pixel 是否存在 MSB/LSB 位反转。\n\n### 备注\n\n- 本次 debug 为纯日志新增，不改变任何发送逻辑/时序/LFSR 状态。\n- 字节取自源头（reg_q/pixels/vbk/lsp_raw），避免 bit_stream 反推的位序歧义。\n- force LC_CPUWR 时钟实验已同步记录到 `LC_CPUWR_history/LC_CPUWR_20260716_v1_changelist.md`「调试实验记录」节。\n- pydec（DAP 离线解码）已证实线上数据正确：LSP 区域解码为 `ed ec eb ea`×8、CTRL_F 64B 与发送一致；剩余差异在 RTL 解码侧（区域边界残流、位级错误、尾部溢出）。\n", "HK1V11/每日记录_0720.md": "# 每日记录 - 07/20 (星期一)\n\n### 今日完成\n\n#### longcode 420b 验证报告（团队分享）\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 结构图重绘 | 三张主图更新至 0717v1：整体架构、新增 pydec 收发框图（不看 RTL、脚本离线解码比对）、对比图修正 LSB-first 位序 | ✅ 已发布 |\n| spec 图重绘 | 重画 7 张 spec 图（编码规则 4 张 + 帧结构 3 张），K1 码值按 ref model 源码校正 | ✅ 已发布 |\n| 内容同步 | 架构/首页/问题页更新到 0717v1：帧结构修改、四项联调修复、离线验证结论；问题页重组为待跟进/待确认/已解决 | ✅ 已发布 |\n| 视觉优化 | 应用 statbar / flow / badge 组件，版宽 +30% | ✅ 已发布 |\n| 发布 | 两次推送上线；遇 GitHub Actions 故障排队约 1 小时，恢复后部署成功 | ✅ |\n\n> 报告地址：https://ymzhuuuuufz0313 tag 搜索跳过保留值 0/63、pydec 同步；1044 块 roundtrip 全对 | ✅ |\n| 错码定位 | \"40→00 / 50→40\" 根因 = 无替换块标记 + DUT `decode_ignore` 位宽 bug（6-bit tag_value 对 7-bit 常量），修复后错码消失 | ✅ |\n| 错码定位 | \"FC/FE/FF\" 错码全部落在真实 0x7F 替换组上（线上数据无误），指向 DUT 还原/21-bit 重组路径 | 🟡 待 RTL 跟进 |\n| Debug 工具 | 新增替换点自动判定：`long_rtl_tag_debug.sv`（bind `decoder_7b`，异常带 blk/grp 坐标）+ `check_rtl_tag.py` | ✅ |\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| CHPI_CONFIG_L0 | 上游升 24bit 输出（每拍 3 字节采样 + `FCONFIG_END=5'd20`/`LCONFIG_END=3'd3`）—— 外部依赖 | 高 |\n| LC_CPUWR | 上游升版后删除 `LINK_LOGIC` tie-off；跑 checksum/I2C/reset 回归（chip_sel=0/1） | 高 |\n\n### 发现问题\n\n| 模块 | 问题 | 影响 | 状态 |\n|------|------|------|------|\n| DV_TCON_C | 服务器 0716 同步遗漏 env FSEL 更新（checker baseline 停在 0708v1、env_cfg/reg_model/reg_define 无 FSEL） | 工作 env 与 current_env 不一致 | 🔵 当日已补齐 |\n| 团队分享 | `lsi_unprotected_address_map.svg` 长字段名截断为 \"…\"（`regr_lane_*`/`reg_fast_lock_*` 等 20+ 处） | 寄存器图可读性差 | 🔵 当日已重排修复 |\n\n### 明日计划\n\n- 跟进上游 `CHPI_CONFIG_L0` 24bit 升版的 owner 与时间节点。\n- 0721v1 回归准备：梳理 case 清单与预期（XOR 总量不变，行为应无退化）。\n\n### 备注\n\n- 0721v1 关键性质：3 字节拍重组只是 XOR 重新加括号（结合律），checksum 总量与 0716_v1_work 完全相同，checker/DV 回归行为预期不变。\n- 拍映射：`FREG 5'h01~5'h14`（20 拍）、`LREG 3'h1~3'h2`（2 拍）；数据源规则 `addr%3==0→C、==1→D、==2→F`（LCONFIG 为 A/B/E）。\n- 写数据源替换脚本 `remap_datasrc_0721.ps1`：按行匹配 `R_REG/shadow` 寄存器名做映射替换；首轮漏 shadow 15 行，修正正则后补齐至 127 行。\n- LSI 图重排脚本 `regen_lsi_map.py`：解析原 SVG cell（颜色/位序/位宽），再从 `chip_sel0/1_register_address_map.md` 按 `(addr, hi, lo)` 恢复全字段名；统一 124px 位列宽 + 自适应字号，保证任何长名完整显示。\n", "HK1V11/每日记录_0722.md": "# 每日记录 - 07/22 (星期三)\n\n### 今日完成\n\n#### longcode 420b 调试工具链（替换点自动判定 + 离线重组）\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| Debug 增强 | `long_rtl_tag_debug.sv` 新增 `dout_21b_max` 全量 dump（`long_rtl_max_lane0.md`：每 chunk 一行 blk/grp/tag/ign/组值，iverilog 检查通过） | ✅ |\n| 工具脚本 | 新增 `decode_max.py`：max dump 按 7-bit 组 LSB-first 重组字节，与 golden 逐段 diff，差异带 (blk,grp) 坐标 | ✅ 自测通过 |\n| 验证 | 合成 154B 流零差异；注入单组错误后精确定位 `@0 (blk=0 grp=0)` | ✅ |\n| 文档 | CHANGELOG v9.13、README debug 表同步 | ✅ |\n\n> 用途：分离 DUT 解码错误层级——`maxdec == golden` 而 `rtl_dec != golden` → 替换点后重组/解扰问题；`maxdec != golden` → 替换逻辑本身问题。\n\n#### longcode 420b 问题定位（tag_value 块边界时序错）\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 根因更新 | `check_rtl_tag.py` 0 异常 + `compare_pkt20.py`（DAP 源）收发一致，但 DUT 字节仍错；波形确认第五行最后 `7'h41`（`{1,tag=1}`）应替换为 `0x7F`，因 `tag_value` 提前切到下一个块 tag 而漏替换 | ✅ 已定位 |\n| 根因更新 | 更新错码根因：v9.11 的 \"DUT 0x7F 替换组还原/重组错\" → **tag_value 块边界时序错**；最终表现为 `FC→04`/`FE→0E`/`FF→FF`/`FE FF→7E F0` | ✅ 已记录 |\n| 文档 | CHANGELOG v9.17、`longcode_spec_understanding.md` 6.1 节、`current_work/README` 同步更新 | ✅ |\n\n---\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| longcode 420b | RTL 侧修复 `tag_value` 更新时机：当前块 59 个组处理完后再加载下一个块 header 的 tag | 高 |\n| longcode 420b | 修复后重跑仿真，用 `check_rtl_tag.py` + `decode_max.py` + `compare_pkt20.py` 回归验证 | 高 |\n| LC_CPUWR | 跟进上游 CHPI_CONFIG_L0 24bit 升版，删除 tie-off 后跑 0721v1 回归 | 中 |\n\n---\n\n### 发现问题\n\n#### longcode 420b RTL 解码\n\n| 模块 | 问题 | 影响 | 状态 |\n|------|------|------|------|\n| `decoder_7b` | `tag_value` 在 420-bit 块边界处提前更新到下一个块的 tag，导致当前块末尾替换组（如 `{1,tag=1}`=`0x41`）用错 tag、未被替换，下游重组字节错（`FC→04`/`FE→0E`/`FF→FF`/`FE FF→7E F0`） | DUT 解码字节在 ramp 回卷区出错；DV 侧 encode/线上数据/pydec 已确认无误 | 🟡 RTL 侧（俊杰）待修复更新时机 |\n\n---\n\n### 明日计划\n\n| longcode 420b | 与设计/俊杰对齐 `tag_value` 时序修复方案；仿真验证修复后字节流 |\n| longcode 420b | 更新 team-share 公开文章：补充 0722 tag_value 时序问题定位 |\n\n### 备注\n\n- 新工具链全部在 `longcode_ver/current_work/`：`long_rtl_tag_debug.sv`（tag 判定 + max dump）、`check_rtl_tag.py`、`decode_max.py`；case `test.f` 已包含 tap 文件。\n- 0722 根因更新：不是\"替换组还原/重组路径\"错，而是 `tag_value` 块边界提前更新导致漏替换；波形证据为有效行第五行最后 `7'h41` 未替换为 `0x7F`。\n", "HK1V11/每日记录_0724.md": "# 每日记录 - 07/24 (星期五)\n\n### 今日完成\n\n#### 综合集成流程公开报告（synthesis-integration-flow-guide）\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 内容补全 | 融合后端流程培训会议的视频、文字记录与总结，补全 backend_flow 介绍 | ✅ |\n| 新增页面 | 新增 PT 介绍独立页面，作为后续持续补充的基础版本 | ✅ |\n| 交互优化 | 学习路径页增加可勾选交互 checklist | ✅ |\n| 呈现优化 | 关键数值（400/150ps、±3.5ns 等）做成高亮卡片 | ✅ `*.bak_<日期>` 识别为原地保留 |\n| 后端流程 | `plan_summary` 漏改 return（3 值接口只返 2），全量 dry-run 在 summary 段崩溃 | dry-run 中断 | 🔵 已修，全流程复测通过 |\n\n> 教训：改动多返回值接口时，沙箱测试必须覆盖全路径（当轮只测了 `--corner` 跳过 summary 才漏掉）。\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| 后端流程 | 单 corner 试跑新 run_pt，验证 `history/20260910_0` 自动生成 | 高 |\n| 后端流程 | 全量 `pararrel_run_pt.py` + `./run_summary` 闭环一轮（汇总落 `summary/history/20260910_1`） | 高 |\n| 服务器环境 | SOS 登记本次 PT 结构变更周知（新路径/新工具/回退方式） | 中 |\n| 服务器环境 | 新链路稳定一轮后清理 `.bak_20260910` 备份与 `timing_report/`（run_all 化石产物） | 低 |\n\n### 明日计划\n\n- 单 corner 试跑 → 全量 PT → run_summary，完成新结构下第一个完整闭环\n- tt_cworst_25 无 0909 run（latest 正确回退 0604_9），本轮跑完自动补上 20260910_0\n\n### 备注\n\n- tt_cworst_25 为 10 个 run（无 0909 轮），latest 回退指向 `history/20260604_9`，属设计行为非异常\n- 评估报告的 P0/P1（skew 脚本重写、网表/spef 同源、时序收敛）本轮未动，维持遗留跟踪\n- 仓库推送 3 个 commit：82994bd（结构改造）、f5cc45a（英文化）、85199ce+b7440ca（bak 保留 + return 修复）\n", "HK1V11/每日记录_0914.md": "# 每日记录 - 09/14 (星期一)\n\n### 今日完成\n\n#### [后端流程/postPT]\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| 重跑 | hmnie 0914 新 APR 交付后 postPT 重跑 | ✅ 跑通 |\n| 问题定位 | 时序报告 cell /I 行 Delta/Incr 全 0 → SPEF 注解率仅 0.2% | ✅ 实锤 |\n| 根因确认 | 硬编码 hmnie 0914 新网表 + PR_PATH 指 yzhao 0605 旧 spef，跨源跨版（P0-2 现形） | ✅ |\n| 修复 | design.set PR_PATH 切回 hmnie；read_verilog 改 `${PR_PATH}` 同源 | ✅ |\n| 验证 | 改后注解率恢复、时序结果正常 | ✅ 用户确认 |\n| 调研 | 2M23 deploy_fc.py 机制 + PT 报告结构对比总结（为 1V11 部署脚本备料，仅总结未改动） | ✅ |\n\n---\n\n## 🎯 关键结论：postPT \"INCR 全 0\" = SPEF 没注上，互连被当理想导线 ✅\n\n> ### 📌 网表（hmnie 0914 新交付）与 spef（yzhao 0605 旧交付）跨源跨版，注解率 0.2%，该批时序数字全部作废——**网表 / spef / postcts SDC 三件套必须同源同版**。\n\n### 🔍 验证过程（证据链）\n\n| 步骤 | 内容 | 产出 |\n|------|------|------|\n| ① 症状 | 时序报告每个 cell 的 /I 输入脚行 Delta/Incr 全 0，Path 列仍在累加 | 时序报告截图 |\n| ② 注解率 | `report_annotated_parasitics -check`：19913 条 net 仅 42 条注上（0.2%） | report_annotated.log |\n| ③ 对照基线 | 6/04 健康跑：pin-to-pin 10394 条 Not Annotated=0，/I 行非零且带 `&` 标记 | 本地 0909V2 存档 |\n| ④ 版本比对 | hmnie latest=09/14（网表 372KB）；yzhao latest=06/05（212KB），明显两代 | 两侧 `ls -l` |\n\n### ✅ 修复与 \n| CLKB（DPLC） | **DPLC_CLK** & en_even（:742,744 DPLC 支）；DPLC_CLK=u_gate_MUX_DPLC_CLK/O（CLKGEN.v:190-195） | ❌ 该 pin 无 create_generated_clock，探不了 |\n| DB 奇数位（a） | data_out_tmp（模式选择在此！:556-582）→ DB0/2/4_pre（:647-666，**PIX_CLK=DCLK_DATA 域**，CENTER1.v:235）→ &en → pad（:752-761） | ✅ DB*_pre_reg* 覆盖，且**天然覆盖两种模式** |\n| DB 偶数位（b） | …→ DB1_pre（DCLK_DATA 域）→ **DB1/3/5（SD_CLK_INV 域半拍，:672-679）** → pad | ✅ DB*_reg* 与 RTL 域划分一致 |\n| SLIN/SRIN | start_1st/2nd 寄存器（:700-719）→ SHL mux（:735-737） | ✅ |\n| 左右两侧 | 单 DTCTL 同时驱动 DBL+DBR（仅 en 门控/SHL 相位不同，:752-761） | ✅ 共用探针正确，非遗漏 |\n| en_* 使能路径 | data_cnt 组合逻辑（:726） | ✅ **有意不测**（准静态行级使能，2M23 同口径） |\n\n**唯一发现的错误**：clk_b 文件第二条探针 `u_gate_MUX_SD_CLK/CLKMUX2X2/O`（=SD_CLK）——SD_CLK 只驱动反相器产生 CLKA，**从不驱动 CLKB**。数值影响≈一级反相器延迟（run 20260916_10 数据仍合理），但方法论上属\"混入非驱动源\"，应移除。\n\n### 📐 二、选点标准（成文 4 条）\n\n1. 时钟探针 = pad 时钟**全部真实驱动源**的最后一个共用分叉门输出脚，脚上必须有 create_generated_clock（否则 PT 不认，UITE-416 教训）。\n2. 多模式 pad → 逐模式取**真实驱动源**做包络；非驱动源=污染。\n3. 数据探针 = 端口扇入**末级寄存器族全集**（RTL 追链，不是违例 top-N）；有意不测的要注明。\n4. 逐族记录启动时钟域（本设计 a=DCLK_DATA、b=SD_CLK_INV 半拍）——margin 解读与模式分组都靠它。\n\n### 🔍 三、怎么证明没有遗漏（三法）\n\n| 法 | 做法 | 一句话 |\n|---|---|---|\n| RTL 追链 | 每端口 assign 链回溯到寄存器 | 设计侧静态证明（本次做法） |\n| PT 反向全起点 | `report_timing -to [get_ports DBL0*]`（**无 -from**）→ 全部 Startpoint ⊆ 探针族 | 网表侧动态证明，建议下轮 run 附带 |\n| 报表自检 | 数据 rpt 的 Startpoint 去重集应全落在探针族内 | 每次 run 的廉价回归 |\n\n### 📊 四、2M23 怎么选的、我们怎么参考的\n\n| 维度 | 2M23 | 1V11 | 结论 |\n|---|---|---|---|\n| 数据探针 | 每端口 6+ 源（DATA0..5_L0/L1_PRE*、CH_CNT_pre*、SL/SR_DLY*…） | 每端口 1-2 源 | **不是遗漏**：2M23 双 DTCTL_L0/L1+CH_CNT 复用；1V11 单 DTCTL 末级唯一，架构不同 |\n| 时钟探针 | 分频链 4-5 个分叉点/文件（BUF_DCLK0_DIV/O、ADJ 路、1.5 分频路） | 1 点（a）/2 点（b，1 个错） | 2M23 多点因左右各有 ADJ 调整路；1V11 单 CLKGEN 单源，1 点正确 |\n| 端口约束 | set_output_delay 0.5 + set_max_delay 14（:647-658）→ 报表有 check | 无 | 🔴 参考时漏掉的前提（已补草案待评审） |\n| 场景分离 | latest_1p / latest_2p 两个 run 目录 | 单 run 混传播 | ⚠️ dplc 分组要补 |\n| 踩坑史 | 注释行显示也试过寄存器探针后放弃 | UITE-416 同款 | 殊途同归→三原则 |\n\n**参考方式小结**：采纳了三原则+包络概念；漏参考两点（端口约束前提、场景分离）；包络概念用错一次（clk_b 第二探针）。\n\n### ⚠️ 五、DPLC 通路为什么什么都没有（四层，按因果排序）\n\n1. **文件集缺**：脚本不生成 *_dplc_* 8 份文件 → csv dplc 行空白（诚实留空，**不是哨兵**，与 -99x 不同）。\n2. **时钟探针缺**：DPLC 模式 CLKB=DPLC_CLK，源 pin 无生成时钟 → PT 不认做时钟起点。\n3. **分组缺**：CLKA 两模式同源（已顺带覆盖）；b 侧寄存器被 4 个模式变体时钟（SD_CLK_INV_SHORT/LONG/DPLC_*）同时传播——**DPLC 路径其实混在 1p 报表里测到了**，只是没按 launch clock 分开统计。\n4. **约束缺**：无 set_max_delay，补文件也只是无约束路径。\n\n---\n\n### 发现问题\n\n| 模块 | 问题 | 影响 | 状态 |\n|------|------|------|------|\n| skew 脚本 | clk_b 第二探针非 CLKB 驱动源 | 包络污染（数值影响≈反相器延迟） | 🟡 待移除 |\n| SDC | DPLC_CLK（u_gate_MUX_DPLC_CLK/O）无生成时钟 | DPLC 模式 CLKB 不可测 | 🟡 待草案 |\n\n### 下一步待做\n\n| 模块 | 事项 | 优先级 |\n|------|------|--------|\n| skew 脚本 | 移除 clk_b 第二探针（彦铭确认后执行） | 中 |\n| SDC | DPLC_CLK 生成时钟草案（先确认 PIX_CLK_LONG/DPLC_CLK_SHORT 上游） | 中 |\n| SDC | set_max_delay 14 草案评审（jjlu/后端） | 高 |\n| POSTPT | 附加 audit：`report_timing -to [get_ports DBL*]` 全起点比对 | 中 |\n| POSTPT | dplc 文件集 + 按 launch clock 分组方案 | 中 |\n\n### 明日计划\n\n- 复核 run 20260916_10 结果正确性（彦铭）\n- 彦铭提供一版服务器文件\n- 推进 G2/G9/G10/G11 + SD 输出约束评审\n\n### 备注\n\n- 完整版审计（含全部 file:line 证据）已入仓：`修改记录/skew_probe_audit_20260917.md`\n- 本复盘的判定原则：**\"数据合理\"不能作为正确性依据**（假数据也可以合理，+2.84 的教训）；正确性只能来自驱动链证据。\n\n## 0917 追加：0917V1 RTL 覆盖 + 0917V0 SYNTHESIS 分析\n\n### 今日完成（追加）\n\n| 类型 | 事项 | 结果/状态 |\n|------|------|----------|\n| RTL 覆盖 | 0917V1 包覆盖 HDL/（仅 6 文件：CLKGEN DPLC 时钟树正式化、SHORT_ALIGN K*_FIND/DATA_POINT_LAT 寄存器化、LC_MONBLOCK +1'b0→+1'b1 真 bug、CDR 同步、REG_MAPPING CHIP_SEL 门控、FPGA 属性）；删除本地多余 TOP/LOGIC_CENTER.v | ✅ `d160906`/`feae1cd` |\n| 实测复核 | 18:58 run 4 份 clk 报表：Startpoint 唯一=INV_SD_CLK_INV 时钟源、4 模式时钟×16 条 arrival、**全部 (Path is unconstrained)**；clk_b 第二探针实测 0 路径（PT 不穿第二时钟源点）→冗余无害；io 报表 \"No constrained paths\" | ✅ |\n| 部署对账 | 包内 ip_cons：G10/round5/G9/G11/G2 全部在位；**输出端口约束=0**（唯一活动端口约束是输入侧 set_input_delay L184-185） | ✅ |\n| set_max_delay 定案 | 内部路径有一批（L192-202/L526-531），输出口一个没有；2M23 对照 L591-658（-min 2.6/2.2、0.5、set_max_delay 14）；证据文件全部定位到行 | ✅ |\n\n### 关键数字\n\nsetup（本包权威值）：wc_cbest 129（-0.632 gating）/ wc_cworst 29 / wc_typical 39，其余 7 corner 全 0；skew clk arrival ≈5
