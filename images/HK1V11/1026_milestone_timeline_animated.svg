    </rect>
    <text x="455" y="124" text-anchor="middle" font-size="13" font-weight="bold"><tspan font-size="19" fill="#7ce7a6">73+</tspan><tspan fill="#c9dcf0"> 里程碑</tspan></text>

    <rect x="585" y="98" width="230" height="40" rx="8" fill="#10304f" stroke="#ffd166" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="700" y="124" text-anchor="middle" font-size="13" font-weight="bold"><tspan font-size="19" fill="#ffd166">4</tspan><tspan fill="#c9dcf0"> 大目标达成</tspan></text>

    <rect x="830" y="98" width="230" height="40" rx="8" fill="#10304f" stroke="#ff7b72" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2s" begin="1.2s" repeatCount="indefinite"/>
