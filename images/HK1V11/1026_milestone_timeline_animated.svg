  <text x="40" y="66" font-size="13" fill="#8fb3d4">116 rounds · 73+ 里程碑 · 四大目标全部达成 · 穷尽一切方法</text>
  <line x1="40" y1="78" x2="1360" y2="78" stroke="#2c517a" stroke-width="1.5"/>

  <!-- ============ STATS CHIPS ============ -->
  <g>
