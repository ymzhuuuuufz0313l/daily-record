    <text x="210" y="124" text-anchor="middle" font-size="13" font-weight="bold"><tspan font-size="19" fill="#4fd1ff">116</tspan><tspan fill="#c9dcf0"> rounds</tspan></text>

    <rect x="340" y="98" width="230" height="40" rx="8" fill="#10304f" stroke="#7ce7a6" stroke-width="1.5">
