    <text x="945" y="124" text-anchor="middle" font-size="13" font-weight="bold"><tspan font-size="19" fill="#ff7b72">0</tspan><tspan fill="#c9dcf0"> 数字 DUT bug</tspan></text>

    <rect x="1075" y="98" width="230" height="40" rx="8" fill="#10304f" stroke="#c792ea" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="1190" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#c792ea">原工程未破坏</text>
