<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#143354" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1400" height="940" fill="#0b1f33"/>
  <rect width="1400" height="940" fill="url(#grid)"/>

  <!-- ============ HEADER ============ -->
  <text x="40" y="42" font-size="25" font-weight="bold" fill="#eaf4ff">HK1V11 632-case 全量回归 · 5 类 100% 定性闭环</text>
  <text x="40" y="66" font-size="13" fill="#8fb3d4">VCS O-2018.09-1 + UVM 1.1 · 577/632 跑完（含基线 55）· 通过率 8.0% · 核心结论：0 个数字 DUT bug</text>
  <line x1="40" y1="78" x2="1360" y2="78" stroke="#2c517a" stroke-width="1.5"/>

  <!-- header badge -->
  <g filter="url(#glow)">
    <rect x="1188" y="20" width="172" height="44" rx="8" fill="none" stroke="#7ce7a6" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="1274" y="40" font-size="15" font-weight="bold" fill="#7ce7a6" text-anchor="middle">5 类闭环</text>
    <text x="1274" y="57" font-size="11" fill="#8fb3d4" text-anchor="middle">M58–M64 · M75</text>
  </g>

  <!-- ============ LEFT PANEL: 5 BARS ============ -->
  <g>
    <rect x="40" y="95" width="520" height="795" rx="10" fill="#0e2a47" stroke="#3f6b96" stroke-width="1.5"/>
    <text x="60" y="122" font-size="16" font-weight="bold" fill="#eaf4ff">5 类定性分布（577 case）</text>
    <line x1="55" y1="135" x2="545" y2="135" stroke="#2c517a"/>

    <!-- Bar 1: PASS 46 -->
    <g>
      <text x="60" y="168" font-size="14" font-weight="bold" fill="#7ce7a6">PASS</text>
      <text x="118" y="168" font-size="12" fill="#8fb3d4">含 0 错误完成</text>
      <rect x="60" y="178" width="350" height="24" rx="4" fill="#10304f" stroke="#3f6b96" stroke-width="0.5"/>
      <rect x="60" y="178" width="0" height="24" rx="4" fill="#155e46">
        <animate attributeName="width" from="0" to="32" dur="1.2s" begin="0s" fill="freeze"/>
      </rect>
      <text x="68" y="196" font-size="17" font-weight="bold" fill="#d9f7e8">46</text>
      <text x="60" y="220" font-size="11" fill="#c9dcf0">I2C checksum 全系 26 + 4 功能链（串行数据/I2C/420b/AVE）</text>
      <text x="60" y="236" font-size="11" fill="#8fb3d4">+ 基线/DIRECT_OUT/EQ_MODE1/DBCO_DRV0/bcc_mode2/3 等</text>
    </g>

    <!-- Bar 2: 50x analog pol error 506 -->
    <g>
      <text x="60" y="272" font-size="14" font-weight="bold" fill="#4fd1ff">50× [analog pol error]</text>
      <text x="60" y="290" font-size="11" fill="#8fb3d4">纯模拟输出失配（DRA 晶体管级 · SIM_OUT=X）</text>
      <rect x="60" y="298" width="350" height="24" rx="4" fill="#10304f" stroke="#3f6b96" stroke-width="0.5"/>
      <rect x="60" y="298" width="0" height="24" rx="4" fill="#1a4a6e">
        <animate attributeName="width" from="0" to="350" dur="1.2s" begin="0.4s" fill="freeze"/>
      </rect>
      <text x="68" y="316" font-size="17" font-weight="bold" fill="#4fd1ff">506</text>
      <text x="60" y="340" font-size="11" fill="#c9dcf0">50 个奇数口（1,3,…,99）期望 MSB=1 全得 0</text>
      <text x="60" y="356" font-size="11" fill="#8fb3d4">@339.09us frame_cnt=0 · 无其它 failure mode 混入</text>
    </g>

    <!-- Bar 3: COMPILE_FAIL 11 -->
    <g>
      <text x="60" y="396" font-size="14" font-weight="bold" fill="#ff7b72">COMPILE_FAIL</text>
      <text x="190" y="396" font-size="12" fill="#8fb3d4">test 侧</text>
      <rect x="60" y="406" width="350" height="24" rx="4" fill="#10304f" stroke="#3f6b96" stroke-width="0.5"/>
      <rect x="60" y="406" width="0" height="24" rx="4" fill="#4a2020">
        <animate attributeName="width" from="0" to="8" dur="1.2s" begin="0.8s" fill="freeze"/>
      </rect>
      <text x="68" y="424" font-size="17" font-weight="bold" fill="#ff7b72">11</text>
      <text x="60" y="448" font-size="11" fill="#c9dcf0">SFCOR 缺文件（smart_cs_checker.sv / cosim_vector / isp_register.sv）</text>
      <text x="60" y="464" font-size="11" fill="#8fb3d4">+ XMRE 跨模块引用（AEQ_PIN / debugpin）</text>
    </g>

    <!-- Bar 4: stuck / CDR 不锁 11 -->
    <g>
      <text x="60" y="500" font-size="14" font-weight="bold" fill="#ffd166">stuck / CDR 不锁</text>
      <text x="210" y="500" font-size="12" fill="#8fb3d4">模拟 CDR PLL</text>
      <rect x="60" y="510" width="350" height="24" rx="4" fill="#10304f" stroke="#3f6b96" stroke-width="0.5"/>
      <rect x="60" y="510" width="0" height="24" rx="4" fill="#3d3518">
        <animate attributeName="width" from="0" to="8" dur="1.2s" begin="1.2s" fill="freeze"/>
      </rect>
      <text x="68" y="528" font-size="17" font-weight="bold" fill="#ffd166">11</text>
      <text x="60" y="552" font-size="11" fill="#c9dcf0">"Both RB and SB enabled at the same time"（300–360 警告/case）</text>
      <text x="60" y="568" font-size="11" fill="#8fb3d4">+ link training 超时 · I2C 数字 check 全 pass（pass=14–24, fail=0）</text>
    </g>

    <!-- Bar 5: CHPI REGW WRITE FAIL 3 -->
    <g>
      <text x="60" y="604" font-size="14" font-weight="bold" fill="#c792ea">CHPI REGW WRITE FAIL</text>
      <rect x="60" y="614" width="350" height="24" rx="4" fill="#10304f" stroke="#3f6b96" stroke-width="0.5"/>
      <rect x="60" y="614" width="0" height="24" rx="4" fill="#2d1f45">
        <animate attributeName="width" from="0" to="2" dur="1.2s" begin="1.6s" fill="freeze"/>
      </rect>
      <text x="66" y="632" font-size="17" font-weight="bold" fill="#c792ea">3</text>
      <text x="60" y="656" font-size="11" fill="#c9dcf0">CS0/CS1 读回 0（期望 1）：配置正确写 CS=1</text>
      <text x="60" y="672" font-size="11" fill="#8fb3d4">CS_SYNC 仅训练脉冲（TP_ACT0_SET_OK）时锁值 · TP 未激活 → 保持 0</text>
    </g>

    <!-- summary line inside left panel -->
    <line x1="55" y1="695" x2="545" y2="695" stroke="#2c517a"/>
    <text x="60" y="718" font-size="12" fill="#8fb3d4">合计 577/632 · 基线 55 已跑</text>
    <text x="60" y="740" font-size="12" fill="#8fb3d4">通过率 8.0%（46/577）</text>
    <text x="60" y="762" font-size="12" fill="#8fb3d4">timeout -k 15 480 强杀不收敛 case</text>
    <text x="60" y="784" font-size="12" fill="#8fb3d4">master_matrix.txt 578 行</text>

    <!-- activity dot -->
    <circle cx="545" cy="112" r="5" fill="#7ce7a6">
      <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ TOP RIGHT: DONUT CHART ============ -->
  <g>
    <rect x="580" y="95" width="780" height="390" rx="10" fill="#0e2a47" stroke="#3f6b96" stroke-width="1.5"/>
    <text x="600" y="122" font-size="16" font-weight="bold" fill="#eaf4ff">占比分布</text>
    <line x1="595" y1="135" x2="1345" y2="135" stroke="#2c517a"/>

    <!-- donut: center (820, 300), r=100, circumference=628.32 -->
    <g transform="rotate(-90, 820, 300)">
      <!-- PASS: 46/577*628.32=50.2 -->
      <circle cx="820" cy="300" r="100" fill="none" stroke="#7ce7a6" stroke-width="36"
              stroke-dasharray="50.2 578.1" stroke-dashoffset="0" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
      </circle>
      <!-- 50err: 506/577*628.32=552.1 -->
      <circle cx="820" cy="300" r="100" fill="none" stroke="#4fd1ff" stroke-width="36"
              stroke-dasharray="552.1 76.2" stroke-dashoffset="-50.2" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
        <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.4s" begin="1.3s" repeatCount="indefinite"/>
      </circle>
      <!-- COMPILE_FAIL: 11/577*628.32=12.0 -->
      <circle cx="820" cy="300" r="100" fill="none" stroke="#ff7b72" stroke-width="36"
              stroke-dasharray="12.0 616.3" stroke-dashoffset="-602.3" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
      </circle>
      <!-- stuck: 11/577*628.32=12.0 -->
      <circle cx="820" cy="300" r="100" fill="none" stroke="#ffd166" stroke-width="36"
              stroke-dasharray="12.0 616.3" stroke-dashoffset="-614.3" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
      </circle>
      <!-- CHPI: 3/577*628.32=3.3 -->
      <circle cx="820" cy="300" r="100" fill="none" stroke="#c792ea" stroke-width="36"
              stroke-dasharray="3.3 625.0" stroke-dashoffset="-626.3" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.3s" fill="freeze"/>
      </circle>
    </g>

    <!-- donut center text -->
    <text x="820" y="292" font-size="28" font-weight="bold" fill="#eaf4ff" text-anchor="middle">577</text>
    <text x="820" y="314" font-size="12" fill="#8fb3d4" text-anchor="middle">/ 632 case</text>
    <text x="820" y="332" font-size="11" fill="#5f85ab" text-anchor="middle">5 类全归因</text>

    <!-- legend (right of donut) -->
    <g font-size="12">
      <rect x="980" y="170" width="14" height="14" rx="3" fill="#7ce7a6"/>
      <text x="1002" y="182" fill="#c9dcf0">PASS</text>
      <text x="1060" y="182" fill="#8fb3d4">46（7.3%）</text>

      <rect x="980" y="200" width="14" height="14" rx="3" fill="#4fd1ff"/>
      <text x="1002" y="212" fill="#c9dcf0">50× analog pol error</text>
      <text x="1060" y="212" fill="#8fb3d4">506（87.7%）</text>

      <rect x="980" y="230" width="14" height="14" rx="3" fill="#ff7b72"/>
      <text x="1002" y="242" fill="#c9dcf0">COMPILE_FAIL</text>
      <text x="1060" y="242" fill="#8fb3d4">11（1.9%）</text>

      <rect x="980" y="260" width="14" height="14" rx="3" fill="#ffd166"/>
      <text x="1002" y="272" fill="#c9dcf0">stuck / CDR 不锁</text>
      <text x="1060" y="272" fill="#8fb3d4">11（1.9%）</text>

      <rect x="980" y="290" width="14" height="14" rx="3" fill="#c792ea"/>
      <text x="1002" y="302" fill="#c9dcf0">CHPI REGW WRITE FAIL</text>
      <text x="1060" y="302" fill="#8fb3d4">3（0.5%）</text>
    </g>

    <!-- donut note -->
    <text x="980" y="340" font-size="11" fill="#8fb3d4">506 占主导 → 纯模拟模型问题</text>
    <text x="980" y="358" font-size="11" fill="#8fb3d4">数字 DUT 零 bug（5 类全非数字缺陷）</text>

    <!-- flowing dot on donut -->
    <circle r="4" fill="#4fd1ff">
      <animateMotion path="M820 200 A100 100 0 1 1 819.9 200" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ BOTTOM RIGHT: CONCLUSION ============ -->
  <g>
    <rect x="580" y="505" width="780" height="385" rx="10" fill="#0e2a47" stroke="#3f6b96" stroke-width="1.5"/>
    <text x="600" y="532" font-size="16" font-weight="bold" fill="#eaf4ff">核心结论</text>
    <line x1="595" y1="545" x2="1345" y2="545" stroke="#2c517a"/>

    <!-- green success block -->
    <rect x="600" y="560" width="740" height="72" rx="8" fill="#155e46" stroke="#7ce7a6" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="970" y="590" font-size="26" font-weight="bold" fill="#d9f7e8" text-anchor="middle">0 个数字 DUT bug</text>
    <text x="970" y="618" font-size="13" fill="#a7e6c8" text-anchor="middle">HK1V11 数字设计全部正确 · 全量 5 类 100% 定性闭环（M58–M64）</text>

    <!-- attribution lines -->
    <g font-size="12">
      <rect x="600" y="648" width="360" height="52" rx="6" fill="#10304f" stroke="#3f6b96"/>
      <circle cx="620" cy="668" r="5" fill="#7ce7a6"/>
      <text x="634" y="672" font-weight="bold" fill="#eaf4ff">PASS = 数字正确</text>
      <text x="634" y="690" fill="#8fb3d4">I2C checksum / 4 功能链 / 基线全通过</text>

      <rect x="980" y="648" width="360" height="52" rx="6" fill="#10304f" stroke="#3f6b96"/>
      <circle cx="1000" cy="668" r="5" fill="#4fd1ff"/>
      <text x="1014" y="672" font-weight="bold" fill="#eaf4ff">50err = 模拟模型</text>
      <text x="1014" y="690" fill="#8fb3d4">DRA 晶体管级 · SIM_OUT=X</text>

      <rect x="600" y="710" width="360" height="52" rx="6" fill="#10304f" stroke="#3f6b96"/>
      <circle cx="620" cy="730" r="5" fill="#ff7b72"/>
      <text x="634" y="734" font-weight="bold" fill="#eaf4ff">COMPILE_FAIL = test 侧</text>
      <text x="634" y="752" fill="#8fb3d4">SFCOR 缺文件 / XMRE 跨模块引用</text>

      <rect x="980" y="710" width="360" height="52" rx="6" fill="#10304f" stroke="#3f6b96"/>
      <circle cx="1000" cy="730" r="5" fill="#ffd166"/>
      <text x="1014" y="734" font-weight="bold" fill="#eaf4ff">stuck = 模拟 CDR</text>
      <text x="1014" y="752" fill="#8fb3d4">PLL 警告 + link training 超时</text>

      <rect x="600" y="772" width="360" height="52" rx="6" fill="#10304f" stroke="#3f6b96"/>
      <circle cx="620" cy="792" r="5" fill="#c792ea"/>
      <text x="634" y="796" font-weight="bold" fill="#eaf4ff">CHPI = 训练图案未激活</text>
      <text x="634" y="814" fill="#8fb3d4">TP 未激活 → CS_SYNC 保持 0</text>
    </g>

    <!-- reproducibility -->
    <rect x="600" y="836" width="740" height="42" rx="6" fill="#10304f" stroke="#4fd1ff" stroke-width="1">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="970" y="862" font-size="13" fill="#4fd1ff" text-anchor="middle">复现性：I2C checksum case 重编译重跑 UVM_ERROR=0 / TEST CASE PASSED（M75）</text>
  </g>

  <!-- ============ FOOTER ============ -->
  <line x1="40" y1="912" x2="1360" y2="912" stroke="#2c517a" stroke-width="1"/>
  <text x="40" y="932" font-size="11" fill="#5f85ab">577/632 完成 · 8.0% 通过率 · timeout -k 15 480 强杀不收敛 case · master_matrix.txt 578 行 · 0 个数字 DUT bug</text>
</svg>