  <!-- ============ SUMMARY BAR ============ -->
  <g>
    <rect x="40" y="775" width="1320" height="120" rx="10" fill="#0e2a47" stroke="#7ce7a6" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="805" font-size="15" font-weight="bold" fill="#7ce7a6">总结：0 数字 DUT bug</text>
    <line x1="55" y1="818" x2="1345" y2="818" stroke="#2c517a"/>

    <!-- three summary chips -->
    <rect x="60" y="832" width="380" height="48" rx="6" fill="#10304f" stroke="#ff7b72"/>
    <text x="250" y="852" font-size="12" fill="#ff7b72" text-anchor="middle" font-weight="bold">链 1 · 模拟域 DRA</text>
    <text x="250" y="870" font-size="11" fill="#8fb3d4" text-anchor="middle">晶体管级 leaf 数字仿真不收敛</text>

    <rect x="460" y="832" width="380" height="48" rx="6" fill="#10304f" stroke="#ffd166"/>
    <text x="650" y="852" font-size="12" fill="#ffd166" text-anchor="middle" font-weight="bold">链 2 · 模拟域 CDR</text>
