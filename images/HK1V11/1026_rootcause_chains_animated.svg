<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#143354" stroke-width="1"/>
    </pattern>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#ff7b72"/>
    </marker>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#ffd166"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#c792ea"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1400" height="940" fill="#0b1f33"/>
  <rect width="1400" height="940" fill="url(#grid)"/>

  <!-- ============ HEADER ============ -->
  <text x="40" y="42" font-size="25" font-weight="bold" fill="#eaf4ff">根因调查链 · 三大非 PASS 簇信号级闭环</text>
  <text x="40" y="66" font-size="13" fill="#8fb3d4">60h 循环深挖（M25–M33 / M58 / M59 / M64）· 每条链从现象到 RTL 级根因 · 全部非数字 DUT bug</text>
  <line x1="40" y1="78" x2="1360" y2="78" stroke="#2c517a" stroke-width="1.5"/>

  <!-- ============ CHAIN 1 (red, 50err × 506) ============ -->
  <g>
    <rect x="40" y="95" width="1320" height="210" rx="10" fill="#0e2a47" stroke="#3f6b96" stroke-width="1.5"/>
    <!-- chain title -->
    <circle cx="60" cy="117" r="5" fill="#ff7b72">
      <animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="74" y="122" font-size="15" font-weight="bold" fill="#ff7b72">链 1 · 50err × 506（analog pol error）</text>
    <line x1="55" y1="134" x2="1345" y2="134" stroke="#2c517a"/>

    <!-- Node 1: 现象 -->
    <rect x="55" y="148" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="68" y="170" font-size="12" font-weight="bold" fill="#ff7b72">现象</text>
    <text x="68" y="190" font-size="11" fill="#c9dcf0">50 奇数口 analog pol error</text>
    <text x="68" y="207" font-size="11" fill="#c9dcf0">期望 10101010，全得 0</text>
    <text x="68" y="224" font-size="11" fill="#c9dcf0">@339.09us</text>

    <!-- Node 2: 证据① -->
    <rect x="323" y="148" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="336" y="170" font-size="12" font-weight="bold" fill="#4fd1ff">证据①</text>
    <text x="336" y="190" font-size="11" fill="#c9dcf0">scoreboard 采 ana_SIM_OUT</text>
    <text x="336" y="207" font-size="11" fill="#c9dcf0">[9660:0] 有效采样 100 口</text>
    <text x="336" y="224" font-size="11" fill="#c9dcf0">pol 全 0，其余时段 = X</text>

    <!-- Node 3: 证据② -->
    <rect x="591" y="148" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="604" y="170" font-size="12" font-weight="bold" fill="#4fd1ff">证据②</text>
    <text x="604" y="190" font-size="11" fill="#c9dcf0">MACRO_TOP.SIM_OUT</text>
    <text x="604" y="207" font-size="11" fill="#c9dcf0">(wire[9669:10] DRA 驱动)</text>
    <text x="604" y="224" font-size="11" fill="#c9dcf0">未驱动 = X → bit 显示 0</text>

    <!-- Node 4: 根因 -->
    <rect x="859" y="148" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="872" y="170" font-size="12" font-weight="bold" fill="#ffd166">根因</text>
    <text x="872" y="190" font-size="11" fill="#c9dcf0">DRA_BITCELL leaf =</text>
    <text x="872" y="207" font-size="11" fill="#c9dcf0">晶体管级模拟模型</text>
    <text x="872" y="224" font-size="11" fill="#c9dcf0">(M31HSSC900EL150SL)</text>
    <text x="872" y="241" font-size="11" fill="#c9dcf0">31nm 库 3.7MB 不收敛</text>

    <!-- Node 5: 定性 (green) -->
    <rect x="1127" y="148" width="218" height="130" rx="6" fill="#155e46" stroke="#7ce7a6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="1140" y="170" font-size="12" font-weight="bold" fill="#7ce7a6">定性</text>
    <text x="1140" y="190" font-size="11" fill="#d9f7e8">非 bug（模拟模型本质）</text>
    <text x="1140" y="207" font-size="11" fill="#a7e6c8">golden model 驱动</text>
    <text x="1140" y="224" font-size="11" fill="#a7e6c8">ana_SIM_OUT 是修复路径</text>
    <text x="1140" y="241" font-size="11" fill="#a7e6c8">M55: 0/56 可修</text>

    <!-- connecting lines chain 1 -->
    <line x1="270" y1="213" x2="323" y2="213" stroke="#ff7b72" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrR)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#ff7b72">
      <animateMotion path="M270 213 L323 213" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <line x1="538" y1="213" x2="591" y2="213" stroke="#ff7b72" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrR)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#ff7b72">
      <animateMotion path="M538 213 L591 213" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <line x1="806" y1="213" x2="859" y2="213" stroke="#ff7b72" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrR)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#ff7b72">
      <animateMotion path="M806 213 L859 213" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <line x1="1074" y1="213" x2="1127" y2="213" stroke="#ff7b72" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrR)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" begin="0.9s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#ff7b72">
      <animateMotion path="M1074 213 L1127 213" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ CHAIN 2 (amber, stuck × 11) ============ -->
  <g>
    <rect x="40" y="320" width="1320" height="210" rx="10" fill="#0e2a47" stroke="#3f6b96" stroke-width="1.5"/>
    <!-- chain title -->
    <circle cx="60" cy="342" r="5" fill="#ffd166">
      <animate attributeName="r" values="4;6;4" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="74" y="347" font-size="15" font-weight="bold" fill="#ffd166">链 2 · stuck × 11（仿真超时）</text>
    <line x1="55" y1="359" x2="1345" y2="359" stroke="#2c517a"/>

    <!-- Node 1: 现象 -->
    <rect x="55" y="373" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="68" y="395" font-size="12" font-weight="bold" fill="#ffd166">现象</text>
    <text x="68" y="415" font-size="11" fill="#c9dcf0">仿真卡到 480s 超时强杀</text>
    <text x="68" y="432" font-size="11" fill="#c9dcf0">无 TEST CASE PASSED</text>

    <!-- Node 2: 证据①+② -->
    <rect x="323" y="373" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="336" y="395" font-size="12" font-weight="bold" fill="#4fd1ff">证据①+②</text>
    <text x="336" y="415" font-size="11" fill="#c9dcf0">300–360 条 CDR 警告</text>
    <text x="336" y="432" font-size="11" fill="#c9dcf0">R/S-band 同时使能</text>
    <text x="336" y="449" font-size="11" fill="#c9dcf0">(物理不应发生)</text>
    <text x="336" y="466" font-size="11" fill="#c9dcf0">ISPTX link training timeout</text>

    <!-- Node 3: 证据③ -->
    <rect x="591" y="373" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="604" y="395" font-size="12" font-weight="bold" fill="#4fd1ff">证据③</text>
    <text x="604" y="415" font-size="11" fill="#c9dcf0">I2C 数字 check 全 pass</text>
    <text x="604" y="432" font-size="11" fill="#c9dcf0">password_rw_match=16</text>
    <text x="604" y="449" font-size="11" fill="#c9dcf0">rst_chip_sel1=24</text>
    <text x="604" y="466" font-size="11" fill="#c9dcf0">fail = 0</text>

    <!-- Node 4: 根因 -->
    <rect x="859" y="373" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="872" y="395" font-size="12" font-weight="bold" fill="#ffd166">根因</text>
    <text x="872" y="415" font-size="11" fill="#c9dcf0">模拟 CDR PLL 模型</text>
    <text x="872" y="432" font-size="11" fill="#c9dcf0">不干净锁定</text>
    <text x="872" y="449" font-size="11" fill="#c9dcf0">→ link training 不收敛</text>

    <!-- Node 5: 定性 (green) -->
    <rect x="1127" y="373" width="218" height="130" rx="6" fill="#155e46" stroke="#7ce7a6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="1140" y="395" font-size="12" font-weight="bold" fill="#7ce7a6">定性</text>
    <text x="1140" y="415" font-size="11" fill="#d9f7e8">模拟模型限制</text>
    <text x="1140" y="432" font-size="11" fill="#a7e6c8">非数字 bug</text>
    <text x="1140" y="449" font-size="11" fill="#a7e6c8">I2C 数字功能本身正确</text>

    <!-- connecting lines chain 2 -->
    <line x1="270" y1="438" x2="323" y2="438" stroke="#ffd166" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrA)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#ffd166">
      <animateMotion path="M270 438 L323 438" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <line x1="538" y1="438" x2="591" y2="438" stroke="#ffd166" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrA)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#ffd166">
      <animateMotion path="M538 438 L591 438" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="806" y1="438" x2="859" y2="438" stroke="#ffd166" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrA)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#ffd166">
      <animateMotion path="M806 438 L859 438" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <line x1="1074" y1="438" x2="1127" y2="438" stroke="#ffd166" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrA)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" begin="1.1s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#ffd166">
      <animateMotion path="M1074 438 L1127 438" dur="1.6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ CHAIN 3 (purple, CHPI × 3) ============ -->
  <g>
    <rect x="40" y="545" width="1320" height="210" rx="10" fill="#0e2a47" stroke="#3f6b96" stroke-width="1.5"/>
    <!-- chain title -->
    <circle cx="60" cy="567" r="5" fill="#c792ea">
      <animate attributeName="r" values="4;6;4" dur="1.8s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.8s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="74" y="572" font-size="15" font-weight="bold" fill="#c792ea">链 3 · CHPI × 3（CS_SYNC 读回 0）</text>
    <line x1="55" y1="584" x2="1345" y2="584" stroke="#2c517a"/>

    <!-- Node 1: 现象 -->
    <rect x="55" y="598" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="68" y="620" font-size="12" font-weight="bold" fill="#c792ea">现象</text>
    <text x="68" y="640" font-size="11" fill="#c9dcf0">chpi_regw 写 ~36 信号</text>
    <text x="68" y="657" font-size="11" fill="#c9dcf0">34 个 R_* WRITE SUCCESS</text>
    <text x="68" y="674" font-size="11" fill="#c9dcf0">仅 CS0/CS1 读回 0</text>
    <text x="68" y="691" font-size="11" fill="#c9dcf0">(期望 1)</text>

    <!-- Node 2: 证据① -->
    <rect x="323" y="598" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="336" y="620" font-size="12" font-weight="bold" fill="#4fd1ff">证据①</text>
    <text x="336" y="640" font-size="11" fill="#c9dcf0">cfg_frame0.txt 正确写</text>
    <text x="336" y="657" font-size="11" fill="#c9dcf0">CS0=1, CS1=1 (2'b11)</text>
    <text x="336" y="674" font-size="11" fill="#c9dcf0">+ SMART_CS=1111</text>

    <!-- Node 3: 证据②+③ -->
    <rect x="591" y="598" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="604" y="620" font-size="12" font-weight="bold" fill="#4fd1ff">证据②+③</text>
    <text x="604" y="640" font-size="11" fill="#c9dcf0">CS_SYNC 仅 TP_ACT0_</text>
    <text x="604" y="657" font-size="11" fill="#c9dcf0">SET_OK 时更新</text>
    <text x="604" y="674" font-size="11" fill="#c9dcf0">(CHPI_SD_CTRL.v:212)</text>
    <text x="604" y="691" font-size="11" fill="#c9dcf0">0 个 TP_ACT → 从未触发</text>

    <!-- Node 4: 根因 -->
    <rect x="859" y="598" width="215" height="130" rx="6" fill="#10304f" stroke="#3f6b96"/>
    <text x="872" y="620" font-size="12" font-weight="bold" fill="#ffd166">根因</text>
    <text x="872" y="640" font-size="11" fill="#c9dcf0">训练图案 (TP) 未激活</text>
    <text x="872" y="657" font-size="11" fill="#c9dcf0">VM 功能仿真</text>
    <text x="872" y="674" font-size="11" fill="#c9dcf0">link training 限制</text>
    <text x="872" y="691" font-size="11" fill="#c9dcf0">(同链 2 根)</text>

    <!-- Node 5: 定性 (green) -->
    <rect x="1127" y="598" width="218" height="130" rx="6" fill="#155e46" stroke="#7ce7a6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="1140" y="620" font-size="12" font-weight="bold" fill="#7ce7a6">定性</text>
    <text x="1140" y="640" font-size="11" fill="#d9f7e8">非数字 DUT bug</text>
    <text x="1140" y="657" font-size="11" fill="#a7e6c8">测试期望 CS_SYNC=11</text>
    <text x="1140" y="674" font-size="11" fill="#a7e6c8">假设了 TP 已触发</text>

    <!-- connecting lines chain 3 -->
    <line x1="270" y1="663" x2="323" y2="663" stroke="#c792ea" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrP)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#c792ea">
