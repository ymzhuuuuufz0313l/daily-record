    </circle>
    <line x1="538" y1="663" x2="591" y2="663" stroke="#c792ea" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrP)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" begin="0.7s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#c792ea">
      <animateMotion path="M538 663 L591 663" dur="1.6s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <line x1="806" y1="663" x2="859" y2="663" stroke="#c792ea" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrP)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" begin="1s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#c792ea">
      <animateMotion path="M806 663 L859 663" dur="1.6s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <line x1="1074" y1="663" x2="1127" y2="663" stroke="#c792ea" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrP)">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" begin="1.3s" repeatCount="indefinite"/>
    </line>
    <circle r="3.5" fill="#c792ea">
      <animateMotion path="M1074 663 L1127 663" dur="1.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
