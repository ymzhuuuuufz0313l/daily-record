    <rect x="860" y="832" width="480" height="48" rx="6" fill="#10304f" stroke="#c792ea"/>
    <text x="1100" y="852" font-size="12" fill="#c792ea" text-anchor="middle" font-weight="bold">链 3 · 训练图案未激活</text>
    <text x="1100" y="870" font-size="11" fill="#8fb3d4" text-anchor="middle">VM 功能仿真 TP 限制（同链 2 根）· test 侧期望偏差</text>
  </g>

  <!-- ============ FOOTER ============ -->
  <line x1="40" y1="912" x2="1360" y2="912" stroke="#2c517a" stroke-width="1"/>
  <text x="40" y="932" font-size="11" fill="#5f85ab">3 大非 PASS 簇 = 模拟域（DRA/CDR）+ 训练图案未激活 + test 侧（另图）→ 0 数字 DUT bug · 60h 循环 M25–M33 / M58 / M59 / M64</text>
</svg>
